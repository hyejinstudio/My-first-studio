<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 게임 스튜디오</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="게임 스튜디오">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e4572e">
<style>
  :root {
    --bg: #f4f1ea; --panel: #ffffff; --ink: #1f2430; --muted: #6b7280;
    --line: #e7e2d8; --accent: #e4572e;
    --tile-block: #fdebe3; --tile-snake: #e4f0d6; --tile-bunny: #dde5ee;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141a; --panel: #1b1e27; --ink: #eceef3; --muted: #9aa1ae;
      --line: #262a35; --accent: #ff7a50;
      --tile-block: #2a1f1b; --tile-snake: #18241c; --tile-bunny: #1b2330;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12141a; --panel: #1b1e27; --ink: #eceef3; --muted: #9aa1ae;
    --line: #262a35; --accent: #ff7a50;
    --tile-block: #2a1f1b; --tile-snake: #18241c; --tile-bunny: #1b2330;
  }
  * { box-sizing: border-box; }
  html { overflow-x: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    padding: 32px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 960px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  h1 span { color: var(--accent); }
  .sub { margin: 0 0 24px; color: var(--muted); }

  .grid { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 1023px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 639px)  { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 359px)  { .grid { grid-template-columns: minmax(0, 1fr); } h1 { font-size: 24px; } }

  .game {
    display: flex; flex-direction: column; text-decoration: none; color: inherit;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 12px 12px 16px;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    transition: transform 140ms ease-out, border-color 140ms ease-out;
    animation: enter 220ms ease-out both;
  }
  .game:nth-child(2) { animation-delay: 40ms; }
  .game:nth-child(3) { animation-delay: 80ms; }
  .game:nth-child(4) { animation-delay: 120ms; }
  .game:nth-child(n+5) { animation-delay: 160ms; }
  @keyframes enter { from { opacity: 0; transform: translateY(6px); } }
  .game:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 16px; border-color: var(--accent); }
  .game:active { transform: scale(.97); transition-duration: 80ms; }
  .art {
    aspect-ratio: 4 / 3; background: var(--tile); border-radius: 12px;
    display: grid; place-items: center; overflow: hidden;
  }
  .art svg { width: 62%; height: auto; max-height: 82%; transition: transform 140ms ease-out; }
  .game h2 { margin: 12px 4px 4px; font-size: 18px; font-weight: 700; color: var(--ink); }
  .game p {
    margin: 0 4px; color: var(--muted); font-size: 14px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  @media (max-width: 639px) {
    .game h2 { font-size: 16px; }
    .game p { font-size: 13px; }
  }
  @media (hover: hover) {
    .game:hover, .game:focus-visible { transform: translateY(-3px); border-color: var(--accent); }
    .game:hover .art svg, .game:focus-visible .art svg { transform: scale(1.06); }
  }
  @media (prefers-reduced-motion: reduce) {
    .game { animation: none; }
    .game:hover, .game:focus-visible, .game:active { transform: none; }
    .game:hover .art svg, .game:focus-visible .art svg { transform: none; }
  }
</style>
</head>
<body>
<main>
  <h1>나의 게임 <span>스튜디오</span></h1>
  <p class="sub">하고 싶은 게임을 골라보세요.</p>

  <!-- 새 게임은 이 목록 맨 앞에 카드로 추가합니다 (최신 순) -->
  <div class="grid">
    <a class="game" href="games/bunny-ten/" aria-label="하늘다람쥐 텐 — 숫자를 품은 하늘다람쥐들을 네모로 감싸 합이 10이 되면 휘익 날아가는 숫자 퍼즐">
      <div class="art" style="--tile: var(--tile-bunny)">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect x="7" y="6" width="50" height="52" rx="9" fill="#1f8a4c" fill-opacity=".12" stroke="#1f8a4c" stroke-width="2.5"/>
          <ellipse cx="44.5" cy="24" rx="7.5" ry="13.5" transform="rotate(22 44.5 24)" fill="#dbe9f6" stroke="#8a9bb0" stroke-width="1.6"/>
          <circle cx="23.5" cy="22.5" r="4.25" fill="#f7f9fb" stroke="#8a9bb0" stroke-width="1.6"/>
          <circle cx="40.5" cy="22.5" r="4.25" fill="#f7f9fb" stroke="#8a9bb0" stroke-width="1.6"/>
          <circle cx="23.5" cy="23" r="2.25" fill="#cfe0f0"/>
          <circle cx="40.5" cy="23" r="2.25" fill="#cfe0f0"/>
          <ellipse cx="32" cy="36" rx="18" ry="15.5" fill="#f7f9fb" stroke="#8a9bb0" stroke-width="1.6"/>
          <path d="M24.5 32 L27 30 L27 42" fill="none" stroke="#1d2a3f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
          <ellipse cx="35.5" cy="36" rx="3.8" ry="5.6" fill="none" stroke="#1d2a3f" stroke-width="3.4"/>
        </svg>
      </div>
      <h2>하늘다람쥐 텐</h2>
      <p>숫자를 품은 하늘다람쥐들을 네모로 감싸 합이 10이 되면 휘익 날아가는 숫자 퍼즐</p>
    </a>

    <a class="game" href="games/snake-garden/" aria-label="뱀 정원 — 정원을 기어 다니며 열매를 먹고 몸이 길어지는 뱀 게임">
      <div class="art" style="--tile: var(--tile-snake)">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M12 50 C 12 38, 30 40, 30 30 S 46 18, 46 14" fill="none" stroke="#3f9d5a" stroke-width="9" stroke-linecap="round"/>
          <path d="M8 54 L12 50" stroke="#3f9d5a" stroke-width="5" stroke-linecap="round"/>
          <circle cx="16" cy="43" r="1.8" fill="#8fd19e"/>
          <circle cx="27" cy="35" r="1.8" fill="#8fd19e"/>
          <circle cx="36" cy="25" r="1.8" fill="#8fd19e"/>
          <circle cx="47" cy="13" r="7" fill="#2f8049"/>
          <circle cx="44.5" cy="10.5" r="2.2" fill="#fff"/>
          <circle cx="50" cy="12" r="2.2" fill="#fff"/>
          <circle cx="45" cy="10" r="1.1" fill="#1f2430"/>
          <circle cx="50.6" cy="11.6" r="1.1" fill="#1f2430"/>
          <path d="M53 8 l3 -2 m-3 2 l3.4 0.6" fill="none" stroke="#e4572e" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="50" cy="46" r="6" fill="#e0374f"/>
          <circle cx="48" cy="46" r="0.9" fill="#ffd6dc"/>
          <circle cx="52" cy="46.5" r="0.9" fill="#ffd6dc"/>
          <circle cx="50" cy="49" r="0.9" fill="#ffd6dc"/>
          <circle cx="47.6" cy="43.6" r="1.5" fill="#fff" opacity=".5"/>
          <ellipse cx="47.8" cy="39.6" rx="2.6" ry="1.3" transform="rotate(-25 47.8 39.6)" fill="#3f9d5a"/>
          <ellipse cx="52.2" cy="39.6" rx="2.6" ry="1.3" transform="rotate(25 52.2 39.6)" fill="#3f9d5a"/>
        </svg>
      </div>
      <h2>뱀 정원</h2>
      <p>정원을 기어 다니며 열매를 먹고 몸이 길어지는 뱀 게임</p>
    </a>

    <a class="game" href="games/block-stack/" aria-label="블록 스택 — 떨어지는 블록을 쌓아 줄을 가득 채워 지우는 퍼즐 게임">
      <div class="art" style="--tile: var(--tile-block)">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <g>
            <rect x="8" y="46" width="11" height="11" rx="2.5" fill="#3aa6b9"/>
            <rect x="20" y="46" width="11" height="11" rx="2.5" fill="#3aa6b9"/>
            <rect x="32" y="46" width="11" height="11" rx="2.5" fill="#3aa6b9"/>
            <rect x="44" y="46" width="11" height="11" rx="2.5" fill="#3aa6b9"/>
            <rect x="8" y="34" width="11" height="11" rx="2.5" fill="#f2b134"/>
            <rect x="20" y="34" width="11" height="11" rx="2.5" fill="#f2b134"/>
            <rect x="8" y="22" width="11" height="11" rx="2.5" fill="#f2b134"/>
            <rect x="20" y="22" width="11" height="11" rx="2.5" fill="#f2b134"/>
            <rect x="32" y="34" width="11" height="11" rx="2.5" fill="#8e6fd8"/>
            <rect x="44" y="34" width="11" height="11" rx="2.5" fill="#e88a3a"/>
            <rect x="44" y="22" width="11" height="11" rx="2.5" fill="#e88a3a"/>
            <rect x="26" y="4" width="11" height="11" rx="2.5" fill="#e4572e"/>
            <rect x="38" y="4" width="11" height="11" rx="2.5" fill="#e4572e"/>
          </g>
          <g fill="#fff" opacity=".35">
            <rect x="10" y="48" width="7" height="2" rx="1"/><rect x="22" y="48" width="7" height="2" rx="1"/>
            <rect x="34" y="48" width="7" height="2" rx="1"/><rect x="46" y="48" width="7" height="2" rx="1"/>
            <rect x="10" y="36" width="7" height="2" rx="1"/><rect x="22" y="36" width="7" height="2" rx="1"/>
            <rect x="10" y="24" width="7" height="2" rx="1"/><rect x="22" y="24" width="7" height="2" rx="1"/>
            <rect x="34" y="36" width="7" height="2" rx="1"/><rect x="46" y="36" width="7" height="2" rx="1"/>
            <rect x="46" y="24" width="7" height="2" rx="1"/>
            <rect x="28" y="6" width="7" height="2" rx="1"/><rect x="40" y="6" width="7" height="2" rx="1"/>
          </g>
          <line x1="37.5" y1="17" x2="37.5" y2="21" stroke="#e4572e" stroke-width="2" stroke-linecap="round" opacity=".45"/>
        </svg>
      </div>
      <h2>블록 스택</h2>
      <p>떨어지는 블록을 쌓아 줄을 가득 채워 지우는 퍼즐 게임</p>
    </a>
  </div>
</main>
</body>
</html>
