<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 게임 스튜디오</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="게임 스튜디오">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e4572e">
<style>
  :root {
    --bg: #f4f1ea; --panel: #ffffff; --ink: #1f2430; --muted: #6b7280;
    --line: #e7e2d8; --accent: #e4572e;
    --tile-block: #fdebe3; --tile-snake: #e4f0d6; --tile-bunny: #dbe6e3; --tile-mole: #e3e9d9; --tile-bungeo: #e4ebf1; --tile-poop: #efe8dc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141a; --panel: #1b1e27; --ink: #eceef3; --muted: #9aa1ae;
      --line: #262a35; --accent: #ff7a50;
      --tile-block: #2a1f1b; --tile-snake: #18241c; --tile-bunny: #16242a; --tile-mole: #18201b; --tile-bungeo: #1a2129; --tile-poop: #221e1a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12141a; --panel: #1b1e27; --ink: #eceef3; --muted: #9aa1ae;
    --line: #262a35; --accent: #ff7a50;
    --tile-block: #2a1f1b; --tile-snake: #18241c; --tile-bunny: #16242a; --tile-mole: #18201b; --tile-bungeo: #1a2129; --tile-poop: #221e1a;
  }
  * { box-sizing: border-box; }
  html { overflow-x: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    padding: 32px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 960px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  h1 span { color: var(--accent); }
  .sub { margin: 0 0 24px; color: var(--muted); }

  .grid { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 1023px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 639px)  { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 359px)  { .grid { grid-template-columns: minmax(0, 1fr); } h1 { font-size: 24px; } }

  .game {
    display: flex; flex-direction: column; text-decoration: none; color: inherit;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 12px 12px 16px;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    transition: transform 140ms ease-out, border-color 140ms ease-out;
    animation: enter 220ms ease-out both;
  }
  .game:nth-child(2) { animation-delay: 40ms; }
  .game:nth-child(3) { animation-delay: 80ms; }
  .game:nth-child(4) { animation-delay: 120ms; }
  .game:nth-child(n+5) { animation-delay: 160ms; }
  @keyframes enter { from { opacity: 0; transform: translateY(6px); } }
  .game:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 16px; border-color: var(--accent); }
  .game:active { transform: scale(.97); transition-duration: 80ms; }
  .art {
    aspect-ratio: 4 / 3; background: var(--tile); border-radius: 12px;
    display: grid; place-items: center; overflow: hidden;
  }
  .art svg { width: 62%; height: auto; max-height: 82%; transition: transform 140ms ease-out; }
  .game h2 { margin: 12px 4px 4px; word-break: keep-all; overflow-wrap: break-word; font-size: 18px; font-weight: 700; color: var(--ink); }
  .game p {
    margin: 0 4px; color: var(--muted); font-size: 14px; line-height: 1.5;
    word-break: keep-all; overflow-wrap: break-word;
  }
  @media (max-width: 639px) {
    .game h2 { font-size: 16px; }
    .game p { font-size: 13px; }
  }
  @media (hover: hover) {
    .game:hover, .game:focus-visible { transform: translateY(-3px); border-color: var(--accent); }
    .game:hover .art svg, .game:focus-visible .art svg { transform: scale(1.06); }
  }
  @media (prefers-reduced-motion: reduce) {
    .game { animation: none; }
    .game:hover, .game:focus-visible, .game:active { transform: none; }
    .game:hover .art svg, .game:focus-visible .art svg { transform: none; }
  }
</style>
</head>
<body>
<main>
  <h1>나의 게임 <span>스튜디오</span></h1>
  <p class="sub">하고 싶은 게임을 골라보세요.</p>

  <!-- 새 게임은 이 목록 맨 앞에 카드로 추가합니다 (최신 순) -->
  <div class="grid">
    <a class="game" href="games/poop-rain/" aria-label="똥비 피하기 — 똥은 피하고 별사탕은 줍기!">
      <div class="art" style="--tile: var(--tile-poop)">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs><g id="poopRainShape"><ellipse cx="0" cy="-3.4" rx="10" ry="3.4"/><ellipse cx="0" cy="-8.4" rx="7.6" ry="3"/><ellipse cx="0" cy="-12.6" rx="5" ry="2.6"/><path d="M-2.6 -14 Q-2 -17.2 0.8 -18.2 Q2.6 -18.6 1.8 -16.8 Q1.4 -15.4 2.8 -14 Z"/></g></defs>
          <rect x="4" y="50" width="56" height="9" rx="4.5" fill="#dbe3d1"/>
          <ellipse cx="17" cy="52.4" rx="7" ry="1.9" fill="#5c4a38" opacity=".2"/>
          <ellipse cx="47" cy="52.4" rx="4.6" ry="1.4" fill="#5c4a38" opacity=".14"/>
          <g transform="translate(17 30)">
            <use href="#poopRainShape" fill="#8a6244" stroke="#8a6244" stroke-width="2.4" stroke-linejoin="round"/>
            <use href="#poopRainShape" fill="#a87a55"/>
            <path d="M-6.8 -6 Q0 -4.8 6.8 -6 M-4.4 -10.6 Q0 -9.6 4.4 -10.6" fill="none" stroke="#8a6244" stroke-width="1" opacity=".5"/>
            <ellipse cx="-3.4" cy="-9" rx="1.4" ry=".7" transform="rotate(-17 -3.4 -9)" fill="#fff" opacity=".35"/>
          </g>
          <g transform="translate(47 21) scale(.68)">
            <use href="#poopRainShape" fill="#8a6244" stroke="#8a6244" stroke-width="3" stroke-linejoin="round"/>
            <use href="#poopRainShape" fill="#a87a55"/>
          </g>
          <rect x="27" y="40" width="11" height="10.5" rx="4.4" fill="#86c3b0" stroke="#c7a283" stroke-width="1.2"/>
          <circle cx="32.5" cy="34.6" r="6.4" fill="#f3d9c1" stroke="#c7a283" stroke-width="1.2"/>
          <path d="M26 34.6 A6.5 6.5 0 0 1 39 34.6 Q35 32.8 32 33.2 Q28.6 33.8 26 34.6 Z" fill="#6b5444"/>
          <circle cx="30.4" cy="36" r=".9" fill="#3a2f28"/><circle cx="34.6" cy="36" r=".9" fill="#3a2f28"/>
          <path d="M41 41.5 h4.5 M42 45.5 h3" stroke="#9aa3ad" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M24.6 27.6 q1.8 2.6 0 3.6 q-1.8 -1 0 -3.6 Z" fill="#8fbfe0"/>
        </svg>
      </div>
      <h2>똥비 피하기</h2>
      <p>똥은 피하고 별사탕은 줍기!</p>
    </a>

    <a class="game" href="games/bungeo-snowfight/" aria-label="붕어빵 눈싸움 — 붕어빵 던져 눈밭 땅따먹기">
      <div class="art" style="--tile: var(--tile-bungeo)">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs><path id="bungeoFish" d="M48 0C48-17 33-27 12-27C-8-27-22-19-30-8Q-38-16-45-20Q-50-21-48-15Q-42 0-48 15Q-50 21-45 20Q-38 16-30 8C-22 19-8 27 12 27C33 27 48 17 48 0Z"/></defs>
          <rect x="6" y="36" width="26" height="22" rx="5" fill="#6f96c9"/>
          <rect x="32" y="36" width="26" height="22" rx="5" fill="#ebb2c0"/>
          <rect x="27" y="36" width="10" height="22" fill="#eef2f6"/>
          <path d="M10 54 L19 40 M17.5 54 L26 40" stroke="#5f86ba" stroke-width="1.6" stroke-linecap="round"/>
          <g fill="#d495a6"><circle cx="41" cy="41" r="1.5"/><circle cx="54" cy="41" r="1.5"/><circle cx="41" cy="53.5" r="1.5"/><circle cx="54" cy="53.5" r="1.5"/></g>
          <path d="M13 32 Q22 8 37 13" fill="none" stroke="#8a93a3" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0 5.5"/>
          <g transform="translate(46 17) rotate(22)">
            <use href="#bungeoFish" transform="scale(.28)" fill="#9a6442" stroke="#5e3a24" stroke-width="4"/>
            <ellipse cx="-1" cy="0" rx="4.2" ry="2.3" fill="#5a2b2b" opacity=".55"/>
          </g>
          <g transform="translate(46 47.5) rotate(-12)">
            <use href="#bungeoFish" transform="scale(.2)" fill="#e6bd68" stroke="#9c7425" stroke-width="5.2"/>
            <ellipse cx="-.5" cy="0" rx="2.7" ry="1.4" fill="#fff4d2"/>
          </g>
        </svg>
      </div>
      <h2>붕어빵 눈싸움</h2>
      <p>붕어빵 던져 눈밭 땅따먹기</p>
    </a>

    <a class="game" href="games/mole-pop/" aria-label="두더지 뿅뿅 — 쏙 올라오는 두더지를 톡!">
      <div class="art" style="--tile: var(--tile-mole)">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs><clipPath id="molePopClip"><rect x="0" y="0" width="64" height="47"/><ellipse cx="32" cy="47" rx="17" ry="5"/></clipPath></defs>
          <ellipse cx="32" cy="50" rx="27" ry="9" fill="#e3d3bb" stroke="#bfa98b" stroke-width="1.4"/>
          <ellipse cx="32" cy="47" rx="17" ry="5" fill="#9c8670"/>
          <g clip-path="url(#molePopClip)">
            <rect x="19" y="14" width="26" height="40" rx="13" fill="#c4ab93" stroke="#8f765f" stroke-width="1.4"/>
            <circle cx="27.5" cy="27" r="1.9" fill="#3a2f28"/><circle cx="36.5" cy="27" r="1.9" fill="#3a2f28"/>
            <ellipse cx="32" cy="32.5" rx="2.8" ry="2" fill="#c98a83"/>
            <ellipse cx="24.5" cy="45" rx="4" ry="2.4" fill="#d8c2ab" stroke="#8f765f" stroke-width="1.2"/>
            <ellipse cx="39.5" cy="45" rx="4" ry="2.4" fill="#d8c2ab" stroke="#8f765f" stroke-width="1.2"/>
          </g>
          <path d="M51 7 L52.6 11.9 L57.5 13.5 L52.6 15.1 L51 20 L49.4 15.1 L44.5 13.5 L49.4 11.9 Z" fill="#f2c75c"/>
          <path d="M10 18 L10.9 20.6 L13.5 21.5 L10.9 22.4 L10 25 L9.1 22.4 L6.5 21.5 L9.1 20.6 Z" fill="#f2c75c" opacity=".7"/>
        </svg>
      </div>
      <h2>두더지 뿅뿅</h2>
      <p>쏙 올라오는 두더지를 톡!</p>
    </a>

    <a class="game" href="games/bunny-ten/" aria-label="개구리 텐 — 합이 10이 되게 묶는 숫자 퍼즐">
      <div class="art" style="--tile: var(--tile-bunny)">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect x="7" y="10" width="50" height="48" rx="9" fill="#1f6fc4" fill-opacity=".12" stroke="#1f6fc4" stroke-width="2.5"/>
          <g fill="none" stroke="#7f9a8b" stroke-width="3.2">
            <ellipse cx="20.5" cy="50.25" rx="5" ry="2.25"/><ellipse cx="43.5" cy="50.25" rx="5" ry="2.25"/>
            <circle cx="20.5" cy="24" r="6.5"/><circle cx="43.5" cy="24" r="6.5"/>
            <ellipse cx="32" cy="37" rx="20" ry="14"/>
          </g>
          <g fill="#d4e7bb">
            <ellipse cx="20.5" cy="50.25" rx="5" ry="2.25"/><ellipse cx="43.5" cy="50.25" rx="5" ry="2.25"/>
            <circle cx="20.5" cy="24" r="6.5"/><circle cx="43.5" cy="24" r="6.5"/>
            <ellipse cx="32" cy="37" rx="20" ry="14"/>
          </g>
          <path d="M24.5 33 L27 31 L27 43" fill="none" stroke="#1b2e26" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
          <ellipse cx="35.5" cy="37" rx="3.8" ry="5.6" fill="none" stroke="#1b2e26" stroke-width="3.4"/>
        </svg>
      </div>
      <h2>개구리 텐</h2>
      <p>합이 10이 되게 묶는 숫자 퍼즐</p>
    </a>

    <a class="game" href="games/snake-garden/" aria-label="뱀 정원 — 열매 먹고 길어지는 뱀">
      <div class="art" style="--tile: var(--tile-snake)">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M12 50 C 12 38, 30 40, 30 30 S 46 18, 46 14" fill="none" stroke="#3f9d5a" stroke-width="9" stroke-linecap="round"/>
          <path d="M8 54 L12 50" stroke="#3f9d5a" stroke-width="5" stroke-linecap="round"/>
          <circle cx="16" cy="43" r="1.8" fill="#8fd19e"/>
          <circle cx="27" cy="35" r="1.8" fill="#8fd19e"/>
          <circle cx="36" cy="25" r="1.8" fill="#8fd19e"/>
          <circle cx="47" cy="13" r="7" fill="#2f8049"/>
          <circle cx="44.5" cy="10.5" r="2.2" fill="#fff"/>
          <circle cx="50" cy="12" r="2.2" fill="#fff"/>
          <circle cx="45" cy="10" r="1.1" fill="#1f2430"/>
          <circle cx="50.6" cy="11.6" r="1.1" fill="#1f2430"/>
          <path d="M53 8 l3 -2 m-3 2 l3.4 0.6" fill="none" stroke="#e4572e" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="50" cy="46" r="6" fill="#e0374f"/>
          <circle cx="48" cy="46" r="0.9" fill="#ffd6dc"/>
          <circle cx="52" cy="46.5" r="0.9" fill="#ffd6dc"/>
          <circle cx="50" cy="49" r="0.9" fill="#ffd6dc"/>
          <circle cx="47.6" cy="43.6" r="1.5" fill="#fff" opacity=".5"/>
          <ellipse cx="47.8" cy="39.6" rx="2.6" ry="1.3" transform="rotate(-25 47.8 39.6)" fill="#3f9d5a"/>
          <ellipse cx="52.2" cy="39.6" rx="2.6" ry="1.3" transform="rotate(25 52.2 39.6)" fill="#3f9d5a"/>
        </svg>
      </div>
      <h2>뱀 정원</h2>
      <p>열매 먹고 길어지는 뱀</p>
    </a>

    <a class="game" href="games/block-stack/" aria-label="블록 스택 — 블록 쌓아 줄 지우는 퍼즐">
      <div class="art" style="--tile: var(--tile-block)">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <g>
            <rect x="8" y="46" width="11" height="11" rx="2.5" fill="#3aa6b9"/>
            <rect x="20" y="46" width="11" height="11" rx="2.5" fill="#3aa6b9"/>
            <rect x="32" y="46" width="11" height="11" rx="2.5" fill="#3aa6b9"/>
            <rect x="44" y="46" width="11" height="11" rx="2.5" fill="#3aa6b9"/>
            <rect x="8" y="34" width="11" height="11" rx="2.5" fill="#f2b134"/>
            <rect x="20" y="34" width="11" height="11" rx="2.5" fill="#f2b134"/>
            <rect x="8" y="22" width="11" height="11" rx="2.5" fill="#f2b134"/>
            <rect x="20" y="22" width="11" height="11" rx="2.5" fill="#f2b134"/>
            <rect x="32" y="34" width="11" height="11" rx="2.5" fill="#8e6fd8"/>
            <rect x="44" y="34" width="11" height="11" rx="2.5" fill="#e88a3a"/>
            <rect x="44" y="22" width="11" height="11" rx="2.5" fill="#e88a3a"/>
            <rect x="26" y="4" width="11" height="11" rx="2.5" fill="#e4572e"/>
            <rect x="38" y="4" width="11" height="11" rx="2.5" fill="#e4572e"/>
          </g>
          <g fill="#fff" opacity=".35">
            <rect x="10" y="48" width="7" height="2" rx="1"/><rect x="22" y="48" width="7" height="2" rx="1"/>
            <rect x="34" y="48" width="7" height="2" rx="1"/><rect x="46" y="48" width="7" height="2" rx="1"/>
            <rect x="10" y="36" width="7" height="2" rx="1"/><rect x="22" y="36" width="7" height="2" rx="1"/>
            <rect x="10" y="24" width="7" height="2" rx="1"/><rect x="22" y="24" width="7" height="2" rx="1"/>
            <rect x="34" y="36" width="7" height="2" rx="1"/><rect x="46" y="36" width="7" height="2" rx="1"/>
            <rect x="46" y="24" width="7" height="2" rx="1"/>
            <rect x="28" y="6" width="7" height="2" rx="1"/><rect x="40" y="6" width="7" height="2" rx="1"/>
          </g>
          <line x1="37.5" y1="17" x2="37.5" y2="21" stroke="#e4572e" stroke-width="2" stroke-linecap="round" opacity=".45"/>
        </svg>
      </div>
      <h2>블록 스택</h2>
      <p>블록 쌓아 줄 지우는 퍼즐</p>
    </a>
  </div>
</main>
</body>
</html>
