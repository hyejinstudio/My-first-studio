<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 게임 스튜디오</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="게임 스튜디오">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e4572e">
<style>
  :root {
    --bg: #f4f1ea; --panel: #ffffff; --ink: #1f2430; --muted: #6b7280;
    --line: #e7e2d8; --accent: #e4572e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141a; --panel: #1b1e27; --ink: #eceef3; --muted: #9aa1ae;
      --line: #262a35; --accent: #ff7a50;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12141a; --panel: #1b1e27; --ink: #eceef3; --muted: #9aa1ae;
    --line: #262a35; --accent: #ff7a50;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    padding: 32px 16px;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  h1 span { color: var(--accent); }
  .sub { margin: 0 0 24px; color: var(--muted); }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .game {
    display: block; text-decoration: none; color: inherit;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
    transition: transform .12s, border-color .12s;
  }
  .game:hover, .game:focus-visible { transform: translateY(-2px); border-color: var(--accent); }
  .game .icon { font-size: 34px; line-height: 1; }
  .game h2 { margin: 12px 0 4px; font-size: 18px; }
  .game p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>나의 게임 <span>스튜디오</span></h1>
  <p class="sub">하고 싶은 게임을 골라보세요.</p>

  <!-- 새 게임은 이 목록 맨 위에 카드로 추가합니다 -->
  <div class="grid">
    <a class="game" href="games/block-stack/">
      <div class="icon">🧱</div>
      <h2>블록 스택</h2>
      <p>떨어지는 블록을 쌓아 줄을 가득 채워 지우는 퍼즐 게임</p>
    </a>
  </div>
</main>
</body>
</html>
