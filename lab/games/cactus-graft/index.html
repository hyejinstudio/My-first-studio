<!doctype html>
<html lang="ko">

<style>
  /* 숫자 전용 글꼴: Pretendard ExtraBold(SIL OFL 1.1)의 숫자·기호 서브셋. 수정본이라 내부 이름은 CactusDigits. 라이선스 fonts/OFL.txt */
  @font-face { font-family: "CactusDigits"; src: url("fonts/cactus-digits-800.woff2") format("woff2");
    font-weight: 800; font-style: normal; font-display: swap; unicode-range: U+002B-002F, U+0030-0039; }
  :root {
    --app-h: 100vh;
    --app-h: 100dvh;
    --num-font: "CactusDigits", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    --bg: #f4f1ea; --panel: #ffffff; --ink: #1f2430; --muted: #6b7280; --grid: #e7e2d8; --well: #fbfaf7;
    --accent: #e4572e; --gold: #f2b134; --good-ink: #3f7a4f; --danger: #d64545; --loss-ink: #b2452f;
    --body: #7cc35a; --edge: #3f7f2c; --rot: #8a5a2b; --rot-edge: #4e3016; --rot-hatch: #5e3a1a; --dry: #b59a62;
    --warn: #c0392b; --ok: #3f7a4f; --good: #d9b26a; --zone-ink: #6e5530; --bloom: #ef8aa6; --bloom-c: #f2b134; --mark: #2f7fc4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141a; --panel: #1b1e27; --ink: #eceef3; --muted: #9aa1ae; --grid: #262a35; --well: #161921;
      --accent: #ff7a50; --gold: #ffc94d; --good-ink: #8fd09d; --danger: #ff6b6b; --loss-ink: #f39a84;
      --body: #8fd46a; --edge: #cdeeb4; --rot: #9a6634; --rot-edge: #e0b07a; --rot-hatch: #5a3416; --dry: #9c8455;
      --warn: #ff6b6b; --ok: #8fd09d; --good: #c9a45e; --zone-ink: #d9c39a; --bloom: #f39ab3; --bloom-c: #ffc94d; --mark: #7cc0f2;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12141a; --panel: #1b1e27; --ink: #eceef3; --muted: #9aa1ae; --grid: #262a35; --well: #161921;
    --accent: #ff7a50; --gold: #ffc94d; --good-ink: #8fd09d; --danger: #ff6b6b; --loss-ink: #f39a84;
    --body: #8fd46a; --edge: #cdeeb4; --rot: #9a6634; --rot-edge: #e0b07a; --rot-hatch: #5a3416; --dry: #9c8455;
    --warn: #ff6b6b; --ok: #8fd09d; --good: #c9a45e; --zone-ink: #d9c39a; --bloom: #f39ab3; --bloom-c: #ffc94d; --mark: #7cc0f2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: var(--app-h); overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  body.low { padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right))
             max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left)); }
  .num { font-family: var(--num-font); font-weight: 800; font-variant-numeric: tabular-nums; }
  svg [hidden], svg[hidden] { display: none !important; }
  /* .app·.stage와 조상에는 transform/filter 금지 (ov-full의 position:fixed가 깨짐) */
  .app { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }

  /* 상단 바 (hungry-bear와 같은 구조) */
  .top { flex: none; height: var(--tb, 52px); width: var(--sw, 600px); display: flex; align-items: center; gap: 8px; }
  .home {
    flex: none; min-height: 44px; display: inline-flex; align-items: center; padding: 0 8px; margin-left: -8px;
    color: var(--muted); font-size: 14px; text-decoration: none; border-radius: 8px; white-space: nowrap;
  }
  .home:hover, .home:focus-visible { color: var(--ink); }
  .home .short { display: none; }
  .home:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .title { margin: 0; font-size: 18px; font-weight: 800; white-space: nowrap; }
  .spacer { flex: 1; min-width: 0; }
  .btns { display: flex; gap: 6px; flex: none; }
  .hpill {
    flex: none; height: 44px; min-width: 112px; padding: 0 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--grid);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: border-color 400ms linear;
  }
  .hpill.grow { border-color: var(--good-ink); transition-duration: 0ms; }
  .hpill svg { width: 18px; height: 18px; flex: none; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; }
  .hpill b { font-size: 22px; line-height: 1; }
  .unit { font-size: 13px; font-weight: 700; color: var(--muted); }
  .segchip { flex: none; height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--grid); background: var(--panel);
    display: inline-flex; align-items: center; gap: 5px; }
  .segchip svg { width: 14px; height: 16px; flex: none; }
  .segchip .ic-r { fill: var(--body); stroke: var(--edge); stroke-width: 1.4; }
  .segchip.learn .ic-r { fill: none; stroke: var(--muted); stroke-dasharray: 2 2; }
  .segchip b { font-size: 16px; line-height: 1; }
  .hearts { display: flex; gap: 4px; flex: none; }
  .hearts svg { width: 24px; height: 24px; display: block; overflow: visible; }
  .hearts .hf { fill: var(--danger); stroke: var(--danger); stroke-width: 1.5; transition: opacity 200ms linear 200ms; }
  .hearts .ho { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 3 2.4; opacity: 0; }
  .hearts .lost .hf { opacity: 0; }
  .hearts .lost .ho { opacity: 1; }
  .hearts .hit { animation: hpop 200ms ease-out; transform-origin: center; transform-box: fill-box; }
  @keyframes hpop { 50% { transform: scale(1.25); } }
  .hearts.alarm svg { animation: halarm 500ms ease-in-out 3; }
  @keyframes halarm { 50% { transform: scale(1.3); } }

  button {
    font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--grid);
    border-radius: 10px; cursor: pointer; touch-action: manipulation;
    transition: transform 80ms ease-out, background-color 80ms ease-out, opacity 200ms linear;
  }
  button:active { transform: scale(.94); background: var(--grid); }
  button:disabled { opacity: .5; cursor: default; }
  button.icon { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; font-size: 18px; color: var(--ink); }
  button.icon svg { width: 20px; height: 20px; }
  button.icon svg[hidden] { display: none; }
  button.primary {
    background: var(--accent); color: #fff; border-color: transparent; font-weight: 700;
    height: 48px; padding: 0 24px; font-size: 18px; flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  button.primary:active { background: var(--accent); filter: brightness(.92); }
  button.secondary, a.secondary {
    height: 44px; padding: 0 18px; font-size: 15px; background: var(--panel); color: var(--ink);
    border: 1px solid var(--grid); border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; flex: none;
  }
  .kbd { display: none; font-size: 12px; color: var(--muted); border: 1px solid var(--grid); border-radius: 6px; padding: 1px 6px; background: var(--panel); }
  @media (hover: hover) and (pointer: fine) { .kbd { display: inline-block; } }

  /* 무대 */
  .stage {
    position: relative; flex: none; width: var(--sw, 600px); height: var(--sh, 400px); border-radius: 16px; overflow: hidden; background: var(--bg);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tag {
    position: absolute; left: 0; top: 0; pointer-events: none; z-index: 2; background: var(--panel); border: 2px solid var(--danger);
    border-radius: 999px; padding: 3px 10px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; opacity: 0; color: var(--loss-ink);
  }
  .tag[hidden] { display: none; }
  .tag b { font-size: 18px; line-height: 1.1; }
  .tag .u { font-size: 11px; font-weight: 700; }
  .tag svg { width: 18px; height: 18px; flex: none; }
  .tag.gold { border-color: var(--gold); color: var(--ink); }
  .tag.plain { border-color: var(--muted); color: var(--muted); }
  .floatn { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 2; white-space: nowrap; opacity: 0; color: var(--good-ink);
    text-shadow: 0 0 2px var(--panel), 0 0 2px var(--panel), 0 0 4px var(--panel); display: inline-flex; align-items: baseline; gap: 3px; }
  .floatn b { font-size: 24px; line-height: 1; }
  .floatn .u { font-size: 14px; font-weight: 700; }
  .floatn.dim { color: var(--ink); }
  .floatn[hidden] { display: none; }
  .ready { position: absolute; left: 0; top: 0; width: 56px; height: 56px; pointer-events: none; z-index: 1; display: grid; place-items: center; }
  .ready[hidden] { display: none; }
  .ready svg { position: absolute; inset: 0; width: 56px; height: 56px; transform: rotate(-90deg); }
  .ready circle { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
  .ready b { font-size: 28px; position: relative; color: var(--ink); }
  .keys { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; display: flex; gap: 6px; opacity: .85; }
  .keys[hidden] { display: none; }
  .keys span { min-width: 30px; height: 30px; border: 1.5px solid var(--zone-ink); border-bottom-width: 3px; border-radius: 7px; background: var(--panel);
    color: var(--zone-ink); display: grid; place-items: center; font-size: 15px; font-weight: 800; padding: 0 6px; }
  .keys span.wide { min-width: 64px; }
  .keys svg { width: 18px; height: 18px; }

  /* 첫 실패 해설 카드 */
  .explain { position: absolute; inset: 0; z-index: 4; background: rgba(20,22,28,.45); display: flex; align-items: center; justify-content: center; animation: ovIn 200ms ease-out; }
  .explain[hidden] { display: none; }
  .excard { position: relative; background: var(--well); border: 1px solid var(--grid); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 14px;
    display: flex; flex-direction: column; align-items: center; gap: 10px; animation: exIn 200ms ease-out; }
  @keyframes exIn { from { opacity: 0; transform: scale(.96); } }
  .exwrap { position: relative; }
  .exwrap canvas { display: block; border-radius: 10px; }
  .exwrap .tag { opacity: 1; }
  .exfoot { height: 40px; display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--muted); }
  .exfoot svg { display: block; }
  #exLock circle { fill: none; stroke: var(--muted); stroke-width: 3; stroke-linecap: round; }
  #exTap { animation: tapPulse 1200ms ease-in-out infinite; opacity: .8; color: var(--zone-ink); }
  @keyframes tapPulse { 50% { opacity: .35; } }
  #exFinger { color: var(--zone-ink); }
  #exFinger[hidden], #exTap[hidden], #exLock[hidden] { display: none; }

  /* 오버레이 (hungry-bear와 같은 CSS) */
  .overlay {
    position: absolute; inset: 0; border-radius: 12px; padding: 16px; overflow-x: hidden; overflow-y: auto; touch-action: pan-y;
    display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: safe center; text-align: center;
    background: color-mix(in srgb, var(--well) 94%, transparent); line-height: 1.4; z-index: 5;
    animation: ovIn 200ms ease-out;
  }
  .overlay > * { animation: ovUp 200ms ease-out; flex: none; }
  @keyframes ovIn { from { opacity: 0; } }
  @keyframes ovUp { from { transform: translateY(8px); } }
  .overlay[hidden] { display: none; }
  body.ov-full .overlay { position: fixed; inset: 0; border-radius: 0; z-index: 10; background: var(--well);
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  #ovPause, body.ov-full #ovPause { background: var(--well); }
  .overlay .ov-home { display: none; }
  body.ov-full .overlay .ov-home { display: inline-flex; position: absolute; margin: 0; animation: none;
    top: max(4px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); }
  .overlay h2 { margin: 0; font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 8px; justify-content: center; }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; }
  .overlay .row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .overlay [hidden] { display: none !important; }
  #lbSlot { min-width: 0; display: inline-flex; align-items: center; }
  .badge { background: var(--panel); border: 2px solid var(--gold); color: var(--ink); font-size: 14px; font-weight: 800; border-radius: 999px; padding: 3px 12px; animation: pop 220ms cubic-bezier(.3,1.4,.5,1) 200ms both; }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } }

  /* 시작 화면 */
  .card { width: min(100%, 560px); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #ovStart h2 { font-size: 26px; }
  .demo { position: relative; width: var(--dw, 360px); height: var(--dh, 324px); border-radius: 12px; border: 1px solid var(--grid); overflow: hidden; background: var(--bg); flex: none; }
  .demo canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .demo .play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; z-index: 2; padding: 0; }
  .demo .play svg { width: 20px; height: 20px; fill: currentColor; }
  .caps { display: flex; gap: 6px; justify-content: center; width: var(--dw, 360px); }
  .caps figure { margin: 0; flex: 1 1 0; min-width: 0; height: 56px; display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 12px; border: 2px solid transparent; background: var(--panel); }
  .caps figure.on { border-color: var(--accent); }
  .caps svg { width: 100%; max-width: 96px; height: 44px; }
  .startrow { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  #startBtn { height: 56px; min-width: 220px; }
  .bestline { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
  .bestline svg { width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; }
  .bestline b { font-size: 18px; color: var(--ink); }

  /* 일시정지 */
  .pinfo { display: flex; align-items: center; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .pinfo .pk { display: inline-flex; align-items: baseline; gap: 3px; }
  .pinfo .pk b { font-size: 20px; }
  .pbig { font-size: 32px; font-weight: 800; color: var(--muted); line-height: 1; }
  #pMute { display: none; }
  body.tb-360 #pMute { display: inline-flex; }

  /* 결과 */
  .rcard { width: min(100%, 600px); display: flex; flex-direction: column; gap: 9px; align-items: stretch; text-align: left; }
  .rcol { display: contents; }
  .rb-a { order: 10; }
  .rtop { display: flex; gap: 14px; align-items: center; }
  #miniCv { width: 96px; height: 160px; border-radius: 12px; border: 1px solid var(--grid); flex: none; display: block; }
  .rmain { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
  .rbig { display: flex; align-items: baseline; gap: 6px 10px; flex-wrap: wrap; }
  .rbig b { font-size: 56px; line-height: 1; }
  .rbig .unit { font-size: 20px; }
  .rend { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; flex-wrap: wrap; }
  .rend svg { width: 18px; height: 18px; flex: none; }
  .rend .num { font-size: 17px; }
  .rend .gd { color: var(--good-ink); }
  .rend .why { font-size: 13px; color: var(--muted); font-weight: 700; }
  #strip { width: 100%; height: 64px; display: block; cursor: default; }
  .counts { display: flex; gap: 14px; align-items: center; }
  .counts span { display: inline-flex; align-items: center; gap: 4px; }
  .counts svg { width: 14px; height: 14px; }
  .counts b { font-size: 20px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--panel); border: 1px solid var(--grid); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .stat .sl { font-size: 12px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .stat .sl svg { width: 16px; height: 16px; flex: none; }
  .stat .sv { display: flex; align-items: baseline; gap: 3px; }
  .stat .sv b { font-size: 22px; line-height: 1.1; }
  .stat .sv span { font-size: 13px; font-weight: 700; color: var(--muted); }
  .stat .sh { font-size: 11px; font-weight: 600; color: var(--muted); line-height: 1.3; }
  .worst { background: var(--panel); border: 1px solid var(--grid); border-left: 3px solid var(--danger); border-radius: 10px; padding: 6px 10px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; cursor: default; }
  .worst canvas { width: 120px; height: 72px; flex: none; border-radius: 8px; display: block; }
  .worst .wl { font-size: 12px; color: var(--muted); font-weight: 700; display: block; }
  .worst .num { font-size: 14px; }
  .recline { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .recline svg { width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; }
  .recline b { font-size: 16px; color: var(--ink); }
  .recline .badge { margin-left: 6px; }
  .rbtns { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #againBtn { height: 52px; min-width: 120px; }
  body.low #miniCv { display: none; }
  body.low .rcard { flex-direction: row; align-items: flex-start; width: min(100%, 860px); gap: 14px; }
  body.low .rcol { flex: 1 1 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  body.low .rbig b { font-size: 44px; }
  body.low #strip { height: 44px; }
  body.low .overlay { gap: 6px; padding: 8px; }
  body.low .overlay h2, body.low #ovStart h2 { font-size: 20px; }
  body.low .stat { padding: 6px 10px; }
  body.low .stat .sv b { font-size: 19px; }
  body.low #againBtn { height: 48px; }
  body.low #startBtn { height: 52px; }
  body.low .card { gap: 6px; }
  body.low #ovStart .card { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; width: min(100%, 860px); gap: 16px; }
  body.low #ovStart .demo-col, body.low #ovStart .side-col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .demo-col, .side-col { display: contents; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* 상단 바 너비 구간 */
  body.tb-720 .title { display: none; }
  body.tb-480 .home .full { display: none; }
  body.tb-480 .home .short { display: inline; }
  body.tb-480 .segchip svg { display: none; }
  body.tb-480 .hpill svg { display: none; }
  body.tb-480 .hpill { min-width: 96px; padding: 0 10px; }
  body.tb-480 .hearts svg { width: 20px; height: 20px; }
  body.tb-480 .top { gap: 4px; }
  body.tb-480 .hearts { gap: 2px; }
  body.tb-360 #muteBtn { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .overlay, .overlay > *, .badge, .explain, .excard { animation: none; }
    button:active { transform: none; }
    .hearts .hit { animation: none; }
    #exTap { animation: none; }
  }
</style>
</head>

<script>
/* ===== 선인장 키우기2 (cactus-graft) Sound module =====
 * Web Audio API 실시간 합성. 외부 파일/의존성 없음.
 * AudioContext 미지원·생성 실패 시 모든 호출은 조용히 무시된다(게임은 소리 없이 정상 진행).
 * 시리즈 전작 「선인장 키우기」(desert-breath)와 같은 구조·음색(D 장조 5음 음계, sine 마림바·작은 종, 9kHz 로우패스, 바람 바탕).
 *
 * 사용법: 사용자 제스처(click/pointerup/keydown) 핸들러 맨 앞에서 Sound.unlock() →
 *   판 시작: Sound.startAmbient()
 *   칼을 기울이는 동안 매 프레임: Sound.aim(칼 각도°)      — 소리 크기는 "돌리는 속도"만 따른다(각도·평행 정보 없음)
 *   순간 효과음: Sound.play('cut'), Sound.play('graft', { n: 12, streak: 3 }), Sound.play('miss') ...
 *
 * [공정성] 조준 중 소리는 칼을 돌리는 속도에만 반응하고 음높이·음색은 고정이다. 칼 각도나 대목 면과의 평행 여부는
 *   소리에 전혀 실리지 않는다. 평행 신호 'align'은 게임이 화면에 "미리 빛남"을 보여 줄 때(1~3마디 배우기)만 부른다.
 * [박자 없음] 루프 멜로디·일정한 박자 없음. 바람 바탕은 노이즈 + 서로 맞지 않는 느린 흔들림.
 *
 * 신호 경로: sfxBus → LP 9kHz ─────────────┐
 *            aimBus(칼 스침) ───────────────┤
 *            ambBus(바람) → ambDuck ────────┴→ master(음소거) → limiter → destination
 */
const Sound = (function () {
  'use strict';
  var MUTE_KEY = 'cactus-graft-muted';
  var MASTER_VOL = 0.6;
  var AMB_VOL = 1.0;
  var DUCK = 0.4;           // 무너짐·꽃·새 기록 때 바람을 잠깐 낮추는 비율
  var WIND_LV = 0.035;      // 바람 바탕(전작 0.055보다 작게 — 이번 판은 손끝 소리가 주인공)
  var AIM_LV = 0.05;        // 칼 스침 최대 음량(돌리는 속도 AIM_FULL°/초 이상에서)
  var AIM_FULL = 140;       // 이 속도(°/초)에서 스침 최대

  var ctx = null, master = null, limiter = null, sfxBus = null, sfxTone = null;
  var ambBus = null, ambDuck = null, noiseBuf = null;
  var aimBus = null, aimNode = null;
  var muted = false, offline = false;
  var last = {};
  var amb = { want: false, on: false, nodes: null, stopTimer: null };
  var paused = false;
  var aimSt = { deg: null, t: 0 };

  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) { muted = false; }

  function build(c) {
    ctx = c;
    limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -6; limiter.knee.value = 2; limiter.ratio.value = 20;
    limiter.attack.value = 0.002; limiter.release.value = 0.15;
    limiter.connect(ctx.destination);

    master = ctx.createGain();
    master.gain.value = muted ? 0 : MASTER_VOL;
    master.connect(limiter);

    sfxTone = ctx.createBiquadFilter();
    sfxTone.type = 'lowpass'; sfxTone.frequency.value = 9000; sfxTone.Q.value = 0.5;
    sfxTone.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(sfxTone);

    aimBus = ctx.createGain(); aimBus.gain.value = 0; aimBus.connect(master);

    ambDuck = ctx.createGain(); ambDuck.gain.value = 1; ambDuck.connect(master);
    ambBus = ctx.createGain(); ambBus.gain.value = 0; ambBus.connect(ambDuck);

    // 노이즈 버퍼 1개(4초, 스테레오, 고정 시드). 루프 이음매 20ms 교차 페이드
    var len = Math.floor(ctx.sampleRate * 4);
    noiseBuf = ctx.createBuffer(2, len, ctx.sampleRate);
    var seed = 20261128 | 0;
    for (var ch = 0; ch < 2; ch++) {
      var d = noiseBuf.getChannelData(ch);
      // xorshift32(정수 연산만) — 곱셈 LCG를 double로 돌리면 정밀도가 깨져 0.3초 주기로 반복되므로 쓰지 않는다
      for (var j = 0; j < len; j++) { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; d[j] = (seed >>> 0) / 2147483648 - 1; }
      var xf = Math.floor(ctx.sampleRate * 0.02);
      for (var k = 0; k < xf; k++) { var a = k / xf; d[len - xf + k] = d[len - xf + k] * (1 - a) + d[k] * a; }
    }
    aimNode = null;
  }

  function ensureCtx() {
    if (ctx) return ctx;
    try {

<script>

      if (run.seg >= 1 && run.seg <= 3 && (run.phase === 'pre' || run.phase === 'aim')) hn.parallel = Math.abs(ctl.knifeAt(t) - run.theta) <= run.row.P + 1e-9;
      var vr = { crumbs: [], skyCm: 0, skipTrim1: true, ripple: vis.ripple ? { x: vis.ripple.x, y: vis.ripple.y, at: vis.ripple.at } : null };
      Scene.draw(dctx, P, DL, run, ctl, t, vr, { reduced: false, real: t, hints: hn, demoFinger: df });
      // 아래 그림 3칸 강조
      var s = run.seg, ph = run.phase, cur = run.cur, lastUp = fing.upAt;
      $('cap1').classList.toggle('on', s >= 1 && s <= 2 && ph !== 'result');
      $('cap2').classList.toggle('on', lastUp >= 0 && t - lastUp < 0.6 && cur && (cur.seg === 1 || cur.seg === 2 || cur.seg === 4));
      $('cap3').classList.toggle('on', s === 5 && ph !== 'result');
    }
    return { resize: resize, start: start, stop: stop, play: play, frame: frame, results: function () { return results.slice(); }, script: function () { return script; } };
  })();

  // ---------- 테스트 훅 (QA 전용) ----------
  function ensureRun(seed) { if (G.mode === 'menu' || !G.run || G.mode === 'result') startGame({ seed: seed }); }
  function skipReady() { if (G.run && G.run.phase === 'ready' && G.clockOn) { var tg = gameNow(); G.origin -= (G.run.readyDur - tg) * 1000 + 1; perFrame(gameNow()); } }
  window.__graft = {
    state: function () {
      var run = G.run, ctl = G.ctl;
      if (!run) return { phase: G.mode === 'menu' ? 'menu' : G.mode, seed: G.seed, results: [] };
      var tg = gameNow(), tau = run.phase === 'aim' ? tg - run.aimStart : null, sc = run.phase === 'aim' ? run.scionAt(tau) : null, knife = ctl.knifeAt(tg);
      var s = sc ? E.sOf(knife, sc.alpha) : null, hn = hintsNow(tg);
      var phase = G.mode === 'paused' ? 'paused' : G.mode === 'resume' ? 'resume' : G.mode === 'explain' ? 'explain' : run.phase === 'pre' ? (tg - run.pt < DUR.trim ? 'trim' : 'enter') : run.phase === 'prep' ? 'resume' : run.phase;
      return {
        phase: phase, runPhase: run.phase, seed: run.seed, seg: run.seg, fails: run.fails, tilt: run.tilt, theta: run.theta, d: run.d, knife: knife, knifeRaw: ctl.dragging ? knife : ctl.keyRawAt(tg),
        armed: ctl.armedAt(tg), dragging: ctl.dragging, tau: tau, L: run.row.L, u: sc ? sc.u : null, alpha: sc ? sc.alpha : null, s: s, margin: sc ? sc.u - s : null,
        h: sc ? 80 - sc.u : null, Hmm: run.H(), mm: run.mm(), combo: run.combo, gameT: tg,
        hints: { finger: !!G.hint.finger, ghostLine: hn.ghost, parallelGlow: hn.parallel, brownPulse: hn.brownPulse > 0 || hn.brownX > 0 },
        explaining: G.mode === 'explain' && G.explain ? G.explain.kind : null,
        results: run.results.map(function (r) { return { seg: r.seg, kind: r.kind, phi: r.phi, theta: r.theta, e: r.e, u: r.u, alpha: r.alpha, s: r.s, margin: r.margin, h: r.h, added: r.added, bonus: r.bonus, tiltBefore: r.tiltBefore, tiltAfter: r.tiltAfter, tau: r.tau }; })
      };
    },
    params: function (seg) { return E.params(seg); },
    faces: function (seed) { return E.faces(seed >>> 0); },
    scionAt: function (seg, tau) { var f = G.run ? G.run.faces : E.faces(0); return E.scion(E.params(seg), f[seg - 1].sway, tau); },
    judge: function (o) { var j = E.judgeRow(E.params(o.seg), o.phi, o.theta, o.u, o.alpha || 0); return { kind: j.kind, e: j.e, s: j.s, margin: j.margin, h: j.h, added: j.added }; },
    start: function (o) { o = o || {}; Sound.unlock(); startGame({ seed: o.seed }); return G.seed; },
    skipReady: skipReady,
    gotoSeg: function (k, o) {
      o = o || {}; ensureRun(o.seed); if (G.mode !== 'run') return;
      skipReady();
      var run = G.run, t = gameNow();
      if (o.tilt != null) run.tilt = o.tilt; if (o.fails != null) run.fails = o.fails; if (o.combo != null) run.combo = o.combo;
      run.end = null; G.ctl.cancel(); run.startSeg(k, t); updateTop(true);
    },
    pointer: function (type, x, y, tMs) {
      var ts = tMs != null ? tMs : now();
      if (type === 'down') return ptrDown(x, y, ts, 'hook');
      if (type === 'move') return ptrMove(x, y, ts, 'hook');
      if (type === 'up') { var r = ptrUp(x, y, ts, 'hook'); return r ? Object.assign({}, r) : null; }
      if (type === 'cancel') return ptrCancel('hook');
    },
    key: function (code, kind, tMs) { var r = keyInput(code, kind || 'down', tMs != null ? tMs : now()); return r ? Object.assign({}, r) : null; },
    previewAngle: function () { if (!G.ctl) return null; var t = gameNow(); return G.ctl.dragging ? G.ctl.angleAt(t) : G.ctl.knifeAt(t); },
    cutNow: function (phi) {
      var run = G.run; if (!run || G.mode !== 'run') return null;
      skipReady();
      if (run.phase !== 'aim') { var need = run.aimStart - gameNow(); if (run.phase === 'pre' && need > 0) { G.origin -= need * 1000 + 1; perFrame(gameNow()); } }
      if (run.phase !== 'aim') return null;
      G.ctl.cancel(); G.ctl.raw = phi; G.ctl.knife = E.clamp(E.rInt(phi), -35, 35);
      var r = keyInput('Space', 'down', now()); return r ? Object.assign({}, r) : null;
    },
    simulate: function (o) { return E.simulate(o); },
    runBots: function (o) { return E.runBots(o); },
    demoScript: function () { return E.demoScript(); },
    demoResults: function () { return Demo.results(); },
    lastResult: function () { return G.lastResult ? JSON.parse(JSON.stringify(G.lastResult)) : null; },
    pause: function () { pauseGame('key'); }, resume: function () { resumeGame(); },
    closeExplain: function () { if (G.explain) G.explain.lockUntil = 0; closeExplain(); },
    setTilt: function (v) { if (G.run) G.run.tilt = v; }, setFails: function (n) { if (G.run) { G.run.fails = n; updateTop(true); } },
    clearStorage: function () { [KEY.best, KEY.seen, KEY.explained].forEach(lsDel); MEM.best = null; MEM.explained = {}; G.seen = false; },
    setAuto: function (on) { G.auto = !!on; },
    layout: function () { return L ? JSON.parse(JSON.stringify(L)) : null; },
    stageRect: function () { var b = stage.getBoundingClientRect(); return { x: b.left, y: b.top, w: b.width, h: b.height }; }
  };

  // ---------- 시작 ----------
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 50); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
  syncPalette(); syncMute();
  layout();
  showStart();
  requestAnimationFrame(frame);
})();
</script>
