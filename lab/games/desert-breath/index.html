<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>선인장 키우기</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="선인장 키우기">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e4572e">
<style>
  /* 숫자 전용 글꼴: Pretendard ExtraBold(SIL OFL 1.1)의 숫자·기호 서브셋. 수정본이라 내부 이름은 CactusDigits. 라이선스 fonts/OFL.txt */
  @font-face { font-family: "CactusDigits"; src: url("fonts/cactus-digits-800.woff2") format("woff2");
    font-weight: 800; font-style: normal; font-display: swap; unicode-range: U+002B-002F, U+0030-0039; }
  :root {
    --app-h: 100vh;
    --app-h: 100dvh;
    --num-font: "CactusDigits", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    --bg: #f4f1ea; --panel: #ffffff; --ink: #1f2430; --muted: #6b7280; --grid: #e7e2d8; --well: #fbfaf7;
    --accent: #e4572e; --gold: #f2b134; --good-ink: #3f7a4f; --danger: #d64545; --loss-ink: #b2452f;
    --full-ring: #2f7fc4; --rain: #2f6fb0; --sun-edge: #c9761a; --dusk: #8a6fc4; --zone-ink: #6e5530; --dry: #b59a62;
    --sand-wave: #b07a36; --open: #7cc35a; --open-edge: #3f7f2c; --cloud: #eef2f6; --cloud-edge: #6f86a0; --sun: #f5b82e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141a; --panel: #1b1e27; --ink: #eceef3; --muted: #9aa1ae; --grid: #262a35; --well: #161921;
      --accent: #ff7a50; --gold: #ffc94d; --good-ink: #8fd09d; --danger: #ff6b6b; --loss-ink: #f39a84;
      --full-ring: #7cc0f2; --rain: #8cc0ec; --sun-edge: #ff9d3a; --dusk: #b8a6e6; --zone-ink: #d9c39a; --dry: #9c8455;
      --sand-wave: #d9a35c; --open: #8fd46a; --open-edge: #cdeeb4; --cloud: #c9d3df; --cloud-edge: #8ea6c2; --sun: #ffc94d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12141a; --panel: #1b1e27; --ink: #eceef3; --muted: #9aa1ae; --grid: #262a35; --well: #161921;
    --accent: #ff7a50; --gold: #ffc94d; --good-ink: #8fd09d; --danger: #ff6b6b; --loss-ink: #f39a84;
    --full-ring: #7cc0f2; --rain: #8cc0ec; --sun-edge: #ff9d3a; --dusk: #b8a6e6; --zone-ink: #d9c39a; --dry: #9c8455;
    --sand-wave: #d9a35c; --open: #8fd46a; --open-edge: #cdeeb4; --cloud: #c9d3df; --cloud-edge: #8ea6c2; --sun: #ffc94d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: var(--app-h); overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  body.low { padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right))
             max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left)); }
  .num { font-family: var(--num-font); font-weight: 800; font-variant-numeric: tabular-nums; }
  svg [hidden] { display: none; }
  /* .app·.stage와 조상에는 transform/filter 금지 (ov-full의 position:fixed가 깨짐) */
  .app { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }

  /* 상단 바 (hungry-bear와 같은 구조) */
  .top { flex: none; height: var(--tb, 52px); width: var(--sw, 600px); display: flex; align-items: center; gap: 8px; }
  .home {
    flex: none; min-height: 44px; display: inline-flex; align-items: center; padding: 0 8px; margin-left: -8px;
    color: var(--muted); font-size: 14px; text-decoration: none; border-radius: 8px; white-space: nowrap;
  }
  .home:hover, .home:focus-visible { color: var(--ink); }
  .home .short { display: none; }
  .home:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .title { margin: 0; font-size: 18px; font-weight: 800; white-space: nowrap; }
  .spacer { flex: 1; min-width: 0; }
  .btns { display: flex; gap: 6px; flex: none; }
  .hpill {
    flex: none; height: 44px; min-width: 112px; padding: 0 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--grid);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: border-color 400ms linear;
  }
  .hpill.grow { border-color: var(--full-ring); transition-duration: 0ms; }
  .hpill svg { width: 18px; height: 18px; flex: none; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; }
  .hpill b { font-size: 22px; line-height: 1; }
  .unit { font-size: 13px; font-weight: 700; color: var(--muted); }
  .mode {
    flex: none; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--grid); background: var(--panel);
    display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; white-space: nowrap;
  }
  .mode.practice { border: 1px dashed var(--muted); }
  .mode svg { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dayclock { flex: none; width: 112px; height: 44px; border-radius: 999px; background: var(--panel); border: 1px solid var(--grid); display: grid; place-items: center; overflow: hidden; }
  .dayclock svg { width: 112px; height: 44px; display: block; }
  .dc-hz { stroke: var(--muted); stroke-width: 2.5; stroke-linecap: round; fill: none; }
  .dc-past { stroke: var(--muted); stroke-width: 2.5; fill: none; stroke-linecap: round; }
  .dc-past.late { stroke: var(--dusk); }
  .dc-left { stroke: var(--grid); stroke-width: 2; fill: none; stroke-dasharray: 3 4; }
  .dc-sun { fill: var(--gold); stroke: var(--sun-edge); stroke-width: 1.5; }

  button {
    font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--grid);
    border-radius: 10px; cursor: pointer; touch-action: manipulation;
    transition: transform 80ms ease-out, background-color 80ms ease-out, opacity 200ms linear;
  }
  button:active { transform: scale(.94); background: var(--grid); }
  button:disabled { opacity: .5; cursor: default; }
  button.icon { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; font-size: 18px; color: var(--ink); }
  button.icon svg { width: 20px; height: 20px; }
  button.icon svg[hidden] { display: none; }
  button.primary {
    background: var(--accent); color: #fff; border-color: transparent; font-weight: 700;
    height: 48px; padding: 0 24px; font-size: 18px; flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  button.primary:active { background: var(--accent); filter: brightness(.92); }
  button.secondary, a.secondary {
    height: 44px; padding: 0 18px; font-size: 15px; background: var(--panel); color: var(--ink);
    border: 1px solid var(--grid); border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; flex: none;
  }
  button.secondary svg { width: 18px; height: 18px; flex: none; }
  .kbd { display: none; font-size: 12px; color: var(--muted); border: 1px solid var(--grid); border-radius: 6px; padding: 1px 6px; background: var(--panel); }
  @media (hover: hover) and (pointer: fine) { .kbd { display: inline-block; } }

  /* 무대 */
  .stage {
    position: relative; flex: none; width: var(--sw, 600px); height: var(--sh, 400px); border-radius: 16px; overflow: hidden; background: var(--bg);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .prick {
    position: absolute; left: 0; top: 0; pointer-events: none; z-index: 2; background: var(--panel); border: 2px solid var(--danger);
    border-radius: 10px; padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; white-space: nowrap; opacity: 0;
    transform-origin: 0 50%;
  }
  .prick[hidden] { display: none; }
  .prick .p1 { display: flex; align-items: center; gap: 5px; font-size: 15px; font-weight: 800; color: var(--loss-ink); }
  .prick .p1 svg, .prick .p2 svg { flex: none; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .prick .p1 svg { width: 14px; height: 14px; stroke: var(--loss-ink); stroke-width: 2.2; }
  .prick .p2 { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--ink); overflow: hidden; animation: p2in 120ms ease-out; }
  .prick .p2[hidden] { display: none; }
  .prick .p2 .num { font-size: 13px; }
  .prick .p2 svg { width: 20px; height: 20px; stroke: var(--ink); stroke-width: 1.8; }
  @keyframes p2in { from { max-height: 0; opacity: 0; } to { max-height: 24px; opacity: 1; } }
  .prick.small { padding: 4px 7px; border-radius: 8px; }
  .prick.small .p1 { font-size: 13px; } .prick.small .p2 { font-size: 11px; } .prick.small .p2 .num { font-size: 12px; }
  .finger { position: absolute; left: 0; top: 0; width: 48px; height: 48px; pointer-events: none; z-index: 1; color: var(--zone-ink); opacity: 0;
    transition: transform 150ms ease-out, opacity 150ms linear; }
  .finger[hidden] { display: none; }
  .finger svg { width: 48px; height: 48px; display: block; overflow: visible; }
  .finger .ring { fill: none; stroke: currentColor; stroke-width: 2; opacity: 0; }
  .finger.down .ring { animation: fpulse 600ms ease-out infinite; }
  .finger.down .ring.r2 { animation-delay: 300ms; }
  @keyframes fpulse { from { opacity: .7; transform: scale(.4); } to { opacity: 0; transform: scale(1.2); } }
  .finger .ring { transform-box: fill-box; transform-origin: center; }
  .ready { position: absolute; left: 0; top: 0; width: 56px; height: 56px; pointer-events: none; z-index: 1; display: grid; place-items: center; }
  .ready[hidden] { display: none; }
  .ready svg { position: absolute; inset: 0; width: 56px; height: 56px; transform: rotate(-90deg); }
  .ready circle { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
  .ready b { font-size: 28px; position: relative; color: var(--ink); }

  /* 오버레이 (hungry-bear와 같은 CSS) */
  .overlay {
    position: absolute; inset: 0; border-radius: 12px; padding: 16px; overflow-x: hidden; overflow-y: auto; touch-action: pan-y;
    display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: safe center; text-align: center;
    background: color-mix(in srgb, var(--well) 94%, transparent); line-height: 1.4; z-index: 3;
    animation: ovIn 200ms ease-out;
  }
  .overlay > * { animation: ovUp 200ms ease-out; flex: none; }
  @keyframes ovIn { from { opacity: 0; } }
  @keyframes ovUp { from { transform: translateY(8px); } }
  .overlay[hidden] { display: none; }
  body.ov-full .overlay { position: fixed; inset: 0; border-radius: 0; z-index: 10; background: color-mix(in srgb, var(--well) 97%, transparent);
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  #ovPause { background: var(--well); }
  .overlay .ov-home { display: none; }
  body.ov-full .overlay .ov-home { display: inline-flex; position: absolute; margin: 0; animation: none;
    top: max(4px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); }
  .overlay h2 { margin: 0; font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 8px; justify-content: center; }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; }
  .overlay .row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .overlay [hidden] { display: none !important; }
  #lbSlot { min-width: 0; display: inline-flex; align-items: center; }
  .badge { background: var(--panel); border: 2px solid var(--gold); color: var(--ink); font-size: 14px; font-weight: 800; border-radius: 999px; padding: 3px 12px; animation: pop 220ms cubic-bezier(.3,1.4,.5,1) 200ms both; }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } }

  /* 시작 화면 */
  .card { width: min(100%, 560px); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #ovStart h2 { font-size: 26px; }
  .demo { position: relative; width: var(--dw, 480px); height: var(--dh, 298px); border-radius: 12px; border: 1px solid var(--grid); overflow: hidden; background: var(--bg); flex: none; }
  .demo canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .demo .finger { width: 36px; height: 36px; }
  .demo .finger svg { width: 36px; height: 36px; }
  .demo .play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; z-index: 2; }
  .demo .play svg { width: 20px; height: 20px; fill: currentColor; }
  .caps { display: flex; gap: 6px; justify-content: center; width: var(--dw, 480px); }
  .caps figure { margin: 0; flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 5px; justify-content: center; padding: 5px 6px; border-radius: 10px; border: 2px solid transparent; background: var(--panel); }
  .caps figure.on { border-color: var(--accent); }
  .caps svg { width: 24px; height: 24px; flex: none; }
  .caps figcaption { font-size: 12px; font-weight: 700; line-height: 1.25; word-break: keep-all; text-align: left; }
  .startrow { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  #dailyBtn { height: 56px; min-width: 240px; flex-direction: column; gap: 0; line-height: 1.15; }
  #dailyBtn .l1 { font-size: 18px; font-weight: 700; }
  #dailyBtn .l2 { font-size: 13px; opacity: .85; }
  .bestline { font-size: 13px; color: var(--muted); display: inline-flex; align-items: baseline; gap: 4px; flex-wrap: wrap; justify-content: center; }
  .bestline b { font-size: 18px; color: var(--ink); }
  .bestline .sep { margin: 0 4px; }
  .tip { font-size: 12px !important; }

  /* 일시정지 */
  .pinfo { display: flex; align-items: center; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .pinfo .pk { display: inline-flex; align-items: baseline; gap: 3px; }
  .pinfo .pk b { font-size: 20px; }
  .pinfo .pl { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); }
  .pinfo .pl svg { width: 22px; height: 14px; }

  /* 결과 */
  .rcard { width: min(100%, 600px); display: flex; flex-direction: column; gap: 10px; align-items: stretch; text-align: left; }
  .rcol { display: contents; }
  .rb-a { order: 10; }
  .foot { order: 11; }
  .rhead { align-self: flex-start; }
  .rtop { display: flex; gap: 14px; align-items: center; }
  #miniCv { width: 96px; height: 128px; border-radius: 12px; border: 1px solid var(--grid); flex: none; display: block; }
  .rmain { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .rbig { display: flex; align-items: baseline; gap: 6px 10px; flex-wrap: wrap; }
  .rbig b { font-size: 56px; line-height: 1; }
  .rbig .unit { font-size: 20px; }
  .rsub { font-size: 13px; color: var(--muted); }
  .rsub .num { color: var(--good-ink); font-size: 14px; }
  .rend { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; }
  .rend svg { width: 18px; height: 18px; flex: none; }
  .rend.sunset { color: var(--good-ink); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--panel); border: 1px solid var(--grid); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .stat .sl { font-size: 12px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .stat .sl svg { width: 14px; height: 14px; flex: none; }
  .stat .sv { display: flex; align-items: baseline; gap: 4px; }
  .stat .sv b { font-size: 22px; line-height: 1.1; }
  .stat .sv span { font-size: 13px; font-weight: 700; }
  .stat .sx { font-size: 12px; color: var(--muted); }
  .stat .sx .num { font-size: 13px; color: var(--ink); }
  .stat .loss { color: var(--loss-ink); }
  .stat .good { color: var(--good-ink); }
  .worst { background: var(--panel); border: 1px solid var(--grid); border-left: 3px solid var(--danger); border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; cursor: default; }
  .worst.rain { border-left-color: var(--rain); }
  .worst svg { width: 16px; height: 16px; flex: none; }
  .worst .wl { font-size: 12px; color: var(--muted); font-weight: 700; flex: none; }
  .worst .num { font-size: 14px; }
  #retro { width: 100%; height: 44px; display: block; }
  .recline { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .recline b { font-size: 16px; color: var(--ink); }
  .recline .badge { margin-left: 6px; align-self: center; }
  .rbtns { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #againBtn { height: 52px; min-width: 120px; }
  .foot { font-size: 11px !important; color: var(--muted); }
  body.low #miniCv { display: none; }
  body.low .rcard { flex-direction: row; align-items: flex-start; width: min(100%, 860px); gap: 14px; }
  body.low .rcol { flex: 1 1 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  body.low .rbig b { font-size: 44px; }
  body.low #retro { height: 32px; }
  body.low .overlay { gap: 6px; padding: 8px; }
  body.low .overlay h2, body.low #ovStart h2 { font-size: 20px; }
  body.low .stat { padding: 6px 10px; }
  body.low .stat .sv b { font-size: 19px; }
  body.low #againBtn { height: 48px; }
  body.low #dailyBtn { height: 52px; }
  body.low .card { gap: 6px; }
  body.low #ovStart .card { flex-direction: row; flex-wrap: wrap; justify-content: center; width: min(100%, 860px); }
  body.low #ovStart .demo-col, body.low #ovStart .side-col { display: flex; flex-direction: column; gap: 8px; align-items: center; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* 상단 바 너비 구간 */
  body.tb-720 .title { display: none; }
  body.tb-480 .mode { display: none; }
  body.tb-480 .home .full { display: none; }
  body.tb-480 .home .short { display: inline; }
  body.tb-480 .dayclock { width: 76px; }
  body.tb-480 .dayclock svg { width: 76px; height: 30px; }
  body.tb-480 .hpill { min-width: 96px; padding: 0 10px; }
  body.tb-480 .top { gap: 6px; }
  body.tb-380 .hpill svg { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .overlay, .overlay > *, .badge, .prick .p2 { animation: none; }
    button:active { transform: none; }
    .finger.down .ring { animation: none; opacity: .5; }
    .finger { transition: opacity 150ms linear; }
  }
</style>
</head>

    <symbol id="icCal" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g></symbol>
    <symbol id="icLoop" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 3.5v4.2h4.2"/></g></symbol>

<script>
/* ===== 선인장 키우기 (desert-breath) Sound module =====
 * Web Audio API 실시간 합성. 외부 파일/의존성 없음.
 * AudioContext 미지원·생성 실패 시 모든 호출은 조용히 무시된다(게임은 소리 없이 정상 진행).
 *
 * 사용법: 사용자 제스처(click/touchend/pointerup/keydown) 핸들러 맨 앞에서 Sound.unlock() →
 *   판 시작: Sound.startAmbient()
 *   매 프레임: Sound.update({ now:'rain', heavy:0.4, next:'sand', nextIn:1.8, open:true })
 *   순간 효과음: Sound.play('open'), Sound.play('close'), Sound.play('grow', { cm: 23 }), Sound.play('sting') ...
 *
 * [박자 없음] 이 게임 소리에는 박자·루프 멜로디가 없다. 환경음은 노이즈 + 서로 맞지 않는 느린 흔들림(LFO),
 *   빗방울·꿀렁·지글은 매번 무작위 간격. 리듬 게임처럼 들리면 안 된다.
 * [공정성] 다가오는 날씨는 화면 예고 띠와 똑같이 "도착 3초 전"부터만 작게(최대 50%, 빗방울 알갱이 없이) 들린다. 그보다 일찍은 절대 안 남.
 *   날씨가 실제로 바뀌는 순간은 빠르게(시정수 50ms) 바뀌어 귀로도 경계가 분명하다.
 * [연타] open/close는 가장 자주 나는 소리라 가장 작고 짧다. 동시 발음 최대 2개, 50ms 스로틀, 연타할수록 작아짐.
 *
 * 신호 경로: sfxBus → LP 9kHz ─────────────┐
 *            ambBus(환경음) → ambDuck ─────┴→ master(음소거) → limiter → destination
 */
const Sound = (function () {
  'use strict';
  var MUTE_KEY = 'desert-breath-muted';
  var MASTER_VOL = 0.6;
  var AMB_VOL = 1.0;        // 환경음 버스(각 층 레벨은 LV 표)
  var DUCK = 0.45;          // 해질녘·말라 쓰러짐·새 기록 때 환경음을 잠깐 낮추는 비율
  var OC_CAP = 2;           // open/close 동시 발음 최대 수
  var PREVIEW_MAX = 0.5;    // 예고 중인 날씨의 최대 음량 비율(도착 순간 1.0, 빗방울·지글 같은 알갱이는 도착 순간부터)
  var PREVIEW_SEC = 3;      // 예고 시간(화면 예고 띠와 같음). 이보다 일찍 들려주지 않는다

  // 환경음 층 레벨(층 게인 값, master 0.6 앞)
  var LV = {
    wind: 0.055,      // 바탕 사막 바람(항상). 해 날씨에는 0.5배(고요하고 뜨거움)
    rainLo: 0.045,    // 빗소리: 빗줄 가늘 때(heavy 0)
    rainHi: 0.125,    // 빗소리: 빗줄 굵을 때(heavy 1)
    sand: 0.11,      // 모래바람(고음 노이즈 + 낮은 바람)
    sun: 0.035,       // 한낮 해(아주 옅은 고음 아지랑이)
    sizzle: 0.03,    // 해에 열려 있는 동안 '치이—'
    grit: 0.035,     // 모래에 열려 있는 동안 '사사삭'
    rainPv: 0.07,    // 예고 중인 비의 기준(빗방울 없이 '쏴—' 몸통만이라 가는 비보다 기준을 높게)
    sunPv: 0.06      // 예고 중인 해의 기준
  };

  var ctx = null, master = null, limiter = null, sfxBus = null, sfxTone = null;
  var ambBus = null, ambDuck = null, noiseBuf = null;
  var muted = false, offline = false;
  var last = {}, ocPool = [];
  var amb = { want: false, on: false, nodes: null, stopTimer: null };
  var paused = false;       // 일시정지 화면(날씨 띠가 가려짐) 동안 환경음·알갱이 모두 멈춤
  // 현재 적용된 상태(차이가 있을 때만 AudioParam을 건드린다 — 매 프레임 호출해도 가벼움)
  var st = { now: 'clear', heavy: 0, next: null, pv: 0, open: false };
  var applied = {};
  var micro = { drop: 0, gulp: 0, crackle: 0 };   // 무작위 알갱이 다음 예정 시각

  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) { muted = false; }

  function build(c) {
    ctx = c;
    limiter = ctx.createDynamicsCompressor();          // 마스터 리미터
    limiter.threshold.value = -6; limiter.knee.value = 2; limiter.ratio.value = 20;
    limiter.attack.value = 0.002; limiter.release.value = 0.15;
    limiter.connect(ctx.destination);

    master = ctx.createGain();
    master.gain.value = muted ? 0 : MASTER_VOL;
    master.connect(limiter);

    sfxTone = ctx.createBiquadFilter();
    sfxTone.type = 'lowpass'; sfxTone.frequency.value = 9000; sfxTone.Q.value = 0.5;
    sfxTone.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(sfxTone);

    ambDuck = ctx.createGain(); ambDuck.gain.value = 1; ambDuck.connect(master);
    ambBus = ctx.createGain(); ambBus.gain.value = 0; ambBus.connect(ambDuck);

    // 노이즈 버퍼 1개(4초, 스테레오, 고정 시드)를 환경음·효과음 모두 재사용. 4초라 반복이 귀에 잡히지 않고,
    // 두 재생기는 루프 구간·속도를 다르게 해 같은 무늬가 겹쳐 돌지 않는다.
    var len = Math.floor(ctx.sampleRate * 4);
    noiseBuf = ctx.createBuffer(2, len, ctx.sampleRate);
    var seed = 20261127;
    for (var ch = 0; ch < 2; ch++) {
      var d = noiseBuf.getChannelData(ch);
      for (var j = 0; j < len; j++) { seed = (seed * 1103515245 + 12345) & 0x7fffffff; d[j] = seed / 0x3fffffff - 1; }
      // 루프 이음매 클릭 방지: 끝 20ms를 앞부분과 교차 페이드
      var xf = Math.floor(ctx.sampleRate * 0.02);
      for (var k = 0; k < xf; k++) { var a = k / xf; d[len - xf + k] = d[len - xf + k] * (1 - a) + d[k] * a; }
    }
    applied = {};
  }

  function ensureCtx() {
    if (ctx) return ctx;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      var c;
      try { c = new AC({ latencyHint: 'interactive' }); } catch (e1) { c = new AC(); }
      build(c);
    } catch (e) { ctx = null; }
    return ctx;
  }

  function running() { return !!ctx && (offline || ctx.state === 'running'); }
  function ready() { return running() && !muted; }

  function throttled(key, t, gap) {
    if (last[key] !== undefined && t - last[key] < gap && t >= last[key]) return true;
    last[key] = t;
    return false;
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rnd(a, b) { return a + Math.random() * (b - a); }

  // ---------- 음원 기본 블록 (엔벨로프는 0.0001에서 지수 어택/감쇠 — 클릭음 방지) ----------
  function tone(type, f0, f1, t, dur, vol, attack, dest) {
    try {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.8);
      var a = attack || 0.005;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest || sfxBus);
      o.start(t); o.stop(t + dur + 0.03);
      return o;
    } catch (e) { return null; }
  }

  function noise(t, dur, vol, ftype, f0, f1, q, attack, dest) {
    try {
      var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noiseBuf;
      f.type = ftype; f.Q.value = q || 0.8;
      f.frequency.setValueAtTime(f0, t);
      if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      var a = attack || 0.004;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(dest || sfxBus);
      s.start(t, Math.random() * 3.5); s.stop(t + dur + 0.03);
      return s;
    } catch (e) { return null; }
  }

  // 마림바풍: sine 기음 + 4배 배음(짧게)
  function mallet(f, t, dur, vol, dest) {
    tone('sine', f, 0, t, dur, vol, 0.003, dest);
    tone('sine', f * 4, 0, t, Math.min(0.03, dur * 0.3), vol * 0.08, 0.001, dest);
  }

    setTime: function (ms) {
      if (!G.sim) return;
      if (G.phase === 'ready') { G.phase = 'play'; }
      G.sim.runTo(Math.floor(ms / STEP) * STEP);
      G.origin = now() - G.sim.t;
    },
    engine: Engine, params: Engine.P, demo: function () { var s = Demo.sim(); return s ? { t: s.t, W: s.W, H: s.H, stings: s.stings.map(function (x) { return { kind: x.kind, lateMs: x.lateMs, type: x.type }; }) } : null; }
  };

  // ---------- 시작 ----------
  syncPalette(); syncMute();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', layout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
  var mo = new MutationObserver(function () { syncPalette(); G.drawnMenu = false; draw(); });
  mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (DARKQ.addEventListener) DARKQ.addEventListener('change', function () { G.drawnMenu = false; draw(); });
  layout();
  showStart();
  G.lastFrame = now();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
