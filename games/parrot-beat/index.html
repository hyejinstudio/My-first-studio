<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>박자 앵무새</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="박자 앵무새">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e4572e">
<style>
  /* 숫자 전용 글꼴: Pretendard ExtraBold(SIL OFL 1.1)의 0-9,+ 서브셋. 수정본이라 내부 이름은 BeatDigits. 라이선스 fonts/OFL.txt */
  @font-face { font-family: "BeatDigits"; src: url("fonts/beat-digits-800.woff2") format("woff2");
    font-weight: 800; font-style: normal; font-display: swap; unicode-range: U+0030-0039, U+002B; }
  :root {
    --app-h: 100vh;
    --app-h: 100dvh;
    --num-font: "BeatDigits", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    --bg: #f4f1ea; --panel: #ffffff; --ink: #1f2430; --muted: #6b7280; --grid: #e7e2d8; --well: #fbfaf7;
    --accent: #e4572e; --gold: #f2b134; --danger: #d64545;
    --teacher: #8fa0c6; --teacher-belly: #e7ebf4; --teacher-edge: #5f7099; --teacher-ink: #4a5c88; --teacher-tint: #eef1f8;
    --parrot: #93c19f; --parrot-belly: #e9f3e9; --parrot-edge: #5d9170; --parrot-ink: #3f7752; --parrot-tint: #edf5ee;
    --cheek: #f0b4a8; --beak: #e8bf73; --eye: #2a2d36;
    --drum-head: #f6efe2; --drum-side: #c98d68; --drum-edge: #9a6647;
    --beat: #c9694a; --off: #4b958f; --early: #6b8fc4; --late: #c58a3c; --good: #5f9b6c;
    --shadow: rgba(40,50,70,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141a; --panel: #1b1e27; --ink: #eceef3; --muted: #9aa1ae; --grid: #262a35; --well: #161921;
      --accent: #ff7a50; --gold: #ffc94d; --danger: #ff6b6b;
      --teacher: #5d6f99; --teacher-belly: #3a4560; --teacher-edge: #b4c2e2; --teacher-ink: #a9b9e0; --teacher-tint: #1f2433;
      --parrot: #5b8f6a; --parrot-belly: #33493a; --parrot-edge: #b3d8bd; --parrot-ink: #a3d3b0; --parrot-tint: #1b2a21;
      --cheek: #c98a80; --beak: #d4a95c; --eye: #1a1c22;
      --drum-head: #d9cfbd; --drum-side: #9c6b4f; --drum-edge: #e0b896;
      --beat: #e48a6a; --off: #6cbcb5; --early: #8eaee0; --late: #e2ae62; --good: #85c493;
      --shadow: rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12141a; --panel: #1b1e27; --ink: #eceef3; --muted: #9aa1ae; --grid: #262a35; --well: #161921;
    --accent: #ff7a50; --gold: #ffc94d; --danger: #ff6b6b;
    --teacher: #5d6f99; --teacher-belly: #3a4560; --teacher-edge: #b4c2e2; --teacher-ink: #a9b9e0; --teacher-tint: #1f2433;
    --parrot: #5b8f6a; --parrot-belly: #33493a; --parrot-edge: #b3d8bd; --parrot-ink: #a3d3b0; --parrot-tint: #1b2a21;
    --cheek: #c98a80; --beak: #d4a95c; --eye: #1a1c22;
    --drum-head: #d9cfbd; --drum-side: #9c6b4f; --drum-edge: #e0b896;
    --beat: #e48a6a; --off: #6cbcb5; --early: #8eaee0; --late: #e2ae62; --good: #85c493;
    --shadow: rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: var(--app-h); overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  .num { font-family: var(--num-font); font-weight: 800; font-variant-numeric: tabular-nums; }
  svg [hidden] { display: none; }
  /* .app·.stage와 조상에는 transform/filter 금지 (ov-full의 position:fixed가 깨짐) */
  .app { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; touch-action: none; }

  /* 상단 바 (붕어빵 눈싸움과 같은 구조) */
  .top {
    flex: none; height: var(--tb, 52px); width: var(--sw, 600px);
    display: flex; align-items: center; gap: 8px;
  }
  .home {
    flex: none; min-height: 44px; display: inline-flex; align-items: center; padding: 0 8px; margin-left: -8px;
    color: var(--muted); font-size: 14px; text-decoration: none; border-radius: 8px; white-space: nowrap;
  }
  .home:hover, .home:focus-visible { color: var(--ink); }
  .home .short { display: none; }
  .home:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .title { margin: 0; font-size: 18px; font-weight: 800; white-space: nowrap; }
  .spacer { flex: 1; min-width: 0; }
  .stagepill {
    flex: none; height: 32px; padding: 0 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--grid);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .stagepill svg { width: 16px; height: 16px; flex: none; }
  .stagepill .sn { font-size: 16px; min-width: 10px; text-align: center; }
  .sdots { display: inline-flex; gap: 4px; }
  .sdots i { width: 6px; height: 6px; border-radius: 50%; background: var(--grid); transition: background-color 200ms ease-out; }
  .sdots i.on { background: var(--parrot-ink); }
  .scorev { flex: none; font-size: 20px; min-width: 4.2ch; text-align: right; color: var(--ink); }
  .hearts { flex: none; display: inline-flex; gap: 2px; }
  .hearts svg { width: 20px; height: 20px; display: block; }
  .hearts svg { fill: var(--danger); stroke: var(--danger); stroke-width: 1.6; transition: fill 200ms ease-out, stroke 200ms ease-out; }
  .hearts svg.lost { fill: none; stroke: var(--muted); }
  .btns { display: flex; gap: 6px; flex: none; }

  button {
    font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--grid);
    border-radius: 10px; cursor: pointer; touch-action: manipulation;
    transition: transform 80ms ease-out, background-color 80ms ease-out;
  }
  button:active { transform: scale(.94); background: var(--grid); }
  button:disabled { opacity: .5; cursor: default; }
  button.icon { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; font-size: 18px; color: var(--ink); }
  button.icon svg { width: 20px; height: 20px; }
  button.icon svg[hidden] { display: none; }
  button.primary {
    background: var(--accent); color: #fff; border-color: transparent; font-weight: 700;
    height: 48px; padding: 0 24px; font-size: 18px; flex: none;
  }
  button.primary:active { background: var(--accent); filter: brightness(.92); }
  button.secondary, a.secondary {
    height: 44px; padding: 0 18px; font-size: 15px; background: var(--panel); color: var(--ink);
    border: 1px solid var(--grid); border-radius: 10px; display: inline-flex; align-items: center; text-decoration: none; flex: none;
  }
  button.small { height: 44px; padding: 0 14px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
  button.small svg { width: 18px; height: 18px; flex: none; }
  button.hl { border: 2px solid var(--gold); }

  /* 무대 */
  .stage { position: relative; flex: none; width: var(--sw, 600px); height: var(--sh, 400px); }
  .birdbox { position: absolute; display: grid; place-items: center; }
  .birdbox .base { position: absolute; left: 5%; top: 5%; width: 90%; height: 90%; border-radius: 50%; opacity: 0; transition: opacity 200ms ease-out; }
  #tBox .base { background: var(--teacher-tint); }
  #mBox .base { background: var(--parrot-tint); }
  .birdbox.on .base { opacity: 1; }
  .birdbox svg.bird { position: relative; width: 100%; height: 100%; display: block; overflow: visible; transition: opacity 200ms ease-out; opacity: .55; }
  #mBox svg.bird { width: 90%; height: 90%; }
  .birdbox.on svg.bird { opacity: 1; }
  .hop, .breath, .head, .dhead { transform-box: fill-box; }
  .breath { transform-origin: 50% 100%; animation: breathe 2400ms ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scaleY(1.02); } }
  .head { transform-origin: 50% 85%; transition: transform 300ms ease-out; }
  .teacher.listen .head { transform: rotate(6deg); }
  .me.listen .head { transform: rotate(-6deg); }
  .dhead { transform-origin: 50% 50%; }
  .wing { transition: transform 200ms ease-out; }
  .me.ready .wing { transform: rotate(-14deg); }
  .arc { opacity: 0; }
  .t-body { fill: var(--teacher); stroke: var(--teacher-edge); stroke-width: 2; }
  .t-belly { fill: var(--teacher-belly); }
  .t-edge { fill: var(--teacher-edge); }
  .t-wing { fill: var(--teacher-edge); opacity: .85; }
  .m-body { fill: var(--parrot); stroke: var(--parrot-edge); stroke-width: 2; }
  .m-belly { fill: var(--parrot-belly); }
  .m-edge { fill: var(--parrot-edge); }
  .m-wing { fill: var(--parrot-edge); opacity: .85; }
  .b-shadow { fill: var(--shadow); }
  .b-eye { fill: var(--eye); }
  .b-hl { fill: #fff; }
  .b-line { fill: none; stroke: var(--eye); stroke-width: 2.4; stroke-linecap: round; }
  .b-beak { fill: var(--beak); stroke: var(--beak); stroke-width: 2; stroke-linejoin: round; }
  .m-beak { fill: var(--beak); stroke: var(--drum-edge); stroke-width: 1.2; stroke-opacity: .5; stroke-linejoin: round; }
  .b-cheek { fill: var(--cheek); opacity: .55; }
  .d-side { fill: var(--drum-side); stroke: var(--drum-edge); stroke-width: 1.5; }
  .d-head { fill: var(--drum-head); stroke: var(--drum-edge); stroke-width: 1.5; }
  .t-arc { fill: none; stroke: var(--teacher-ink); stroke-width: 2.4; stroke-linecap: round; }
  .m-arc { fill: none; stroke: var(--parrot-ink); stroke-width: 2.4; stroke-linecap: round; }
  .m-tuft { fill: none; stroke: var(--parrot-edge); stroke-width: 3; stroke-linecap: round; }

  .tl {
    position: absolute; border-radius: 14px; background: var(--panel); border: 1px solid var(--grid); opacity: .6;
    transition: background-color 150ms ease-out, border-color 150ms ease-out, opacity 150ms ease-out, box-shadow 150ms ease-out;
  }
  #tlMe { opacity: .75; }
  #tlT.on { background: var(--teacher-tint); border-color: var(--teacher-ink); box-shadow: inset 0 0 0 1px var(--teacher-ink); opacity: 1; }
  #tlMe.on { background: var(--parrot-tint); border-color: var(--parrot-ink); box-shadow: inset 0 0 0 1px var(--parrot-ink); opacity: 1; }
  .stage.idle .tl { opacity: 1; }
  .tl canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tl .ticon { position: absolute; left: 6px; top: 5px; width: 16px; height: 16px; opacity: .55; transition: opacity 150ms ease-out; }
  .tl.on .ticon { opacity: 1; }
  #tlT .ticon { color: var(--teacher-ink); }
  #tlMe .ticon { color: var(--parrot-ink); }

  .combo {
    position: absolute; height: 30px; padding: 0 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--grid);
    display: inline-flex; align-items: center; gap: 4px; visibility: hidden; white-space: nowrap; transition: border-color 200ms ease-out, opacity 200ms ease-out;
  }
  .combo.show { visibility: visible; }
  .combo.gold { border-color: var(--gold); }
  .combo b { font-size: 18px; }
  .combo span { font-size: 11px; font-weight: 700; color: var(--muted); }

  .ripple { position: fixed; left: 0; top: 0; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%;
    border: 2px solid var(--parrot-ink); pointer-events: none; z-index: 30; opacity: 0; }
  .fx { position: absolute; pointer-events: none; width: 12px; height: 12px; }

  /* 오버레이 (붕어빵 눈싸움과 같은 CSS) */
  .overlay {
    position: absolute; inset: 0; border-radius: 12px; padding: 16px; overflow-x: hidden; overflow-y: auto; touch-action: pan-y;
    display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: safe center; text-align: center;
    background: color-mix(in srgb, var(--well) 94%, transparent); line-height: 1.4; z-index: 3;
    animation: ovIn 200ms ease-out;
  }
  .overlay > * { animation: ovUp 200ms ease-out; flex: none; }
  @keyframes ovIn { from { opacity: 0; } }
  @keyframes ovUp { from { transform: translateY(8px); } }
  .overlay[hidden] { display: none; }
  #ovPause, #ovCal { background: color-mix(in srgb, var(--well) 97%, transparent); }
  body.ov-full .overlay { position: fixed; inset: 0; border-radius: 0; z-index: 10; background: color-mix(in srgb, var(--well) 97%, transparent);
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .overlay .ov-home { display: none; }
  body.ov-full .overlay .ov-home { display: inline-flex; position: absolute; margin: 0; animation: none;
    top: max(4px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); }
  .overlay h2 { margin: 0; font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 8px; justify-content: center; }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; }
  .overlay .small { font-size: 12px; }
  .overlay .row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .overlay [hidden] { display: none !important; }
  .minis { display: flex; gap: 10px; justify-content: center; }
  .minis svg { width: 72px; height: 72px; }
  .legend { display: flex; gap: 8px; justify-content: center; }
  .lcard { width: 76px; height: 64px; background: var(--panel); border: 1px solid var(--grid); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; }
  .lcard canvas { width: 40px; height: 32px; display: block; }
  .badge { background: var(--gold); color: #1f2430; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 3px 10px; }
  .resbig { font-size: 40px; line-height: 1.05; }
  .reslist { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .reslist span { background: var(--panel); border: 1px solid var(--grid); border-radius: 999px; padding: 2px 10px; font-size: 13px; color: var(--muted); }
  .reslist b { color: var(--ink); margin-left: 4px; }
  #resBird svg { width: 96px; height: 96px; }
  .calbig { width: 120px; height: 120px; border-radius: 50%; background: var(--panel); border: 2px solid var(--grid); display: grid; place-items: center; }
  .calbig i { width: 56px; height: 56px; border-radius: 50%; background: var(--beat); opacity: .35; }
  .caldots { display: flex; gap: 6px; }
  .caldots i { width: 10px; height: 10px; border-radius: 50%; background: var(--grid); }
  .caldots i.warm { background: color-mix(in srgb, var(--muted) 45%, var(--grid)); }
  .caldots i.on { background: var(--parrot-ink); }
  .calval { font-size: 40px; }
  .hint-touch { display: none; }
  @media (pointer: coarse) { .overlay .hint-touch { display: block; } .overlay .hint-key { display: none; } }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* 상단 바 너비 구간 (JS가 body 클래스로 지정) */
  body.tb-760 .title { display: none; }
  body.tb-640 .home .full { display: none; }
  body.tb-640 .home .short { display: inline; }
  body.tb-420 .stagepill svg, body.tb-420 .sdots { display: none; }
  body.tb-420 .stagepill { padding: 0 8px; }
  body.tb-420 .hearts svg { width: 16px; height: 16px; }
  body.tb-420 .scorev { font-size: 17px; }
  body.tb-420 .top { gap: 6px; }
  @media (max-height: 520px) {
    .overlay h2 { font-size: 20px; }
    .overlay { gap: 6px; padding: 8px; }
    body.ov-full .overlay { padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    .minis svg { width: 56px; height: 56px; }
    .resbig { font-size: 32px; }
    #resBird svg { width: 64px; height: 64px; }
    .calbig { width: 84px; height: 84px; }
    .calbig i { width: 40px; height: 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .overlay, .overlay > * { animation: none; }
    .breath { animation: none; }
    button:active { transform: none; }
  }
</style>
</head>

<script>
/* ===== 박자 앵무새 (parrot-beat) Sound module =====
 * Web Audio API 실시간 합성. 외부 파일/의존성 없음. 오리지널 소리·패턴만 사용.
 * AudioContext 미지원·실패 시 모든 호출은 조용히 무시된다(게임은 소리 없이 계속 동작).
 *
 * 공통 API:  Sound.unlock() / play(name, opts) / setMuted(bool) / isMuted() / startMusic() / stopMusic()
 * 추가 API:  Sound.setVolume(0~1) / getVolume()
 * 리듬 API:  Sound.Beat  (박자 시계 + lookahead 스케줄러 + 판정용 시간 변환) — 아래 Beat 참고
 *
 * 그리드: 4/4, 한 마디 = 16스텝(16분음표). stepInBar 0,4,8,12 = 정박(1·2·3·4박), 2,6,10,14 = 8분 엇박(앤),
 *         1,3,5,… = 16분 엇박.
 * 시간 단위는 모두 AudioContext 초(ctx.currentTime 기준). 콜백은 소리보다 약 0.03~0.15초 먼저 호출된다(예약 시점).
 */
const Sound = (function () {
  'use strict';
  var MUTE_KEY = 'parrot-beat-muted';
  var OFFSET_KEY = 'parrot-beat-offset';   // 사용자 보정값(ms), 선택 기능
  var MASTER_VOL = 0.8;
  var MUSIC_VOL = 0.55;      // 반주(메트로놈·베이스·코드·하이햇) 버스
  var LOOKAHEAD = 0.12;      // 스케줄러가 미리 예약하는 구간(초)
  var TICK_MS = 25;          // 스케줄러 깨어나는 주기(ms)
  var COMP_DELAY = 0.006;    // DynamicsCompressor 룩어헤드(Chromium 6ms). 예약음만 이 경로를 지난다

  var ctx = null, offline = false;
  var master = null, comp = null, shaper = null, musicBus = null, clockBus = null, teacherBus = null,
      sfxBus = null, tapBus = null, noiseBuf = null;
  var muted = false, volume = 1, warmed = false;
  var last = {};
  var userOffset = 0;        // 초
  var userPaused = false;

  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) { muted = false; }
  try { userOffset = (parseFloat(localStorage.getItem(OFFSET_KEY)) || 0) / 1000; } catch (e) { userOffset = 0; }
  if (!(userOffset >= -0.08 && userOffset <= 0.4)) userOffset = 0;   // design.md 범위 −80~+400ms

  // ---------- 그래프 ----------
  // [musicBus,teacherBus,sfxBus] → clockBus/compressor → master → soft-clip shaper → destination
  // [tapBus] ─────────────────────────────────────────→ master   (탭은 컴프레서 룩어헤드 지연을 피함)
  function build(c) {
    ctx = c;
    master = ctx.createGain();
    master.gain.value = muted ? 0 : MASTER_VOL * volume;

    // 소프트 클리퍼(지연 없음): 입력을 0.5배로 받아 ±2.0까지 처리, ±0.6까지는 선형, 이후 0.95로 부드럽게 수렴
    shaper = ctx.createWaveShaper();
    var n = 2048, curve = new Float32Array(n);
    for (var i = 0; i < n; i++) {
      var u = (i / (n - 1)) * 4 - 2, a = Math.abs(u);
      var y = a < 0.6 ? a : 0.6 + 0.35 * Math.tanh((a - 0.6) / 0.35);
      curve[i] = u < 0 ? -y : y;
    }
    shaper.curve = curve;
    shaper.oversample = 'none';
    var pre = ctx.createGain(); pre.gain.value = 0.5;
    var post = ctx.createGain(); post.gain.value = 1; // shaper 출력은 원 레벨 그대로(곡선이 2배 영역을 표현)
    master.connect(pre); pre.connect(shaper); shaper.connect(post); post.connect(ctx.destination);

    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 8; comp.ratio.value = 6;
    comp.attack.value = 0.003; comp.release.value = 0.18;
    comp.connect(master);

    clockBus = ctx.createGain(); clockBus.gain.value = 1; clockBus.connect(comp); // 정지 시 예약음 컷용
    musicBus = ctx.createGain(); musicBus.gain.value = MUSIC_VOL; musicBus.connect(clockBus);
    teacherBus = ctx.createGain(); teacherBus.gain.value = 1; teacherBus.connect(clockBus);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(comp);
    tapBus = ctx.createGain(); tapBus.gain.value = 1; tapBus.connect(master);

    var len = Math.floor(ctx.sampleRate * 0.6);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = noiseBuf.getChannelData(0), seed = 12345;
    for (var j = 0; j < len; j++) { seed = (seed * 1103515245 + 12345) & 0x7fffffff; d[j] = seed / 0x3fffffff - 1; }
  }

  function ensureCtx() {
    if (ctx) return ctx;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      var c;
      try { c = new AC({ latencyHint: 'interactive' }); } catch (e1) { c = new AC(); }
      build(c);
    } catch (e) { ctx = null; }
    return ctx;
  }

  function running() { return !!ctx && (offline || ctx.state === 'running'); }
  function ready() { return running() && !muted; }
  function throttled(name, t, gap) {
    if (last[name] !== undefined && t - last[name] < gap && t >= last[name]) return true;
    last[name] = t; return false;
  }

  // ---------- 합성 기본 블록 ----------
  // 음: 파형, 주파수 f0→f1(glide초 동안), 시작, 길이, 피크, 어택, 출력
  function tone(type, f0, f1, t, dur, vol, attack, dest, glide) {
    try {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + (glide || dur));
      var a = attack || 0.002;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest || sfxBus);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function noise(t, dur, vol, ftype, freq, q, dest, freqEnd) {
    try {
      var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noiseBuf;
      f.type = ftype; f.frequency.setValueAtTime(freq, t);
      if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
      if (q) f.Q.value = q;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.001);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(dest || sfxBus);
      s.start(t, Math.random() * 0.3); s.stop(t + dur + 0.02);
    } catch (e) {}
  }
  // 새 지저귐: 위로 갔다 내려오는 짧은 글라이드 (앵무새 캐릭터 소리)
  function chirp(t, f0, fPeak, fEnd, dur, vol, dest) {
    try {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(fPeak, t + dur * 0.4);
      o.frequency.exponentialRampToValueAtTime(fEnd, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
      g.gain.setValueAtTime(vol, t + dur * 0.5);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest || sfxBus);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }

  // 음이름 (C 메이저)
  var N = { F2: 87.31, G2: 98.0, A2: 110.0, C3: 130.81, G3: 196.0, A3: 220.0, B3: 246.94,
            C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.0, A4: 440.0,
            C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880.0,
            C6: 1046.5, D6: 1174.66, E6: 1318.51, G6: 1567.98, A6: 1760.0, C7: 2093.0, G7: 3135.96 };

  // ---------- 효과음 ----------
  var sfx = {
    // 선생님 북 (부르기 마디). 낮고 둥근 손북 '둥'. opts.accent=true면 조금 크고 높게
    teacher: function (t, o) {
      var ac = o && o.accent, k = ac ? 1.12 : 1, v = ac ? 1.15 : 1;
      tone('sine', 250 * k, 150 * k, t, 0.17, 0.50 * v, 0.001, teacherBus, 0.06);
      tone('triangle', 500 * k, 290 * k, t, 0.05, 0.10 * v, 0.001, teacherBus, 0.03);
      noise(t, 0.022, 0.14 * v, 'lowpass', 1800, 0.7, teacherBus);
    },
    // 내 탭 (따라하기). 밝은 나무토막 '톡' — 선생님 북보다 높고 짧다. 탭 즉시 재생
    // opts.soft=true → 절반 크기(부르기·카운트인·전환 마디의 연습 탭용)
    tap: function (t, o) {
      if (throttled('tap', t, 0.025)) return;
      var v = o && o.soft ? 0.5 : 1;
      tone('sine', 760, 700, t, 0.07, 0.36 * v, 0.001, tapBus, 0.02);
      tone('sine', 1820, 1700, t, 0.035, 0.10 * v, 0.001, tapBus, 0.02);
      noise(t, 0.012, 0.20 * v, 'bandpass', 2400, 1.4, tapBus);
    },
    // 판정: 탭 소리 위에 살짝 얹는 작은 반짝(리듬을 가리지 않게 아주 작고 짧게)
    perfect: function (t) {
      if (throttled('judge', t, 0.03)) return;
      tone('sine', N.C7, 0, t + 0.01, 0.06, 0.05, 0.002);
      tone('sine', N.G7, 0, t + 0.03, 0.05, 0.025, 0.002);
    },
    good: function (t) {
      if (throttled('judge', t, 0.03)) return;
      tone('sine', N.G6, 0, t + 0.01, 0.045, 0.035, 0.002);
    },
    // 놓침(쳐야 할 박을 안 침): 둔하고 낮은 '뚝'
    miss: function (t) {
      if (throttled('miss', t, 0.06)) return;
      tone('triangle', 160, 105, t, 0.12, 0.12, 0.004);
      noise(t, 0.05, 0.04, 'lowpass', 500, 0.7);
    },
    // 헛박(칠 곳이 아닌데 침): 탭 소리 뒤에 붙는 막힌 '퍽'
    extra: function (t) {
      if (throttled('extra', t, 0.06)) return;
      noise(t + 0.01, 0.06, 0.08, 'lowpass', 700, 0.7, sfxBus, 250);
      tone('sine', 110, 80, t + 0.01, 0.08, 0.10, 0.003);
    },
    // 하트 회복(단계 무실패 +1): 부드러운 상승 2음
    heartGain: function (t) {
      tone('triangle', N.C5, 0, t, 0.10, 0.11, 0.004);
      tone('triangle', N.G5, 0, t + 0.10, 0.22, 0.12, 0.004);
      tone('sine', N.G6, 0, t + 0.12, 0.18, 0.025, 0.004);
    },
    // 결과 화면 새 기록: 작은 반짝 상승 + 지저귐
    newBest: function (t) {
      var arp = [N.G5, N.C6, N.E6, N.G6];
      for (var i = 0; i < arp.length; i++) tone('sine', arp[i], 0, t + i * 0.07, 0.16, 0.08, 0.003);
      chirp(t + 0.30, 1800, 3000, 2400, 0.12, 0.05);
      noise(t + 0.25, 0.3, 0.012, 'highpass', 7500);
    },
    // 한 마디를 전부 맞힘: 앵무새 기쁜 지저귐 2번
    phraseClear: function (t) {
      chirp(t, 1500, 2500, 2000, 0.09, 0.07);
      chirp(t + 0.11, 1700, 2900, 2300, 0.10, 0.07);
    },
    // 콤보 단계 도달. opts.level = 1,2,3… (단계마다 시작음이 한 칸씩 올라감)
    combo: function (t, o) {
      var lv = Math.max(1, Math.min(5, Math.floor(+(o && o.level)) || 1));
      var base = [N.C5, N.D5, N.E5, N.G5, N.A5][lv - 1];
      tone('triangle', base, 0, t, 0.07, 0.08, 0.003);
      tone('triangle', base * 1.25, 0, t + 0.06, 0.07, 0.08, 0.003);
      tone('triangle', base * 1.5, 0, t + 0.12, 0.20, 0.11, 0.003);
      tone('sine', base * 3, 0, t + 0.12, 0.15, 0.02, 0.003);
    },
    // 단계 상승(템포 오름): 상승 아르페지오 + 반짝. 마디 첫 박에 맞춰 Beat.schedule 권장
    levelUp: function (t) {
      var arp = [N.C5, N.E5, N.G5, N.C6];
      for (var i = 0; i < arp.length; i++) tone('triangle', arp[i], 0, t + i * 0.06, 0.14, 0.12, 0.003);
      tone('sine', N.E6, 0, t + 0.24, 0.30, 0.04, 0.005);
      chirp(t + 0.26, 1600, 2700, 2200, 0.12, 0.05);
      noise(t + 0.22, 0.25, 0.015, 'highpass', 7000);
    },
    // 하트 잃음: 부드러운 하강 2음 + 낮은 '툭'
    heartLost: function (t) {
      if (throttled('heartLost', t, 0.3)) return;
      tone('triangle', N.E5, 0, t, 0.12, 0.13, 0.004);
      tone('triangle', N.C5, 0, t + 0.12, 0.22, 0.13, 0.004);
      tone('sine', 120, 80, t, 0.15, 0.12, 0.004);
    },
    // 게임 오버: 느린 하강 3음 + 저음 (반주는 Developer가 stopMusic/Beat.stop으로 멈춤)
    gameOver: function (t) {
      tone('triangle', N.G4, 0, t, 0.30, 0.15, 0.01);
      tone('triangle', N.E4, 0, t + 0.28, 0.30, 0.15, 0.01);
      tone('triangle', N.C4, 0, t + 0.56, 0.70, 0.15, 0.01);
      tone('sine', N.C3, 0, t + 0.56, 0.80, 0.14, 0.02);
      chirp(t + 0.95, 1400, 1500, 900, 0.25, 0.03); // 기운 빠진 '삐우…'
    },
    // 클리어(최종 단계 통과): 팡파르 + 앵무새 지저귐
    clear: function (t) {
      tone('square', N.C5, 0, t, 0.09, 0.05);
      tone('square', N.E5, 0, t + 0.10, 0.09, 0.05);
      tone('square', N.G5, 0, t + 0.20, 0.09, 0.05);
      tone('triangle', N.C6, 0, t + 0.30, 0.70, 0.18, 0.01);
      tone('triangle', N.G5, 0, t + 0.30, 0.70, 0.10, 0.01);
      tone('triangle', N.E5, 0, t + 0.30, 0.70, 0.08, 0.01);
      tone('sine', N.C3, 0, t + 0.30, 0.70, 0.12, 0.01);
      chirp(t + 0.45, 1500, 2600, 2100, 0.10, 0.06);
      chirp(t + 0.58, 1800, 3000, 2400, 0.10, 0.06);
      chirp(t + 0.71, 2000, 3300, 2600, 0.14, 0.06);
      noise(t + 0.30, 0.5, 0.02, 'highpass', 7000);
    },
    // 카운트인 막대 '딱'. opts.n = 1~4 (4는 조금 높게: "이제 시작")
    count: function (t, o) {
      var n = (o && o.n) || 1, f = n >= 4 ? 2000 : 1500;
      tone('sine', f, f * 0.85, t, 0.04, 0.12, 0.001, musicBus);
      noise(t, 0.015, 0.10, 'bandpass', 3500, 1.5, musicBus);
    },
    start: function (t) {
      chirp(t, 1400, 2400, 1900, 0.09, 0.07);
      tone('triangle', N.C5, 0, t + 0.10, 0.10, 0.12, 0.004);
      tone('triangle', N.G5, 0, t + 0.20, 0.20, 0.12, 0.004);
    },
    button: function (t) { if (!throttled('button', t, 0.05)) tone('sine', 880, 660, t, 0.05, 0.06, 0.002); },
    pause: function (t) { tone('sine', N.A4, N.E4, t, 0.12, 0.09); },
    resume: function (t) { tone('sine', N.E4, N.A4, t, 0.12, 0.09); }
  };

  sfx.stray = sfx.extra;   // design.md 용어(헛박 = stray) 별칭

  // ---------- 반주 ----------
  // 진행: '부르기' 마디마다 다음 코드 (C → Am → F → G 순환). '따라하기' 마디는 직전 코드 유지.
  var CHORDS = [
    { bass: N.C3, notes: [N.C4, N.E4, N.G4] },
    { bass: N.A2, notes: [N.A3, N.C4, N.E4] },
    { bass: N.F2, notes: [N.A3, N.C4, N.F4] },
    { bass: N.G2, notes: [N.B3, N.D4, N.G4] }
  ];
  var music = { on: false, chordIdx: -1, hat16: false, fadeTimer: null };

  function bass(f, t, dur, vol) {
    tone('sine', f, 0, t, dur, vol, 0.008, musicBus);
    tone('triangle', f * 2, 0, t, dur * 0.6, vol * 0.25, 0.008, musicBus); // 작은 스피커에서도 들리게 2배음
  }
  function chord(ch, t, dur, vol) {
    for (var i = 0; i < ch.notes.length; i++) tone('triangle', ch.notes[i], 0, t, dur, vol, 0.012, musicBus);
  }
  function metro(t, strong) {
    if (strong) { tone('sine', 1320, 1250, t, 0.035, 0.13, 0.001, musicBus); noise(t, 0.008, 0.05, 'highpass', 5000, 0.7, musicBus); }
    else tone('sine', 990, 950, t, 0.025, 0.065, 0.001, musicBus);
  }
  function hat(t, vol) { noise(t, 0.028, vol, 'highpass', 7500, 0.7, musicBus); }

  // stepInfo마다 1번 호출 (예약 시점)
  function backing(si) {
    if (!music.on || si.late) return;
    var t = si.time, s = si.stepInBar, ph = si.phase, beatDur = si.stepDur * 4;
    if (ph === 'silent') return;
    if (ph === 'countin') {                            // 막대 4번만: 딱 딱 딱 딱(4번째 높게)
      if (s % 4 === 0) sfx.count(t, { n: s / 4 + 1 });
      return;
    }
    if (s === 0 && ph === 'call') music.chordIdx = (music.chordIdx + 1) % CHORDS.length;
    var ch = CHORDS[Math.max(0, music.chordIdx)];
    if (ph === 'transition') ph = 'rest';            // 단계 전환 마디 = 쉬는 마디 반주(C 코드, 부르기 없음)
    if (ph === 'rest') ch = CHORDS[0];

    // 메트로놈: 1박 강, 2·3·4박 약. 따라하기 마디 1박은 약한 틱만
    // (CEO 결정 7: '네 차례' 지저귐은 정답 음표와 헷갈릴 수 있어 제거 — 차례는 코드 빠짐 + 화면으로 구분)
    if (s === 0 && ph === 'response') metro(t, false);
    else if (s % 4 === 0) metro(t, s === 0);

    // 하이햇: 8분 엇박(앤)에 은은하게. hat16 켜면 16분 엇박에 더 작게
    if (s % 4 === 2) hat(t, 0.07);
    else if (music.hat16 && s % 2 === 1) hat(t, 0.025);

    // 베이스: 1박(모든 마디), 3박(부르기·쉬는 마디)
    if (s === 0) bass(ch.bass, t, beatDur * 1.6, 0.42);
    if (s === 8 && ph !== 'response') bass(ch.bass, t, beatDur * 1.4, 0.30);

    // 코드: 부르기 마디만(풍성) — 따라하기 마디는 비워서 내 탭이 잘 들리게
    if (ph === 'call' || ph === 'rest') {
      if (s === 0) chord(ch, t, beatDur * 1.8, 0.06);
      if (s === 8) chord(ch, t, beatDur * 1.4, 0.04);
    }
  }

  // ---------- 박자 시계 ----------
  var clk = { running: false, bpm: 100, pendingBpm: 0, stepDur: 60 / 100 / 4, step: 0, bar: 0, barTime: 0,
              nextTime: 0, timer: null, curBar: null, bars: [], plan: {}, stepCbs: [], barCbs: [] };

  function makeBar(barIndex, time) {
    if (clk.pendingBpm) { clk.bpm = clk.pendingBpm; clk.stepDur = 60 / clk.bpm / 4; clk.pendingBpm = 0; }
    var info = { bar: barIndex, time: time, bpm: clk.bpm, stepDur: clk.stepDur, beatDur: clk.stepDur * 4,
                 barDur: clk.stepDur * 16, phase: clk.plan[barIndex] || 'rest' };
    delete clk.plan[barIndex];
    for (var i = 0; i < clk.barCbs.length; i++) {
      try { var r = clk.barCbs[i](info); if (typeof r === 'string') info.phase = r; } catch (e) { reportErr(e); }
    }
    clk.bars.push(info);
    if (clk.bars.length > 16) clk.bars.shift();
    return info;
  }
  function reportErr(e) { try { setTimeout(function () { throw e; }, 0); } catch (e2) {} }

  function pump(horizon) {
    var nowT = ctx.currentTime;
    while (clk.running && clk.nextTime < horizon) {
      var s = clk.step % 16;
      if (s === 0) { clk.curBar = makeBar(clk.bar, clk.nextTime); clk.barTime = clk.nextTime; }
      var b = clk.curBar;
      var t = b.time + s * b.stepDur;                 // 마디 시작 기준으로 계산(누적 오차 없음)
      var si = { step: clk.step, bar: b.bar, stepInBar: s, beatInBar: s >> 2, sub: s & 3,
                 isBeat: (s & 3) === 0, isOffbeat8: (s & 3) === 2, time: t, stepDur: b.stepDur,
                 bpm: b.bpm, phase: b.phase, barTime: b.time, late: !offline && t < nowT - 0.01 };
      backing(si);
      for (var i = 0; i < clk.stepCbs.length; i++) { try { clk.stepCbs[i](si); } catch (e) { reportErr(e); } }
      clk.step++;
      if (clk.step % 16 === 0) clk.bar++;
      clk.nextTime = b.time + (s + 1) * b.stepDur;
    }
  }
  function tick() {
    clk.timer = null;
    if (!clk.running || !ctx) return;
    try { if (ctx.state === 'running') pump(ctx.currentTime + LOOKAHEAD); } catch (e) { reportErr(e); }
    if (clk.running && !offline) clk.timer = setTimeout(tick, TICK_MS);
  }

  // 지금 귀에 들리고 있는 오디오의 ctx 시간 (perfMs = performance.now() 기준 ms, 생략 시 지금)
  function heardAt(perfMs) {
    if (!ctx) return 0;
    var pnow = (window.performance && performance.now) ? performance.now() : Date.now();
    if (perfMs === undefined || !isFinite(perfMs) || Math.abs(perfMs - pnow) > 1000) perfMs = pnow;
    var cur = ctx.currentTime;
    try {
      if (ctx.state === 'running' && ctx.getOutputTimestamp) {
        var ts = ctx.getOutputTimestamp();
        if (ts && ts.performanceTime > 0 && ts.contextTime > 0) {
          var h = ts.contextTime + (perfMs - ts.performanceTime) / 1000;
          if (h <= cur + 0.05 && h > cur - 0.5) return h;
        }
      }
    } catch (e) {}
    return cur - ((ctx.outputLatency || 0) || (ctx.baseLatency || 0)) - (pnow - perfMs) / 1000;
  }

  function positionAt(t) {
    var b = null;
    for (var i = clk.bars.length - 1; i >= 0; i--) if (clk.bars[i].time <= t) { b = clk.bars[i]; break; }
    if (!b) b = clk.bars[0];
    if (!b) return null;
    var stepF = (t - b.time) / b.stepDur;
    return { bar: b.bar, phase: b.phase, bpm: b.bpm, barTime: b.time, stepDur: b.stepDur,
             stepF: stepF, beatF: stepF / 4, barF: b.bar + stepF / 16 };
  }

  var Beat = {
    // 박자 시계 시작. bpm, opts.delay(첫 마디까지 초, 기본 0.1), opts.phases({마디번호: phase})
    start: function (bpm, opts) {
      if (!ctx || !running()) return false;
      Beat.stop(true);
      opts = opts || {};
      clk.bpm = Math.max(40, Math.min(240, +bpm || 100)); clk.stepDur = 60 / clk.bpm / 4; clk.pendingBpm = 0;
      clk.step = 0; clk.bar = 0; clk.bars = []; clk.curBar = null;
      clk.plan = {};
      if (opts.phases) for (var k in opts.phases) clk.plan[k] = opts.phases[k];
      music.chordIdx = -1;
      clk.nextTime = ctx.currentTime + Math.max(0.05, opts.delay === undefined ? 0.1 : +opts.delay);
      clk.running = true;
      try { clockBus.gain.cancelScheduledValues(ctx.currentTime); clockBus.gain.setValueAtTime(1, ctx.currentTime); } catch (e) {}
      if (!offline) tick();
      return true;
    },
    // 정지. 이미 예약된(최대 ~0.12초) 반주·선생님 북은 40ms 페이드로 끊는다
    stop: function (keepSound) {
      clk.running = false;
      if (clk.timer) { clearTimeout(clk.timer); clk.timer = null; }
      if (!keepSound && ctx && clockBus) {
        try {
          var t = ctx.currentTime;
          clockBus.gain.cancelScheduledValues(t);
          clockBus.gain.setValueAtTime(clockBus.gain.value, t);
          clockBus.gain.linearRampToValueAtTime(0, t + 0.04);
          clockBus.gain.setValueAtTime(1, t + LOOKAHEAD + 0.1);
        } catch (e) {}
      }
    },
    isRunning: function () { return clk.running; },
    // 템포 변경: 다음 마디 첫 박부터 적용(마디 중간에 바뀌지 않음)
    setBpm: function (bpm) { bpm = +bpm; if (bpm >= 40 && bpm <= 240) { if (clk.running) clk.pendingBpm = bpm; else { clk.bpm = bpm; clk.stepDur = 60 / bpm / 4; } } },
    getBpm: function () { return clk.bpm; },
    // 특정 마디의 phase 예약: 'call' | 'response' | 'countin' | 'transition' | 'rest' | 'silent'
    planPhase: function (bar, phase) { clk.plan[bar] = phase; },
    // 콜백 등록. 반환값은 해제 함수. onBar 콜백이 문자열을 반환하면 그 마디의 phase가 된다
    onStep: function (fn) { clk.stepCbs.push(fn); return function () { var i = clk.stepCbs.indexOf(fn); if (i >= 0) clk.stepCbs.splice(i, 1); }; },
    onBar: function (fn) { clk.barCbs.push(fn); return function () { var i = clk.barCbs.indexOf(fn); if (i >= 0) clk.barCbs.splice(i, 1); }; },
    // 정확한 시각에 효과음 예약 (이미 지난 시각이면 즉시). 반환: 실제 예약 시각
    schedule: function (time, name, opts) {
      try {
        if (!ready() || !sfx[name]) return -1;
        var t = Math.max(+time || 0, ctx.currentTime);
        sfx[name](t, opts || {});
        return t;
      } catch (e) { return -1; }
    },
    // 한 마디 안의 스텝 목록으로 선생님 북 예약. barInfo = onBar/onStep의 info. 반환: 각 음의 ctx 시각 배열
    playPattern: function (barInfo, steps, name) {
      var out = [];
      if (!barInfo || !steps) return out;
      for (var i = 0; i < steps.length; i++) {
        var t = barInfo.time + steps[i] * barInfo.stepDur;
        out.push(t);
        Beat.schedule(t, name || 'teacher', { accent: steps[i] === 0 });
      }
      return out;
    },
    // 마디 시작 시각 (이미 예약된 마디는 정확, 미래 마디는 현재 템포로 추정)
    barTime: function (bar) {
      for (var i = clk.bars.length - 1; i >= 0; i--) if (clk.bars[i].bar === bar) return clk.bars[i].time;
      var lb = clk.bars[clk.bars.length - 1];
      if (!lb) return clk.nextTime;
      var sd = 60 / (clk.pendingBpm || clk.bpm) / 4;
      return lb.time + lb.barDur + (bar - lb.bar - 1) * 16 * sd;
    },
    ctxTime: function () { return ctx ? ctx.currentTime : 0; },
    // 지금 들리는 소리의 ctx 시각. 화면 연출(박자에 맞춰 까딱이기 등)은 rAF에서 이 값을 쓴다
    heardTime: function () { return heardAt(); },
    // 탭 판정용 시각: 이벤트(pointerdown/keydown)의 timeStamp를 '그때 들리던 소리'의 시각으로 바꾼 값.
    // 컴프레서 지연과 사용자 보정값을 이미 뺐으므로 info.time(예약 시각)과 바로 비교하면 된다.
    tapTime: function (evt) {
      if (!ctx) return 0;
      var ts = evt && typeof evt.timeStamp === 'number' && evt.timeStamp > 0 ? evt.timeStamp : undefined;
      return heardAt(ts) - COMP_DELAY - userOffset;
    },
    // 시각 → 박 위치 {bar, phase, stepF(마디 안 0~16), beatF(0~4), barF, bpm}. t 생략 시 heardTime
    now: function (t) { return positionAt(t === undefined ? heardAt() : t); },
    latency: function () {
      if (!ctx) return { base: 0, output: 0, comp: COMP_DELAY, offset: userOffset };
      return { base: ctx.baseLatency || 0, output: ctx.outputLatency || 0, comp: COMP_DELAY, offset: userOffset,
               hasOutputTimestamp: !!ctx.getOutputTimestamp, sampleRate: ctx.sampleRate };
    },
    // 사용자 보정(ms, −80~+400 정수, design.md). +면 '소리가 늦게 들림(블루투스 등)' → 탭 시각에서 뺀다. localStorage 저장
    setOffset: function (ms) { ms = Math.round(+ms || 0); if (ms < -80) ms = -80; if (ms > 400) ms = 400; userOffset = ms / 1000; try { localStorage.setItem(OFFSET_KEY, String(ms)); } catch (e) {} },
    getOffset: function () { return userOffset * 1000; },
    // 일시정지 버튼용: 오디오 시계 자체를 멈춘다(박자·예약음이 그대로 얼어붙고 resume 시 이어짐)
    pause: function () { userPaused = true; if (ctx) try { var p = ctx.suspend(); if (p && p.catch) p.catch(function () {}); } catch (e) {} },
    resume: function () { userPaused = false; if (ctx) try { var p = ctx.resume(); if (p && p.catch) p.catch(function () {}); } catch (e) {} },
    isPaused: function () { return userPaused; },
    // 반주 옵션: { hat16: true } → 16분 엇박에 아주 작은 하이햇 (16분 패턴이 나오는 단계용)
    setBacking: function (o) { if (o && 'hat16' in o) music.hat16 = !!o.hat16; }
  };

  // ---------- 탭 전환 ----------
  try {
    document.addEventListener('visibilitychange', function () {
      if (!ctx || offline) return;
      try {
        if (document.hidden) { var p1 = ctx.suspend(); if (p1 && p1.catch) p1.catch(function () {}); }
        else if (!userPaused) { var p2 = ctx.resume(); if (p2 && p2.catch) p2.catch(function () {}); }
      } catch (e) {}
    });
  } catch (e) {}

  return {
    // 사용자 제스처(pointerdown/touchend/click/keydown) 안에서 호출. 여러 번 호출해도 안전
    unlock: function () {
      if (!ensureCtx() || offline) return;
      try {
        if (ctx.state !== 'running' && !userPaused) { var p = ctx.resume(); if (p && p.catch) p.catch(function () {}); }
        var b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource();   // iOS 무음 버퍼
        s.buffer = b; s.connect(ctx.destination); s.start(0);
        if (!warmed) {                                                          // 첫 탭 소리 초기화 지연 제거
          warmed = true;
          var o = ctx.createOscillator(), g = ctx.createGain();
          g.gain.value = 0; o.connect(g); g.connect(tapBus); o.start(); o.stop(ctx.currentTime + 0.05);
        }
      } catch (e) {}
    },
    // 즉시 재생. name: teacher|tap|perfect|good|miss|extra(=stray)|heartGain|newBest|phraseClear|combo|levelUp|heartLost|gameOver|clear|count|start|button|pause|resume
    play: function (name, opts) {
      try { if (ready() && sfx[name]) sfx[name](ctx.currentTime, opts || {}); } catch (e) {}
    },
    setMuted: function (m) {
      muted = !!m;
      try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
      try { if (master) { var t = ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setTargetAtTime(muted ? 0 : MASTER_VOL * volume, t, 0.02); } } catch (e) {}
    },
    isMuted: function () { return muted; },
    setVolume: function (v) {
      v = +v; if (!(v >= 0)) v = 0; if (v > 1) v = 1; volume = v;
      try { if (master && !muted) { var t = ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setTargetAtTime(MASTER_VOL * volume, t, 0.02); } } catch (e) {}
    },
    getVolume: function () { return volume; },
    // 반주 켜기. 시계가 멈춰 있으면 opts.bpm(기본 현재 bpm)으로 시계도 시작
    startMusic: function (opts) {
      if (music.fadeTimer) { clearTimeout(music.fadeTimer); music.fadeTimer = null; }
      try { if (musicBus) { musicBus.gain.cancelScheduledValues(ctx.currentTime); musicBus.gain.setValueAtTime(MUSIC_VOL, ctx.currentTime); } } catch (e) {}
      music.on = true;
      if (!clk.running && ctx) Beat.start((opts && opts.bpm) || clk.bpm, opts);

    if (G.phase === 'play') {
      if (k === 'p' || k === 'P' || k === 'Escape') { e.preventDefault(); if (!e.repeat) pauseGame(false); return; }
      if (/^F\d+$/.test(k)) return;
      e.preventDefault();
      if (onBtn) try { e.target.blur(); } catch (er) {}
      if (!e.repeat) inputTap(e);
      return;
    }
    if (G.phase === 'calibrate') {
      if (k === 'Escape') { e.preventDefault(); closeCal(); return; }
      if (CAL.done) return;
      e.preventDefault();
      if (!e.repeat) calTap(e);
      return;
    }
    if (G.phase === 'paused') {
      if ((k === 'p' || k === 'P' || k === 'Escape' || ((k === 'Enter' || k === ' ') && !onBtn)) && !e.repeat) { e.preventDefault(); resumeGame(); }
      return;
    }
    if (G.phase === 'menu') {
      if ((k === 'Enter' || k === ' ') && !onBtn && !e.repeat) { e.preventDefault(); startGame(1); }
      return;
    }
    if (G.phase === 'result' || G.phase === 'over') {
      if (G.phase === 'over' || performance.now() < G.resultLockUntil) { e.preventDefault(); return; }
      if ((k === 'Enter' || k === ' ') && !onBtn && !e.repeat) { e.preventDefault(); startGame(1); }
    }
  });
  document.addEventListener('keyup', function (e) {
    if ((G.phase === 'play' || G.phase === 'calibrate' || G.phase === 'over' || (G.phase === 'result' && performance.now() < G.resultLockUntil)) && (e.key === ' ' || e.key === 'Enter')) e.preventDefault();
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) return;
    if (G.phase === 'play') pauseGame(true);
    else if (G.phase === 'calibrate' && CAL.started && !CAL.done) { Beat.stop(); openCal(); }
  });
  window.addEventListener('pagehide', function () { if (G.phase === 'play') pauseGame(true); });

  // 버튼
  el.startBtn.addEventListener('click', function () { startGame(1); });
  el.resumeBtn.addEventListener('click', resumeGame);
  el.restartBtn.addEventListener('click', function () { startGame(G.startStage || 1); });
  el.againBtn.addEventListener('click', function () { if (el.againBtn.disabled || performance.now() < G.resultLockUntil) return; startGame(1); });
  el.menuBtn.addEventListener('click', function () { if (el.menuBtn.disabled || performance.now() < G.resultLockUntil) return; Sound.play('button'); toMenu(); });
  el.pauseBtn.addEventListener('click', function () {
    Sound.unlock();
    if (G.phase === 'play') pauseGame(false); else if (G.phase === 'paused') resumeGame();
  });
  function syncMute() {
    var m = Sound.isMuted();
    el.icoOn.toggleAttribute('hidden', m);
    el.icoOff.toggleAttribute('hidden', !m);
    el.muteBtn.setAttribute('aria-pressed', m ? 'true' : 'false');
    el.muteBtn.setAttribute('aria-label', m ? '소리 켜기' : '소리 끄기');
  }
  function toggleMute() { Sound.unlock(); Sound.setMuted(!Sound.isMuted()); syncMute(); }
  el.muteBtn.addEventListener('click', toggleMute);

  // ---------- 레이아웃 (높이 기준) ----------
  function px(v) { return parseFloat(v) || 0; }
  function place(node, x, y, w, h) { node.style.left = x + 'px'; node.style.top = y + 'px'; node.style.width = w + 'px'; node.style.height = h + 'px'; }
  function sizeCanvas(c, w, h) {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.w = w; c.h = h; c.dpr = dpr;
    var W = Math.round(w * dpr), H = Math.round(h * dpr);
    if (c.cv.width !== W) c.cv.width = W;
    if (c.cv.height !== H) c.cv.height = H;
  }
  function layout() {
    var vw = window.innerWidth, vh = window.innerHeight;
    document.documentElement.style.setProperty('--app-h', vh + 'px');
    var bs = getComputedStyle(document.body);
    var W = vw - px(bs.paddingLeft) - px(bs.paddingRight), H = vh - px(bs.paddingTop) - px(bs.paddingBottom);
    var TB = H <= 520 ? 44 : 52, SW = Math.min(W, 980), SH = Math.max(120, H - TB - 8);
    var land = vw >= vh, A, S, L, rootS = document.documentElement.style;
    rootS.setProperty('--tb', TB + 'px'); rootS.setProperty('--sw', SW + 'px'); rootS.setProperty('--sh', SH + 'px');
    var tBox = el.tBox, mBox = el.mBox, cpw = 76, cph = 30;
    if (land) {
      var R = Math.floor((SH - 8) / 2);
      A = clamp(Math.round(R * 0.78), 64, 220); S = clamp(Math.round(R * 0.5), 56, 132); L = SW - A - 16;
      var top0 = Math.max(0, Math.floor((SH - (2 * R + 8)) / 2));
      place(tBox, 0, top0 + (R - A) / 2, A, A);
      place(el.tlT, A + 16, top0 + (R - S) / 2, L, S);
      place(mBox, 0, top0 + R + 8 + (R - A) / 2, A, A);
      place(el.tlMe, A + 16, top0 + R + 8 + (R - S) / 2, L, S);
      var cy = Math.min(top0 + R + 8 + (R - A) / 2 + A - cph / 2, SH - cph);
      el.comboPill.style.left = Math.max(0, A - cpw + 10) + 'px'; el.comboPill.style.top = cy + 'px';
    } else {
      S = clamp(Math.round(W * 0.16), 56, 120); L = Math.min(W, 760);
      var B = Math.floor((SH - 2 * S - 8 - 16) / 2);
      A = clamp(Math.min(Math.round(B * 0.75), Math.round(W * 0.5)), 64, 200);
      A = Math.min(A, Math.max(40, B));
      var lx = (SW - L) / 2;
      place(tBox, (SW - A) / 2, Math.max(0, (B - A) / 2), A, A);
      place(el.tlT, lx, B + 8, L, S);
      place(el.tlMe, lx, B + 8 + S + 8, L, S);
      var mTop = B + 8 + 2 * S + 16;
      place(mBox, (SW - A) / 2, mTop + Math.max(0, (B - A) / 2), A, A);
      var cx = (SW + A) / 2 + 16;
      if (cx + cpw > SW) cx = SW - cpw;
      el.comboPill.style.left = cx + 'px'; el.comboPill.style.top = (mTop + B / 2 - cph / 2) + 'px';
    }
    sizeCanvas(CV.t, L, S); sizeCanvas(CV.m, L, S);
    document.body.classList.toggle('ov-full', SH < 460 || SW < 600);
    document.body.classList.toggle('tb-760', SW < 760);
    document.body.classList.toggle('tb-640', SW < 640);
    document.body.classList.toggle('tb-420', SW < 420);
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', layout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
  try {
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readPalette);
    new MutationObserver(readPalette).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  } catch (e) {}

  // ---------- 테스트 훅 (QA 전용) ----------
  // HUD(onEnterBar)와 같은 규칙: 카운트인·부르기·전환 마디에 들어서는 순간 그 마디의 단계
  function hudStageAt(spec) {
    if (G.phase === 'play' && spec && (spec.phase === 'transition' || spec.phase === 'countin' || spec.phase === 'call')) return spec.stage;
    return G.hud.stage;
  }
  function copyState() {
    var g = G.g, now = clockNow();
    var ph = G.phase;
    if (ph === 'play') { var hs = heardSpec(now); ph = hs ? (hs.phase === 'rest' ? 'transition' : hs.phase) : 'countin'; }
    var next = [];
    if (g) G.rounds.forEach(function (rd) { if (!rd.invalid && !rd.finalized) rd.notes.forEach(function (n) { if (!n.j) next.push(n.t); }); });
    next.sort(function (a, b) { return a - b; });
    var hs2 = G.g ? heardSpec(now) : null, rdc = hs2 && hs2.rd;
    return {
      phase: ph, stage: g ? hudStageAt(hs2) : 0, round: hs2 ? hs2.round : -1, bpm: hs2 ? hs2.bpm : (g ? bpmOf(G.hud.stage) : Beat.getBpm()), hearts: g ? g.hearts : 0, score: g ? g.score : 0,
      combo: g ? g.combo : 0, maxCombo: g ? g.maxCombo : 0, counts: g ? Object.assign({}, g.counts) : { perfect: 0, good: 0, miss: 0, stray: 0 },
      pattern: rdc ? rdc.pattern : '', nextNotes: next, latency: { auto: (Beat.latency().output || Beat.latency().base || 0), offset: Beat.getOffset() },
      audioTime: now, ctxTime: Beat.ctxTime(), cleared: g ? g.cleared : false, stageReached: g ? g.stageReached : 0, lastJudge: G.lastJudge,
      windows: { perfect: Rules.CFG.perfect * 1000, good: Rules.CFG.good * 1000 }
    };
  }
  window.__parrot = {
    state: copyState,
    start: function (o) { o = o || {}; startGame(o.stage || 1, o.seed); return copyState(); },
    setStage: function (n) { n = clamp(n | 0, 1, MAXS); if (G.phase === 'play') G.pendingStage = n; },
    setHearts: function (n) { if (G.g) { G.g.hearts = clamp(n | 0, 1, 3); syncHUD(true); } },
    setOffset: function (ms) { Beat.setOffset(ms); return Beat.getOffset(); },
    tapAt: function (t) { return doTap(+t, null); },
    autoPlay: function (o) { G.auto = o ? { sigma: +o.sigma || 0, bias: +o.bias || 0, rand: Rules.rng(o.seed === undefined ? 7 : o.seed) } : null; },
    simulateRun: function (o) { return Rules.simulateRun(o || {}); },
    patterns: function () { return Rules.POOLS.map(function (p) { return p.slice(); }); },
    pause: function () { pauseGame(false); return copyState(); },
    resume: function () { resumeGame(); return copyState(); }
  };

  // ---------- 시작 ----------
  readPalette();
  layout();
  syncMute();
  renderBest();
  syncHUD(true);
  show(el.ovStart, true);
  var fontReady = (document.fonts && document.fonts.load) ? document.fonts.load('800 20px BeatDigits').catch(function () {}) : Promise.resolve();
  Promise.race([fontReady, new Promise(function (r) { setTimeout(r, 600); })]).then(function () { requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
