<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>폭식 불곰을 찾아라</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="폭식 불곰">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e4572e">
<style>
  /* 숫자 전용 글꼴: Pretendard ExtraBold(SIL OFL 1.1)의 숫자·기호 서브셋. 수정본이라 내부 이름은 BearDigits. 라이선스 fonts/OFL.txt */
  @font-face { font-family: "BearDigits"; src: url("fonts/bear-digits-800.woff2") format("woff2");
    font-weight: 800; font-style: normal; font-display: swap; unicode-range: U+002B-002F, U+0030-0039, U+00D7; }
  :root {
    --app-h: 100vh;
    --app-h: 100dvh;
    --num-font: "BearDigits", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    --bg: #f4f1ea; --panel: #ffffff; --ink: #1f2430; --muted: #6b7280; --grid: #e7e2d8; --well: #fbfaf7;
    --accent: #e4572e; --gold: #f2b134; --good: #5f9b6c; --good-ink: #3f7a4f; --danger: #d64545; --loss-ink: #b2452f;
    --shadow: rgba(40,50,70,.14);
    --sky: #e8ebe4; --ridge: #d3dacb; --pine: #b3c0a8; --bank: #ddd0b6; --bank-edge: #c9b998; --grass: #a9b88f;
    --river: #a7c0c4; --river-deep: #93b0b6; --ripple: #e9f1f1; --stone: #c4c0b6;
    --line: #3a2318; --fur: #9c5a32; --fur-dark: #7c4325; --muzzle: #f0d9b0; --inner-ear: #e5b088; --nose: #2b1a14;
    --eye-y: #ffcc33; --eye: #1e1410; --mouth-in: #5e2420; --tongue: #d9776a; --tooth: #fffaf0; --flame-o: #f2622a; --flame-y: #ffc533;
    --b1: #6f9a8c; --b2: #c58a3c; --b3: #7d83b8; --b1-ink: #3d6b5d; --b2-ink: #87561a; --b3-ink: #555b94;
    --stripe: rgba(255,255,255,.55); --dot: rgba(255,255,255,.6);
    --salmon: #ef8a5f; --salmon-back: #b4553f; --salmon-belly: #fbd9c2;
    --yum-bg: #fff1d6; --yum-edge: #e8862a; --yum-ink: #7a3510;
    --miss-bg: #e3ebf2; --miss-edge: #5f7f9c; --miss-ink: #2c4660; --miss-drop: #9fcbee;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141a; --panel: #1b1e27; --ink: #eceef3; --muted: #9aa1ae; --grid: #262a35; --well: #161921;
      --accent: #ff7a50; --gold: #ffc94d; --good: #85c493; --good-ink: #8fd09d; --danger: #ff6b6b; --loss-ink: #f39a84;
      --shadow: rgba(0,0,0,.35);
      --sky: #171c22; --ridge: #1f272a; --pine: #26322e; --bank: #2a2722; --bank-edge: #36302a; --grass: #3b4634;
      --river: #22333a; --river-deep: #1c2a30; --ripple: #4a6168; --stone: #3a3d42;
      --line: #140d0a; --fur: #925c3c; --fur-dark: #6e4329; --muzzle: #cdb38c; --inner-ear: #b58763; --nose: #140d0a;
      --eye-y: #f5c042; --eye: #120c09; --mouth-in: #4a1d1a; --tongue: #b2625a; --tooth: #efe7d8; --flame-o: #ff7240; --flame-y: #ffd35c;
      --b1: #8fbcae; --b2: #e2ae62; --b3: #a3a8dc; --b1-ink: #9fd0c0; --b2-ink: #ecc07c; --b3-ink: #b8bce6;
      --stripe: rgba(255,255,255,.4); --dot: rgba(255,255,255,.45);
      --salmon: #e98b62; --salmon-back: #a85743; --salmon-belly: #efc4aa;
      --yum-bg: #3a2a16; --yum-edge: #ffa04d; --yum-ink: #ffd9a8;
      --miss-bg: #1f2a35; --miss-edge: #8fb0cf; --miss-ink: #cfe1f2; --miss-drop: #6fa3cf;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12141a; --panel: #1b1e27; --ink: #eceef3; --muted: #9aa1ae; --grid: #262a35; --well: #161921;
    --accent: #ff7a50; --gold: #ffc94d; --good: #85c493; --good-ink: #8fd09d; --danger: #ff6b6b; --loss-ink: #f39a84;
    --shadow: rgba(0,0,0,.35);
    --sky: #171c22; --ridge: #1f272a; --pine: #26322e; --bank: #2a2722; --bank-edge: #36302a; --grass: #3b4634;
    --river: #22333a; --river-deep: #1c2a30; --ripple: #4a6168; --stone: #3a3d42;
    --line: #140d0a; --fur: #925c3c; --fur-dark: #6e4329; --muzzle: #cdb38c; --inner-ear: #b58763; --nose: #140d0a;
    --eye-y: #f5c042; --eye: #120c09; --mouth-in: #4a1d1a; --tongue: #b2625a; --tooth: #efe7d8; --flame-o: #ff7240; --flame-y: #ffd35c;
    --b1: #8fbcae; --b2: #e2ae62; --b3: #a3a8dc; --b1-ink: #9fd0c0; --b2-ink: #ecc07c; --b3-ink: #b8bce6;
    --stripe: rgba(255,255,255,.4); --dot: rgba(255,255,255,.45);
    --salmon: #e98b62; --salmon-back: #a85743; --salmon-belly: #efc4aa;
      --yum-bg: #3a2a16; --yum-edge: #ffa04d; --yum-ink: #ffd9a8;
      --miss-bg: #1f2a35; --miss-edge: #8fb0cf; --miss-ink: #cfe1f2; --miss-drop: #6fa3cf;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: var(--app-h); overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  body.low { padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  .num { font-family: var(--num-font); font-weight: 800; font-variant-numeric: tabular-nums; }
  svg [hidden] { display: none; }
  /* .app·.stage와 조상에는 transform/filter 금지 (ov-full의 position:fixed가 깨짐) */
  .app { display: flex; flex-direction: column; align-items: center; gap: var(--g, 8px); width: 100%; touch-action: none; }

  /* 상단 바 (parrot-beat와 같은 구조) */
  .top {
    flex: none; height: var(--tb, 52px); width: var(--sw, 600px);
    display: flex; align-items: center; gap: 8px;
  }
  .home {
    flex: none; min-height: 44px; display: inline-flex; align-items: center; padding: 0 8px; margin-left: -8px;
    color: var(--muted); font-size: 14px; text-decoration: none; border-radius: 8px; white-space: nowrap;
  }
  .home:hover, .home:focus-visible { color: var(--ink); }
  .home .short { display: none; }
  .home:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .title { margin: 0; font-size: 18px; font-weight: 800; white-space: nowrap; }
  .spacer { flex: 1; min-width: 0; }
  .lvpill {
    flex: none; height: 44px; padding: 0 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--grid);
    display: inline-flex; align-items: center; gap: 6px; transition: border-color 600ms ease-out;
  }
  .lvpill.up { border-color: var(--accent); transition-duration: 0ms; }
  .lvpill .lt { font-size: 13px; font-weight: 700; color: var(--muted); }
  .lvpill .ln { font-size: 18px; min-width: 1.2ch; text-align: center; }
  .spd { width: 40px; height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
  .spd i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 600ms ease-out; }
  .lvpill .sx { font-size: 13px; color: var(--muted); }
  .scorev { flex: none; display: inline-flex; align-items: baseline; gap: 4px; }
  .scorev small { font-size: 12px; font-weight: 700; color: var(--muted); }
  .scorev b { font-size: 20px; min-width: 1.4ch; text-align: right; }
  .hearts { flex: none; display: inline-flex; gap: 2px; }
  .hearts svg { width: 20px; height: 20px; display: block; fill: var(--danger); stroke: var(--danger); stroke-width: 1.6; transition: fill 200ms ease-out, stroke 200ms ease-out; }
  .hearts svg.lost { fill: none; stroke: var(--muted); }
  .btns { display: flex; gap: 6px; flex: none; }

  button {
    font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--grid);
    border-radius: 10px; cursor: pointer; touch-action: manipulation;
    transition: transform 80ms ease-out, background-color 80ms ease-out;
  }
  button:active { transform: scale(.94); background: var(--grid); }
  button:disabled { opacity: .5; cursor: default; }
  button.icon { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; font-size: 18px; color: var(--ink); }
  button.icon svg { width: 20px; height: 20px; }
  button.icon svg[hidden] { display: none; }
  button.primary {
    background: var(--accent); color: #fff; border-color: transparent; font-weight: 700;
    height: 48px; padding: 0 24px; font-size: 18px; flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  button.primary:active { background: var(--accent); filter: brightness(.92); }
  button.primary svg, button.secondary svg { width: 20px; height: 20px; flex: none; }
  button.secondary, a.secondary {
    height: 44px; padding: 0 18px; font-size: 15px; background: var(--panel); color: var(--ink);
    border: 1px solid var(--grid); border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; flex: none;
  }
  button.secondary[aria-pressed="true"] { border: 2px solid var(--accent); color: var(--ink); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
  .kbd { display: none; font-size: 12px; color: var(--muted); border: 1px solid var(--grid); border-radius: 6px; padding: 1px 6px; background: var(--panel); }
  @media (hover: hover) and (pointer: fine) { .kbd { display: inline-block; } }

  /* 안내 띠 */
  .cue {
    flex: none; width: var(--sw, 600px); height: var(--cb, 44px); position: relative;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 16px; font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden;
  }
  body.low .cue { font-size: 14px; }
  .cue .ci { display: inline-flex; align-items: center; gap: 8px; animation: cueIn 160ms ease-out; }
  @keyframes cueIn { from { opacity: 0; } }
  .cue .ci svg { width: 18px; height: 18px; flex: none; }
  .cue .big { font-size: 18px; font-weight: 800; }
  body.low .cue .big { font-size: 16px; }
  .cue .dots { display: inline-flex; gap: 6px; }
  .cue .dots i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--muted); }
  .cue .dots i.on { background: var(--accent); border-color: var(--accent); }
  .cue .prog { width: var(--pw, 200px); height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; flex: none; }
  .cue .prog i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: 0 50%; }
  .cue .keys { display: none; gap: 4px; }
  @media (hover: hover) and (pointer: fine) { .cue .keys { display: inline-flex; } }
  .cue .keys b { width: 24px; height: 24px; border-radius: 6px; background: var(--panel); border: 1px solid var(--grid); display: grid; place-items: center; font-size: 13px; }
  .cue .ok { color: var(--good-ink); }
  .cue .ok svg { stroke: var(--good); }
  .cue .no { color: var(--loss-ink); }
  .cue .no svg { stroke: var(--danger); }
  .cue .mut { color: var(--muted); font-weight: 700; }
  .cue .bn1 { color: var(--b1-ink); } .cue .bn2 { color: var(--b2-ink); } .cue .bn3 { color: var(--b3-ink); }

  /* 무대 */
  .stage { position: relative; flex: none; width: var(--sw, 600px); height: var(--sh, 400px); border-radius: 14px; overflow: hidden; background: var(--sky); }
  svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene .sky { fill: var(--sky); } .scene .ridge { fill: var(--ridge); } .scene .pine { fill: var(--pine); }
  .scene .bank { fill: var(--bank); } .scene .bankedge { fill: var(--bank-edge); } .scene .river { fill: var(--river); }
  .scene .wave { fill: none; stroke: var(--river-deep); stroke-width: 5; stroke-linecap: round; animation: wave 6000ms ease-in-out infinite; }
  .scene .wave.w2 { animation-delay: -2000ms; } .scene .wave.w3 { animation-delay: -4000ms; }
  @keyframes wave { 50% { transform: translateX(6px); } }
  .scene .grass { fill: none; stroke: var(--grass); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .scene .stone { fill: var(--stone); }
  .f-fur { fill: var(--fur); } .f-furd { fill: var(--fur-dark); } .f-muz { fill: var(--muzzle); } .f-ear { fill: var(--inner-ear); }
  .f-nose { fill: var(--nose); } .f-eye { fill: var(--eye); } .f-eyey { fill: var(--eye-y); } .f-line { fill: var(--line); } .f-hl { fill: #fff; opacity: .5; }
  .f-mi { fill: var(--mouth-in); } .f-tg { fill: var(--tongue); } .f-tooth { fill: var(--tooth); } .f-fo { fill: var(--flame-o); } .f-fy { fill: var(--flame-y); }
  .f-drop { fill: var(--miss-drop); } .f-sh { fill: var(--shadow); }
  /* v2 굵은 외곽선 */
  .o, .o3, .ol { stroke: var(--line); stroke-linejoin: round; stroke-linecap: round; }
  .o { stroke-width: 5; } .o3 { stroke-width: 3.5; }
  .s-none { fill: none; }
  .s-brow { fill: none; stroke: var(--line); stroke-width: 6; stroke-linecap: round; }
  .s-teeth { fill: none; stroke: var(--line); stroke-width: 1.6; }
  .s-spark { fill: none; stroke: var(--miss-edge); stroke-width: 4; stroke-linecap: round; }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; }
  .scene .flame { animation: flame 900ms ease-in-out infinite; }
  @keyframes flame { 0%, 100% { transform: scale(1, 1) skewX(0deg); } 33% { transform: scale(.96, 1.06) skewX(-3deg); } 66% { transform: scale(1.03, .97) skewX(2deg); } }
  .f-panel { fill: var(--panel); }
  .b0 { --bc: var(--b1); --bci: var(--b1-ink); } .b1 { --bc: var(--b2); --bci: var(--b2-ink); } .b2 { --bc: var(--b3); --bci: var(--b3-ink); }
  .scarf { fill: var(--bc); } .scarf-t { fill: none; stroke: var(--bc); stroke-width: 3; stroke-linecap: round; }
  .stripe { fill: none; stroke: var(--stripe); stroke-width: 4; } .sdot { fill: var(--dot); }
  .badge-c { fill: var(--panel); stroke: var(--bc); stroke-width: 3.5; }
  .badge-num { font-family: var(--num-font); font-weight: 800; font-size: 22px; fill: var(--bci); text-anchor: middle; dominant-baseline: central; }
  .eye { transform-box: fill-box; transform-origin: center; transition: transform 60ms ease-in-out; }
  .bear.blink .eye { transform: scaleY(.1); }
  .bear .lift { transition: transform 120ms ease-out; }
  .bear .breath { transform-origin: 110px 252px; }
  .scene.breathing .bear .breath { animation: breathe 3000ms ease-in-out infinite; }
  .scene.breathing .bear.b1 .breath { animation-delay: -1000ms; }
  .scene.breathing .bear.b2 .breath { animation-delay: -2000ms; }
  @keyframes breathe { 50% { transform: scaleY(1.015); } }
  .scene.choosing .bear .breath { animation: bob 1200ms ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  .bear.hov .lift { transform: translateY(-4px); }
  .bear.shake .lift { animation: shake 240ms ease-in-out; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .ring { fill: none; stroke: var(--bc); stroke-width: 3; opacity: 0; transition: opacity 160ms ease-out; }
  .bear.rs .ring { opacity: .5; }
  .bear.foc .ring, .bear.hov .ring { opacity: 1; stroke-width: 4; }
  .bear.foc .ring { stroke: var(--accent); }
  .bear.sel .ring { opacity: 1; stroke: var(--accent); stroke-width: 4; }
  .bear.ok .ring { opacity: 1; stroke: var(--good); stroke-width: 4; stroke-dasharray: none; }
  .bear.bad .ring { opacity: 1; stroke: var(--danger); stroke-width: 4; stroke-dasharray: 8 6; }
  .yum .ys { fill: var(--yum-bg); stroke: var(--yum-edge); stroke-width: 3.5; stroke-linejoin: round; }
  .yum .yd { fill: var(--yum-bg); stroke: var(--yum-edge); stroke-width: 2.5; }
  .yum text, .miss text { text-anchor: middle; dominant-baseline: central; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  .yum text { font-size: 26px; font-weight: 900; fill: var(--yum-ink); }
  .miss rect { fill: var(--miss-bg); stroke: var(--miss-edge); stroke-width: 3; stroke-dasharray: 7 5; }
  .miss text { font-size: 22px; font-weight: 800; fill: var(--miss-ink); }
  .rip { fill: none; stroke: var(--ripple); stroke-width: 3; }
  .drop { fill: var(--ripple); }
  .col { stroke: var(--ripple); stroke-width: 3; stroke-linecap: round; fill: none; }
  .sal-back { fill: var(--salmon-back); } .sal-body { fill: var(--salmon); } .sal-belly { fill: var(--salmon-belly); }
  .sal-back, .sal-body, .sal-eyew { stroke: var(--line); stroke-linejoin: round; stroke-linecap: round; }
  .sal-eyew { fill: var(--tooth); } .sal-dot { fill: var(--salmon-back); } .sal-pup { fill: var(--line); } .sal-gill { fill: none; stroke: var(--line); stroke-width: 1.6; stroke-linecap: round; }

  /* 곰 선택 버튼 (열 전체 투명) */
  .pick { position: absolute; background: transparent; border: 0; border-radius: 12px; padding: 0; margin: 0; z-index: 2; cursor: pointer; }
  .pick:active { transform: none; background: transparent; }
  .pick:focus-visible { outline: none; }
  .pick[aria-disabled="true"] { cursor: default; pointer-events: none; }

  /* 판정 꼬리표 */
  .mark { position: absolute; z-index: 3; display: flex; gap: 4px; transform: translate(-50%, -50%); pointer-events: none; white-space: nowrap; }
  .mark[hidden] { display: none; }
  .tag { height: 26px; border-radius: 13px; padding: 0 10px 0 6px; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: #fff; animation: pop 200ms cubic-bezier(.3,1.4,.5,1); }
  .tag svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .tag.t-ok { background: var(--good); color: #10301a; } .tag.t-ok svg { stroke: #10301a; }
  .tag.t-no { background: var(--danger); color: #fff; }
  .tag.t-me { background: var(--accent); color: #fff; padding: 0 10px; }
  :root[data-theme="dark"] .tag.t-me, :root[data-theme="dark"] .tag.t-no { color: #1b1e27; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }

  /* 다시보기 카운터 칩 (머리 위) */
  .chip { position: absolute; z-index: 3; transform: translate(-50%, -50%); min-width: 40px; height: 32px; padding: 0 10px; border-radius: 16px;
    background: var(--panel); border: 2px solid var(--bc); display: inline-flex; align-items: center; justify-content: center; gap: 4px; pointer-events: none; }
  .chip[hidden] { display: none; }
  .chip .cn { font-size: 18px; color: var(--bci); }
  .chip .ch { font-size: 13px; font-weight: 800; color: var(--miss-ink); }
  .chip .ch[hidden] { display: none; }

  /* 해설 (강 위) */
  .explain { position: absolute; z-index: 2; display: flex; flex-direction: column; gap: 6px; pointer-events: none; transition: opacity 200ms ease-out; }
  .explain[hidden] { display: none; }
  .explain.replaying .panels { opacity: .3; }
  .panels { flex: 0 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); transition: opacity 200ms ease-out; }
  .pan { margin: 0 6px; min-height: 0; overflow: hidden; border-radius: 12px; background: color-mix(in srgb, var(--panel) 82%, transparent);
    border-top: 3px solid var(--bc); padding: 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    animation: panIn 200ms ease-out; box-shadow: 0 0 0 0 transparent; transition: box-shadow 180ms ease-out; }
  @keyframes panIn { from { transform: translateY(12px); opacity: 0; } }
  .pan.most { box-shadow: inset 0 0 0 2px var(--good); }
  .pv { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; justify-content: center; }
  .pv .pn { font-size: var(--pnf, 40px); line-height: 1; color: var(--bci); display: inline-block; }
  .pv .pn.bump { animation: bump 120ms ease-out; }
  @keyframes bump { 50% { transform: scale(1.12); } }

  .explain.ex-s .minis { display: none; }

  .explain.ex-s .pv .pu { font-size: 11px; }
  .explain.ex-s { gap: 3px; }
  .explain.ex-s .tline { padding: 2px 6px; gap: 1px; }
  /* 타임라인 */
  .tline { flex: none; display: flex; flex-direction: column; gap: 3px; padding: 4px 8px; border-radius: 10px; background: color-mix(in srgb, var(--panel) 88%, transparent); }
  .trow { display: flex; align-items: center; gap: 6px; height: var(--trh, 14px); }
  .tbadge { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--bc); background: var(--panel); color: var(--bci); font-size: 11px; display: grid; place-items: center; }
  .ttrack { position: relative; flex: 1; height: 100%; }
  .ttrack::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: var(--grid); }
  .tev { position: absolute; top: 50%; transform: translate(-50%, -50%); display: block; }
  .tev.r { width: 20px; height: 10px; }
  .tev.r svg { width: 100%; height: 100%; display: block; }
  .tev.f { width: 12px; height: 12px; border-radius: 50%; border: 1.6px dashed var(--miss-edge); background: var(--panel); }
  .tev.f::before, .tev.f::after { content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 1.6px; background: var(--danger); margin: -0.8px 0 0 -3.5px; transform: rotate(45deg); }
  .tev.f::after { transform: rotate(-45deg); }
  .ttot { flex: none; min-width: 2ch; text-align: right; font-size: 14px; color: var(--bci); }
  .tp { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
  .tp[hidden] { display: none; }
  .tline.small .trow { height: 10px; }
  .tline.small .tbadge { width: 14px; height: 14px; font-size: 9px; border-width: 1.5px; }
  .tline.small .tev.r { width: 14px; height: 7px; }
  .tline.small .tev.f { width: 8px; height: 8px; }
  .tline.small .tev.f::before, .tline.small .tev.f::after { width: 5px; margin-left: -2.5px; }
  .tline.small .ttot { font-size: 11px; }

  /* 배너 (보고 배우기) */
  .banner { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); z-index: 5; max-width: min(92%, 520px);
    background: var(--panel); border: 1px solid var(--grid); border-radius: 16px; padding: 14px 18px; text-align: center;
    box-shadow: 0 6px 20px var(--shadow); display: flex; flex-direction: column; gap: 10px; align-items: center; animation: ovUp 200ms ease-out; }
  .banner[hidden] { display: none; }
  .banner .bt { font-size: 18px; font-weight: 800; word-break: keep-all; }
  .banner .demo { display: flex; gap: 12px; justify-content: center; }
  .banner .demo figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; }
  .banner .demo svg { width: 120px; height: 96px; border-radius: 10px; background: var(--sky); }
  .banner .demo .no { color: var(--loss-ink); } .banner .demo .yes { color: var(--good-ink); }
  /* 6레벨 시연 (2000ms 반복). 연어 머리는 진행 방향 */
  .dm-real { animation: dmReal 2000ms linear infinite; }
  @keyframes dmReal { 0% { transform: translate(24px, 86px) scale(1); opacity: 1; } 38% { transform: translate(60px, 50px) scale(1); opacity: 1; }
    44% { transform: translate(60px, 55px) scale(.25); opacity: 0; } 100% { transform: translate(60px, 55px) scale(.25); opacity: 0; } }
  .dm-fake { animation: dmFake 2000ms linear infinite; }
  @keyframes dmFake { 0% { transform: translate(24px, 86px) rotate(0deg); opacity: 1; } 38% { transform: translate(60px, 46px) rotate(0deg); opacity: 1; }
    54% { transform: translate(78px, 12px) rotate(200deg); opacity: 1; } 72% { transform: translate(98px, 80px) rotate(470deg); opacity: 1; }
    76%, 100% { transform: translate(100px, 86px) rotate(500deg); opacity: 0; } }
  .dm-yum { opacity: 0; animation: dmYum 2000ms linear infinite; }
  @keyframes dmYum { 0%, 38% { opacity: 0; } 41%, 62% { opacity: 1; } 67%, 100% { opacity: 0; } }
  .dm-miss { opacity: 0; animation: dmMiss 2000ms linear infinite; }
  @keyframes dmMiss { 0%, 38% { opacity: 0; } 42%, 60% { opacity: 1; } 65%, 100% { opacity: 0; } }
  .dm-mouth { opacity: 0; animation: dmMouth 2000ms linear infinite; }
  @keyframes dmMouth { 0%, 32% { opacity: 0; } 33%, 41% { opacity: 1; } 42%, 100% { opacity: 0; } }
  .dm-chomp { opacity: 0; animation: dmChomp 2000ms linear infinite; }
  @keyframes dmChomp { 0%, 41% { opacity: 0; } 42%, 47% { opacity: 1; } 48%, 51% { opacity: 0; } 52%, 56% { opacity: 1; } 57%, 100% { opacity: 0; } }
  .dm-chompf { opacity: 0; animation: dmChompF 2000ms linear infinite; }
  @keyframes dmChompF { 0%, 36% { opacity: 0; } 37%, 38% { opacity: 1; } 39%, 100% { opacity: 0; } }
  .dm-wide { opacity: 0; animation: dmWide 2000ms linear infinite; }
  @keyframes dmWide { 0%, 38% { opacity: 0; } 39%, 54% { opacity: 1; } 55%, 100% { opacity: 0; } }
  .dm-splash { opacity: 0; animation: dmSplash 2000ms linear infinite; }
  @keyframes dmSplash { 0%, 74% { opacity: 0; } 76% { opacity: 1; } 88%, 100% { opacity: 0; } }

  /* 하단 해설 줄 */
  .sheet { flex: none; width: var(--sw, 600px); min-height: var(--sht, 64px); display: flex; align-items: center; gap: 10px 12px; }
  .sheet[hidden] { display: none; }
  .stext { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .stext p { margin: 0; font-size: 15px; line-height: 1.35; word-break: keep-all; overflow-wrap: break-word; }
  .stext p.sf { font-size: 13px; color: var(--muted); }
  .stext p.sf[hidden] { display: none; }
  .stext .nm0 { color: var(--b1-ink); font-weight: 800; } .stext .nm1 { color: var(--b2-ink); font-weight: 800; } .stext .nm2 { color: var(--b3-ink); font-weight: 800; }
  .sbtns { flex: none; display: flex; gap: 8px; align-items: center; }
  .sbtns button { height: 48px; white-space: nowrap; }
  body.narrow .sheet { flex-direction: column; align-items: stretch; }
  body.narrow .stext p { font-size: 14px; }
  body.narrow .stext p.sf { font-size: 12px; }
  body.narrow .sbtns button { flex: 1 1 0; min-width: 0; padding: 0 10px; font-size: 15px; }
  body.narrow .sbtns button.primary { font-size: 16px; }
  body.low .sbtns button { height: 44px; }

  /* 오버레이 (parrot-beat와 같은 CSS) */
  .overlay {
    position: absolute; inset: 0; border-radius: 12px; padding: 16px; overflow-x: hidden; overflow-y: auto; touch-action: pan-y;
    display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: safe center; text-align: center;
    background: color-mix(in srgb, var(--well) 94%, transparent); line-height: 1.4; z-index: 3;
    animation: ovIn 200ms ease-out;
  }
  .overlay > * { animation: ovUp 200ms ease-out; flex: none; }
  @keyframes ovIn { from { opacity: 0; } }
  @keyframes ovUp { from { transform: translateY(8px); } }
  .overlay[hidden] { display: none; }
  body.ov-full .overlay { position: fixed; inset: 0; border-radius: 0; z-index: 10; background: color-mix(in srgb, var(--well) 97%, transparent);
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  #ovPause { background: var(--well); }
  .overlay .ov-home { display: none; }
  body.ov-full .overlay .ov-home { display: inline-flex; position: absolute; margin: 0; animation: none;
    top: max(4px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); }
  .overlay h2 { margin: 0; font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 8px; justify-content: center; }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; }
  .overlay .row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .overlay [hidden] { display: none !important; }
  #ovStart h2 { font-size: 26px; }
  .steps { display: flex; align-items: flex-start; gap: 6px; justify-content: center; }
  .steps figure { margin: 0; width: 120px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .steps figure svg { width: 72px; height: 72px; border-radius: 14px; background: var(--sky); }
  .steps figcaption { font-size: 13px; font-weight: 700; color: var(--ink); word-break: keep-all; line-height: 1.3; }
  .steps .arr { width: 14px; height: 14px; margin-top: 29px; flex: none; color: var(--muted); }
  .bestline { font-size: 14px; color: var(--muted); display: inline-flex; align-items: baseline; gap: 6px; }
  .bestline b { font-size: 20px; color: var(--ink); }
  #startBtn { height: 52px; min-width: 200px; }
  .badge { background: var(--panel); border: 2px solid var(--gold); color: var(--ink); font-size: 13px; font-weight: 800; border-radius: 999px; padding: 3px 12px; }
  .scorerow { display: flex; align-items: center; gap: 6px 12px; justify-content: center; flex-wrap: wrap; }
  .scorerow .sl { font-size: 15px; font-weight: 700; color: var(--muted); }
  .scorerow .rs { font-size: 56px; line-height: 1; }
  #lbSlot { min-width: 0; display: inline-flex; align-items: center; }
  .lastbox { width: min(100%, 560px); background: var(--panel); border: 1px solid var(--grid); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; }
  .lastbox .lh { font-size: 13px; font-weight: 700; color: var(--muted); }
  .lastbox .stext p { color: var(--ink); }
  .lastbox .stext p.sf { color: var(--muted); }
  .heads { display: flex; justify-content: space-around; }
  .hd { display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
  .hd svg.hh { width: 40px; height: 40px; }
  .hd .hn { font-size: 22px; color: var(--bci); line-height: 1; }
  .hd .hm { display: flex; gap: 3px; min-height: 20px; }
  .hd .hm .tag { height: 20px; font-size: 11px; padding: 0 7px 0 4px; animation: none; }
  .hd .hm .tag svg { width: 12px; height: 12px; }
  .hd .hm .tag.t-me { padding: 0 7px; }
  #ovResult .resbtns { gap: 8px 10px; }
  #againBtn { height: 52px; }
  .pmsg { color: var(--ink) !important; font-weight: 700; font-size: 15px !important; max-width: 420px; word-break: keep-all; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* 상단 바 너비 구간 (JS가 body 클래스로 지정) */
  body.tb-760 .title { display: none; }
  body.tb-640 .home .full { display: none; }
  body.tb-640 .home .short { display: inline; }
  body.tb-640 .lvpill .sx { display: none; }
  body.tb-420 .spd { display: none; }
  body.tb-420 .lvpill { padding: 0 10px; }
  body.tb-420 .scorev small { display: none; }
  body.tb-420 .hearts svg { width: 16px; height: 16px; }
  body.tb-420 .top { gap: 6px; }
  @media (max-height: 520px) {
    .overlay h2, #ovStart h2 { font-size: 20px; }
    .overlay { gap: 6px; padding: 8px; }
    body.ov-full .overlay { padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    .steps figure svg { width: 48px; height: 48px; }

    #startBtn, #againBtn { height: 48px; }
  }
  @media (max-width: 419px) {
    .steps figure { width: 96px; }
    .steps figure svg { width: 48px; height: 48px; }

  }
  @media (prefers-reduced-motion: reduce) {
    .overlay, .overlay > *, .banner, .cue .ci, .pan, .tag, .mostpill { animation: none; }
    .scene .wave, .scene.breathing .bear .breath, .scene.choosing .bear .breath { animation: none; }
    .bear.hov .lift, .bear.shake .lift { transform: none; animation: none; }
    .minis svg { animation: fadeOnly 80ms linear; }
    .pv .pn.bump { animation: none; }
    @keyframes fadeOnly { from { opacity: 0; } }
    button:active { transform: none; }
    .dm-real, .dm-fake, .dm-yum, .dm-miss, .dm-mouth, .dm-chomp, .dm-chompf, .dm-wide, .dm-splash { animation: none; }
    .dm-real { transform: translate(60px, 50px); }
    .dm-fake { transform: translate(84px, 16px) rotate(200deg); }
    .dm-yum, .dm-miss, .dm-splash, .dm-mouth, .dm-wide { opacity: 1; }
    .scene .flame { animation: none; }
  }
</style>
</head>

            <rect x="8" y="58" width="8" height="12" rx="2" fill="var(--b1)"/><rect x="34" y="50" width="8" height="20" rx="2" fill="var(--b2)"/><rect x="60" y="56" width="8" height="14" rx="2" fill="var(--b3)"/></svg>

    <div class="sbtns">

<div class="sr" aria-live="polite" id="live"></div>
<script>
/* ===== 폭식 불곰을 찾아라 (hungry-bear) Sound module =====
 * Web Audio API 실시간 합성. 외부 파일/의존성 없음.
 * AudioContext 미지원·생성 실패 시 모든 호출은 조용히 무시된다(게임은 소리 없이 정상 진행).
 * 사용법: 사용자 제스처(click/touchend/pointerup/keydown) 핸들러 맨 앞에서 Sound.unlock() →
 *         Sound.play('splash'), Sound.play('eat'), Sound.play('tally', { n: 3 }) 등.
 * 톤: 숲속 강가. 칼림바·나무 소리·물소리. 버저·사각파·날카로운 고음 없음(효과음 버스 7kHz 로우패스).
 * 조성: G 장조(효과음과 BGM 통일). 모든 멜로디는 오리지널.
 *
 * [공정성 규칙] 'eat'은 곰 번호를 받지 않는다. 세 곰의 먹는 소리는 완전히 같은 소리이며
 *   (패닝 없음, 음높이 무작위 ±3%는 모든 호출에 같은 분포) 소리로 곰을 구별할 수 없다.
 *   빠른 구간(연어 간격 ~120ms)에서는 간격에 따라 자동으로 짧고 작아지며(곰과 무관),
 *   첨벙·냠 동시 발음은 최대 4개로 제한된다.
 *
 * 신호 경로: sfxBus → LP 7kHz ┐
 *            musicBus → musicDuck(순간 덕킹) ┴→ master(음소거) → limiter → destination
 */
const Sound = (function () {
  'use strict';
  var MUTE_KEY = 'hungry-bear-muted';
  var MUSIC_KEY = 'hungry-bear-music';
  var MASTER_VOL = 0.6;
  var MUSIC_VOL = 0.14;      // 배경음악 버스 (효과음보다 확실히 뒤에)
  var DUCK = 0.45;           // 결과음이 날 때 음악을 잠깐 낮추는 비율
  var HIT_CAP = 4;           // 첨벙·냠 동시 발음 최대 수

  var ctx = null, master = null, limiter = null, sfxBus = null, sfxTone = null;
  var musicBus = null, musicDuck = null, noiseBuf = null;
  var muted = false, musicPref = true, offline = false;
  var last = {}, hitPool = [];
  var music = { want: false, on: false, timer: null, step: 0, nextAt: 0, nodes: [], stopTimer: null,
                mode: 'calm', level: 1 };

  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) { muted = false; }
  try { musicPref = localStorage.getItem(MUSIC_KEY) !== '0'; } catch (e) { musicPref = true; }

  function build(c) {
    ctx = c;
    limiter = ctx.createDynamicsCompressor();          // 마스터 리미터
    limiter.threshold.value = -6; limiter.knee.value = 2; limiter.ratio.value = 20;
    limiter.attack.value = 0.002; limiter.release.value = 0.15;
    limiter.connect(ctx.destination);

    master = ctx.createGain();
    master.gain.value = muted ? 0 : MASTER_VOL;
    master.connect(limiter);

    sfxTone = ctx.createBiquadFilter();
    sfxTone.type = 'lowpass'; sfxTone.frequency.value = 7000; sfxTone.Q.value = 0.5;
    sfxTone.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(sfxTone);

    musicDuck = ctx.createGain(); musicDuck.gain.value = 1; musicDuck.connect(master);
    musicBus = ctx.createGain(); musicBus.gain.value = MUSIC_VOL; musicBus.connect(musicDuck);

    var len = Math.floor(ctx.sampleRate * 0.6);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = noiseBuf.getChannelData(0), seed = 20261116;
    for (var j = 0; j < len; j++) { seed = (seed * 1103515245 + 12345) & 0x7fffffff; d[j] = seed / 0x3fffffff - 1; }
  }

  function ensureCtx() {
    if (ctx) return ctx;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      var c;
      try { c = new AC({ latencyHint: 'interactive' }); } catch (e1) { c = new AC(); }
      build(c);
    } catch (e) { ctx = null; }
    return ctx;
  }

  function running() { return !!ctx && (offline || ctx.state === 'running'); }
  function ready() { return running() && !muted; }

  function throttled(key, t, gap) {
    if (last[key] !== undefined && t - last[key] < gap && t >= last[key]) return true;
    last[key] = t;
    return false;
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  // ---------- 음원 기본 블록 ----------
  function tone(type, f0, f1, t, dur, vol, attack, dest, track) {
    try {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.8);
      var a = attack || 0.005;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest || sfxBus);
      o.start(t); o.stop(t + dur + 0.03);
      if (track) track.push({ n: o, end: t + dur + 0.03 });
      return o;
    } catch (e) { return null; }
  }

  function noise(t, dur, vol, ftype, f0, f1, q, attack, dest, track) {
    try {
      var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noiseBuf;
      f.type = ftype; f.Q.value = q || 0.8;
      f.frequency.setValueAtTime(f0, t);
      if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      var a = attack || 0.004;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(dest || sfxBus);
      s.start(t, Math.random() * 0.2); s.stop(t + dur + 0.03);
      if (track) track.push({ n: s, end: t + dur + 0.03 });
      return s;
    } catch (e) { return null; }
  }

  // 칼림바: sine 기음 + 비조화 금속 배음(5.4배, 40ms 이내 소멸)
  function kalimba(f, t, dur, vol, dest, track) {
    tone('sine', f, 0, t, dur, vol, 0.003, dest, track);
    tone('sine', f * 5.4, 0, t, Math.min(0.04, dur * 0.3), vol * 0.12, 0.001, dest, track);
  }

  // ---- 냠 전용 부드러운 블록: 선형 어택(지수 어택은 끝에서 급히 솟아 '퍽'처럼 들림) + 지수 꼬리 ----
  function softEnv(g, t, vol, a, dur) {
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.setTargetAtTime(0, t + a, Math.max(0.004, (dur - a) / 5));
  }
  function wetNoise(t, dur, vol, f0, f1, q, a, dest) {
    try {
      var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noiseBuf;
      f.type = 'bandpass'; f.Q.value = q;
      f.frequency.setValueAtTime(f0, t);
      f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      softEnv(g, t, vol, a, dur);
      s.connect(f); f.connect(g); g.connect(dest);
      s.start(t, Math.random() * 0.2); s.stop(t + dur + 0.04);
    } catch (e) {}
  }
  function wetTone(t, dur, vol, f0, f1, a, dest) {
    try {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      softEnv(g, t, vol, a, dur);
      o.connect(g); g.connect(dest);
      o.start(t); o.stop(t + dur + 0.04);
    } catch (e) {}
  }
  // '씹기' 한 번: 좁은 밴드패스 노이즈(Q 5, 1300→700Hz 하강, 촉촉한 질감) + 작은 모음 sine(600→430Hz).
  // k = 음량 배수, r = 음높이 배수
  function chew(t, dur, k, r, dest) {
    wetNoise(t, dur, 0.66 * k, 1300 * r, 700 * r, 5, 0.012, dest);
    wetTone(t + 0.004, dur * 0.8, 0.05 * k, 600 * r, 430 * r, 0.014, dest);
  }

  // 첨벙·냠 전용 보이스: 동시 발음이 HIT_CAP을 넘으면 가장 오래된 소리를 10ms 안에 줄여 없앤다
  function hitVoice(t, dur) {
    var keep = [];
    for (var i = 0; i < hitPool.length; i++) if (hitPool[i].end > t) keep.push(hitPool[i]);
    hitPool = keep;
    if (hitPool.length >= HIT_CAP) {
      var old = hitPool.shift();
      try { old.g.gain.setTargetAtTime(0, t, 0.004); } catch (e) {}
    }
    var g = ctx.createGain(); g.gain.value = 1; g.connect(sfxBus);
    hitPool.push({ g: g, end: t + dur });
    return g;
  }

  // 연속 발음 밀도 계수: 직전 같은 소리와의 간격(초)이 짧을수록 작고 짧게. 곰과 무관한 시간 정보만 쓴다.
  function density(key, t) {
    var prev = last[key + ':d'];
    var gap = (prev === undefined || t < prev) ? 1 : t - prev;
    last[key + ':d'] = t;
    return gap;
  }

  function duck(t, hold) {
    try {
      musicDuck.gain.cancelScheduledValues(t);
      musicDuck.gain.setTargetAtTime(DUCK, t, 0.04);
      musicDuck.gain.setTargetAtTime(1, t + hold, 0.35);
    } catch (e) {}
  }

  var N = { E2: 82.41, G2: 98.0, A2: 110.0, B2: 123.47, C3: 130.81, D3: 146.83, E3: 164.81, Fs3: 185.0,
            G3: 196.0, A3: 220.0, B3: 246.94, C4: 261.63, D4: 293.66, E4: 329.63, Fs4: 369.99,
            G4: 392.0, A4: 440.0, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, Fs5: 739.99,
            G5: 783.99, A5: 880.0, B5: 987.77, D6: 1174.66, E6: 1318.51, G6: 1567.98 };
  // 해설 틱 음계(G 장조 5음 음계, 한 칸씩 상승)
  var TALLY = [N.G4, N.A4, N.B4, N.D5, N.E5, N.G5, N.A5, N.B5, N.D6, N.E6, N.G6];

  // ---------- 효과음 ----------
  var sfx = {
    // 시작 카운트(3·2·1 각각): 나무 '톡' + 칼림바 D5
    count: function (t) {
      if (throttled('count', t, 0.25)) return;
      noise(t, 0.025, 0.06, 'bandpass', 1800, 0, 1.5, 0.001);
      kalimba(N.D5, t, 0.22, 0.15);
    },
    // 시작 신호(카운트 끝 "시작!"): 칼림바 G5 + D6 동시 + 작은 물방울
    go: function (t) {
      if (throttled('go', t, 0.3)) return;
      kalimba(N.G5, t, 0.4, 0.15);
      kalimba(N.D6, t + 0.01, 0.35, 0.08);
      tone('sine', 900, 1500, t + 0.05, 0.05, 0.04, 0.002);
    },
    // 첨벙: 연어가 강에서 튀어오를 때. 밴드패스 노이즈 하강 + 작은 물방울. 연속이면 자동으로 작고 짧게
    splash: function (t) {
      if (throttled('splash', t, 0.04)) return;
      var gap = density('splash', t);
      var dens = clamp(0.65 + gap * 1.2, 0.65, 1);
      var dur = clamp(gap * 0.9, 0.07, 0.13);
      var r = 0.94 + Math.random() * 0.12;
      var v = hitVoice(t, dur + 0.05);
      noise(t, dur, 0.13 * dens, 'bandpass', 2400 * r, 800 * r, 0.9, 0.006, v);
      tone('sine', 900 * r, 1500 * r, t + 0.025, 0.035, 0.035 * dens, 0.002, v);
    },
    // 냠(v2): 곰이 연어를 덥석 물고 씹는 소리. 세 곰 모두 완전히 같은 소리(인자 없음, 패닝 없음).
    // ① '앙/덥석' 입 닫힘: 부드러운 밴드패스 노이즈(입 모양 공명) + 작은 'ㅁ' 허밍. 선형 어택 15ms(날카로운 타격 없음)
    // ② '냠냠' 씹기 2번: 좁은 밴드패스 노이즈(촉촉한 질감) 중심 주파수 하강 + 작은 모음 sine. 선형 어택 12ms. 두 번째는 낮고 작게
    // 전체를 180Hz 하이패스로 걸러 킥 드럼 같은 저역 펀치를 없앤다.
    // 음높이 무작위 ±3%·노이즈 시작 위치는 모든 호출 동일 분포. 연속이면 직전 냠과의 간격(곰과 무관)에 따라
    // 시간 축을 압축하고(0.3초 이상이면 원형), 0.2초 미만이면 씹기를 1번만, 음량도 자동으로 작게.
    eat: function (t) {
      if (throttled('eat', t, 0.04)) return;
      var gap = density('eat', t);
      var dens = clamp(0.65 + gap * 1.2, 0.65, 1);
      var sp = clamp(gap / 0.3, 0.45, 1);                 // 시간 압축 계수
      var two = gap >= 0.2;                                // 씹기 2번(느릴 때) / 1번(빠를 때)
      var r = 0.97 + Math.random() * 0.06;
      var c1 = 0.075 * sp, c2 = 0.165 * sp, cd = 0.07 * clamp(sp, 0.75, 1);
      var v = hitVoice(t, (two ? c2 : c1) + cd + 0.03);
      var hp;
      try { hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 180; hp.Q.value = 0.7; hp.connect(v); }
      catch (e) { hp = v; }
      // ① 앙/덥석
      wetNoise(t, 0.065 * clamp(sp, 0.75, 1), 0.44 * dens, 1100 * r, 650 * r, 2.2, 0.015, hp);
      wetTone(t, 0.07, 0.04 * dens, 380 * r, 300 * r, 0.015, hp);
      // ② 냠냠
      chew(t + c1, cd, 1.0 * dens, r, hp);
      if (two) chew(t + c2, cd, 0.7 * dens, r * 0.88, hp);
    },
    // 곰 선택(정답 확인 전): 나무 '툭' + 작은 B4
    select: function (t) {
      if (throttled('select', t, 0.2)) return;
      tone('sine', 240, 150, t, 0.07, 0.16, 0.002);
      noise(t, 0.03, 0.07, 'bandpass', 1200, 0, 1.2, 0.001);
      kalimba(N.B4, t + 0.02, 0.18, 0.08);
    },
    // 정답: 밝은 상승 G5-B5-D6 + 작은 반짝임
    correct: function (t) {
      if (throttled('result', t, 0.4)) return;
      duck(t, 0.9);
      kalimba(N.G5, t, 0.3, 0.16);
      kalimba(N.B5, t + 0.08, 0.3, 0.15);
      kalimba(N.D6, t + 0.16, 0.55, 0.15);
      tone('sine', N.G6, 0, t + 0.24, 0.3, 0.025, 0.01);
    },
    // 오답: 부드러운 하강 2음 (E4 → C4, 살짝 처짐) + 낮은 받침. 버저 없음
    wrong: function (t) {
      if (throttled('result', t, 0.4)) return;
      duck(t, 1.0);
      tone('triangle', N.E4, N.E4 * 0.98, t, 0.3, 0.17, 0.01);
      tone('triangle', N.C4, N.C4 * 0.96, t + 0.22, 0.55, 0.17, 0.01);
      tone('sine', N.C3, 0, t + 0.22, 0.5, 0.12, 0.02);
    },

  // 집계 쌓기 (먹은 순서대로 미니 연어 + 숫자)

    if (G.phase === 'explain') skipAnim();
  });
  ['contextmenu', 'dblclick', 'gesturestart', 'selectstart'].forEach(function (t) {
    document.addEventListener(t, function (e) { if (!(e.target.closest && e.target.closest('a'))) e.preventDefault(); }, { passive: false });
  });
  var lastTouch = 0;
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - lastTouch < 350 && !(e.target.closest && e.target.closest('a'))) { e.preventDefault(); var t = e.target.closest && e.target.closest('button'); if (t && !(t.classList.contains('pick'))) t.click(); }
    lastTouch = now;
  }, { passive: false });
  window.addEventListener('pointerdown', function () { Sound.unlock(); }, { passive: true });
  function topOverlay() { var o = ['ovPause', 'ovResult', 'ovStart'].map($).filter(function (x) { return !x.hidden; }); return o[0] || null; }
  document.addEventListener('keydown', function (e) {
    if (window.Leaderboard && Leaderboard.isOpen && Leaderboard.isOpen()) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    Sound.unlock();
    var k = e.key;
    var onBtn = e.target && (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') && !e.target.classList.contains('pick');
    if ((k === 'm' || k === 'M') && !e.repeat) { toggleMute(); return; }
    if (!$('ovPause').hidden) {
      if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); Sound.play('button'); resume(); }
      return;
    }
    if (!$('ovStart').hidden) { if ((k === 'Enter' || k === ' ') && !onBtn && !e.repeat) { e.preventDefault(); beginGame(); } return; }
    if (!$('ovResult').hidden) { if (k === 'Enter' && !onBtn && !e.repeat) { e.preventDefault(); beginGame(); } return; }
    if (k === 'p' || k === 'P' || k === 'Escape') { e.preventDefault(); Sound.play('button'); pause('button'); return; }
    if (G.phase === 'banner') { if ((k === 'Enter' || k === ' ') && !e.repeat) { e.preventDefault(); Sound.play('button'); closeBanner(); } return; }
    if (G.phase === 'choose') {
      if (/^[123]$/.test(k)) { e.preventDefault(); choose(+k - 1, false); return; }
      if (k === 'ArrowLeft' || k === 'ArrowRight') {
        e.preventDefault();
        var picks = document.querySelectorAll('.pick'), cur = Array.prototype.indexOf.call(picks, document.activeElement);
        var n = cur < 0 ? (k === 'ArrowLeft' ? 2 : 0) : clamp(cur + (k === 'ArrowRight' ? 1 : -1), 0, 2);
        picks[n].focus(); clearBearCls(['foc']); setBearCls(n, 'foc', true);
        return;
      }
      if (k === 'Enter') { var ai = Array.prototype.indexOf.call(document.querySelectorAll('.pick'), document.activeElement); if (ai >= 0) { e.preventDefault(); choose(ai, false); } return; }
      return;
    }
    if (G.phase === 'explain') {
      if (k === 'Enter' && !onBtn && !e.repeat) { e.preventDefault(); nextAction(); return; }
      if ((k === 'r' || k === 'R') && !e.repeat) { e.preventDefault(); toggleReplay(); return; }
      if ((k === 's' || k === 'S') && !e.repeat) { e.preventDefault(); toggleSlow(); return; }
      if (k === ' ' && !e.repeat) { if (!onBtn) e.preventDefault(); if (G.tally) { e.preventDefault(); finishTally(); } else if (G.replay && !onBtn) stopReplay(); return; }
    }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) pause('hidden');
  });
  window.addEventListener('pagehide', function () { pause('hidden'); });
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', layout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);

  // ---------- 테스트 훅 ----------
  function clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
  window.__bear = {
    genRound: function (level, seed, history) { return Engine.genRound(level, seed, history); },
    validate: function (round) { return Engine.validate(round); },
    levelCfg: function (L) { return Engine.levelCfg(L); },
    combos: function (L) { return Engine.combos(Engine.levelCfg(L)); },
    COMBOS: clone(Engine.COMBOS),
    consts: { BUBBLE_MS: Engine.BUBBLE_MS, FAKE_FALL_MS: Engine.FAKE_FALL_MS, FAKE_SPLASH_MS: Engine.FAKE_SPLASH_MS, EAT_VANISH_MS: Engine.EAT_VANISH_MS,
      END_WAIT: Engine.END_WAIT, H_PRE: Engine.H.PRE, H_POST: Engine.H.POST, H_SAME_PRE: Engine.H.SAME_PRE, H_FF: Engine.H.FF, H_FF_REAL: Engine.H.FF_REAL, H_FIRST: Engine.H.FIRST },
    state: function () {
      return clone({ screen: G.phase, level: G.level, lives: G.lives, score: G.score, best: G.best, round: G.round, pick: G.pick,
        paused: G.paused, eligible: G.eligible, seed: G.seed, last: G.last ? { pick: G.last.pick, ok: G.last.ok, level: G.last.level, round: G.last.round } : null,
        replay: G.replay ? { e: G.replay.e, rate: G.replay.rate, n: G.replay.n } : null, tallying: !!G.tally });
    },
    start: function (seed, level) { G.tainted = true; beginGame((seed >>> 0) || 1, level || 1); G.eligible = false; return this.state(); },
    answer: function (bear) { return choose(bear, true); },
    skip: function () {
      if (G.phase === 'banner') { $('banner').hidden = true; clearTimers(); G.phase = 'prep'; }
      if (G.phase === 'prep') { clearTimers(); startFeed(); }
      if (G.phase === 'feed' && G.feed) { G.feed.t0 = performance.now() - G.feed.round.durationMs - G.feed.lead - 1; feedFrame(performance.now()); }
      if (G.tally) finishTally();
      return G.phase;
    },
    log: function () { return clone(G.log); },
    // 테스트·스크린샷 전용: 먹기 화면을 사건 시각 e(ms)에 멈춤 / null이면 그 시각부터 다시 진행
    freeze: function (e) {
      var f = G.feed; if (!f) return false;
      if (e == null) { if (f.frozen != null) { f.t0 = performance.now() - f.frozen - f.lead; f.frozen = null; } return true; }
      f.frozen = e; f.prevE = e; return true;
    },
    sentences: function (round, pick) { var st = sentences({ round: round, pick: pick, ok: pick === round.winner }); return { main: plain(st.main), fake: plain(st.fake) }; }
  };

  // ---------- 시작 ----------
  $('bhead').innerHTML = headParts(false);
  syncMute();
  layout();
  showTitle();
  for (var bb = 0; bb < 3; bb++) scheduleBlink(bb);
  requestAnimationFrame(loop);
})();
</script>
