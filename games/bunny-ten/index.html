<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>개구리 텐</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="개구리 텐">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e4572e">
<style>
  /* 판 숫자 전용 글꼴: Pretendard ExtraBold(SIL OFL 1.1)의 숫자 0~9 서브셋. 수정본이라 내부 이름은 BunnyDigits. 라이선스 fonts/OFL.txt */
  @font-face { font-family: "BunnyDigits"; src: url("fonts/bunny-digits-800.woff2") format("woff2");
    font-weight: 800; font-style: normal; font-display: swap; unicode-range: U+0030-0039; }
  :root {
    --app-h: 100vh;
    --app-h: 100dvh;
    --bg: #f4f1ea; --panel: #ffffff; --ink: #1f2430; --muted: #6b7280;
    --grid: #e7e2d8; --well: #fbfaf7; --accent: #e4572e; --gold: #f2b134;
    /* v4 개구리: 이름은 레거시, 의미 — meadow=연못 판, burrow=빈 물자리, fur=개구리 몸, fur-edge=개구리 외곽선, dust=퐁당 물결 고리 */
    --meadow: #d3e0de; --meadow-edge: #b4c8c5; --burrow: #c2d3d0;
    --fur: #d4e7bb; --fur-edge: #8aa395; --num: #1b2e26; --dust: #f4faf9;
    --sel-under: #6b4fc8; --sel-ok: #1f6fc4; --sel-over: #c93b3b; --sel-on: #ffffff;
    --sel-under-edge: #5f44b8; --sel-ok-edge: #1a5ea8; --sel-over-edge: #ad3030;
    --time: #3f9d5a; --danger: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141a; --panel: #1b1e27; --ink: #eceef3; --muted: #9aa1ae;
      --grid: #262a35; --well: #161921; --accent: #ff7a50; --gold: #ffc94d;
      --meadow: #16242a; --meadow-edge: #26393f; --burrow: #21333a;
      --fur: #a3bb96; --fur-edge: #62786c; --num: #14211b; --dust: #7fa1a3;
      --sel-under: #a58cff; --sel-ok: #5aa2f0; --sel-over: #ff6b6b; --sel-on: #12141a;
      --sel-under-edge: #5b43b8; --sel-ok-edge: #1a5296; --sel-over-edge: #9c2a34;
      --time: #5cc27a; --danger: #ff6b6b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12141a; --panel: #1b1e27; --ink: #eceef3; --muted: #9aa1ae;
    --grid: #262a35; --well: #161921; --accent: #ff7a50; --gold: #ffc94d;
    --meadow: #16242a; --meadow-edge: #26393f; --burrow: #21333a;
    --fur: #a3bb96; --fur-edge: #62786c; --num: #14211b; --dust: #7fa1a3;
    --sel-under: #a58cff; --sel-ok: #5aa2f0; --sel-over: #ff6b6b; --sel-on: #12141a;
    --sel-under-edge: #5b43b8; --sel-ok-edge: #1a5296; --sel-over-edge: #9c2a34;
    --time: #5cc27a; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: var(--app-h); overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  .app { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }

  /* 상단 바 */
  .top {
    flex: none; height: 52px; width: min(100%, max(var(--bw, 600px), 560px));
    display: flex; align-items: center; gap: 8px;
  }
  .home {
    flex: none; min-height: 44px; display: inline-flex; align-items: center; padding: 0 8px; margin-left: -8px;
    color: var(--muted); font-size: 14px; text-decoration: none; border-radius: 8px; white-space: nowrap;
  }
  .home:hover, .home:focus-visible { color: var(--ink); }
  .home .short { display: none; }
  .home:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .title { margin: 0; font-size: 18px; font-weight: 800; white-space: nowrap; }
  .spacer { flex: 1; min-width: 0; }
  .hud { display: flex; gap: 6px; }
  .card {
    background: var(--panel); border: 1px solid var(--grid); border-radius: 10px;
    padding: 4px 12px; min-width: 64px; line-height: 1.15; max-height: 48px;
  }
  .card .lab { display: block; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .08em; }
  .card b { display: inline-block; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; transform-origin: left center; }
  .card b.rec { color: var(--accent); }
  .card b.bump { animation: bump 160ms ease-out; }
  .card b.warn { color: var(--danger); }
  .card b.pulse { animation: pulse 200ms ease-out; }
  @keyframes bump { 50% { transform: scale(1.15); } }
  @keyframes pulse { 50% { transform: scale(1.18); } }
  .btns { display: flex; gap: 6px; }

  button {
    font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--grid);
    border-radius: 10px; cursor: pointer; touch-action: manipulation;
    transition: transform 80ms ease-out, background-color 80ms ease-out;
  }
  button:active { transform: scale(.94); background: var(--grid); }
  button:disabled { opacity: .5; cursor: default; }
  button.icon { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; font-size: 18px; color: var(--ink); }
  button.icon svg { width: 20px; height: 20px; }
  button.icon svg[hidden] { display: none; }
  button.primary {
    background: var(--accent); color: #fff; border-color: transparent; font-weight: 700;
    height: 48px; padding: 0 24px; font-size: 18px;
  }
  button.primary:active { background: var(--accent); filter: brightness(.92); }
  button.secondary, a.secondary {
    height: 44px; padding: 0 18px; font-size: 15px; background: var(--panel); color: var(--ink);
    border: 1px solid var(--grid); border-radius: 10px; display: inline-flex; align-items: center; text-decoration: none;
  }

  /* 시간 막대 */
  .timebar { flex: none; width: var(--bw, 600px); height: 10px; border-radius: 999px; background: var(--grid); overflow: hidden; }
  .timebar .fill { width: 100%; height: 100%; background: var(--time); transform-origin: left center; border-radius: 999px; }
  .timebar.warn .fill {
    background: repeating-linear-gradient(45deg, transparent 0 6px, rgba(255,255,255,.35) 6px 12px), var(--danger);
  }

  /* 보드 */
  .board-wrap {
    flex: none; position: relative; padding: 10px; margin: -10px;
    touch-action: none;
  }
  .board {
    position: relative; width: var(--bw, 600px); height: var(--bh, 360px);
    border: 4px solid var(--meadow-edge); border-radius: 14px; background: var(--meadow);
    transition: border-color 300ms ease-out;
  }
  .board.warn { border-color: var(--danger); }
  canvas#cv { display: block; width: 100%; height: 100%; border-radius: 10px; touch-action: none; }
  .sum-badge {
    position: absolute; left: 0; top: 0; height: 32px; padding: 0 12px; border-radius: 999px;
    display: flex; align-items: center; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--sel-on); background: var(--sel-under); pointer-events: none; z-index: 5; white-space: nowrap;
  }
  .sum-badge[hidden] { display: none; }
  .sum-badge.ok { background: var(--sel-ok); }
  .sum-badge.over { background: var(--sel-over); }

  .overlay {
    position: absolute; inset: 0; border-radius: 10px; padding: 16px; overflow: hidden;
    display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; text-align: center;
    background: color-mix(in srgb, var(--well) 84%, transparent); line-height: 1.4; z-index: 3;
    animation: ovIn 200ms ease-out;
  }
  .overlay > * { animation: ovUp 200ms ease-out; }
  @keyframes ovIn { from { opacity: 0; } }
  @keyframes ovUp { from { transform: translateY(8px); } }
  .overlay[hidden] { display: none; }
  #ovStart { background: var(--meadow); }
  /* 보드가 작으면(바깥 높이 < 300px) 오버레이를 화면 전체로. .board·조상 요소에 transform/filter 금지(fixed가 깨짐) */
  body.ov-full .overlay { position: fixed; inset: 0; border-radius: 0; z-index: 10;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  #ovPause { background: color-mix(in srgb, var(--well) 97%, transparent); }
  .overlay h2 { margin: 0; font-size: 24px; font-weight: 800; }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; }
  .overlay .small { font-size: 12px; }
  .overlay .row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .example { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .example canvas { width: 136px; height: 56px; }
  .example span { font-size: 14px; color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .big { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .big small { font-size: 18px; font-weight: 700; margin-left: 4px; }
  .badge { background: var(--gold); color: #1f2430; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 4px 10px; }
  .badge[hidden], .overlay [hidden] { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 559px) {
    .title { display: none; }
    .home .full { display: none; }
    .home .short { display: inline; }
    .card { padding: 4px 8px; min-width: 52px; }
    .card b { font-size: 17px; }
  }
  @media (max-height: 520px) {
    .example, #ovStart .small { display: none; }
    .overlay { gap: 6px; padding: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .overlay, .overlay > *, .card b.bump, .card b.pulse { animation: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <a class="home" href="../../"><span class="full">← 게임 목록</span><span class="short">← 목록</span></a>
    <h1 class="title">개구리 텐</h1>
    <div class="spacer"></div>
    <div class="hud">
      <div class="card"><span class="lab">점수</span><b id="score">0</b></div>
      <div class="card"><span class="lab">최고</span><b id="best">0</b></div>
      <div class="card"><span class="lab">시간</span><b id="time">120</b></div>
    </div>
    <div class="btns">
      <button class="icon" id="muteBtn" aria-label="소리 끄기" aria-pressed="false">
        <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg id="icoOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>
      </button>
      <button class="icon" id="pauseBtn" aria-label="일시정지">Ⅱ</button>
    </div>
  </header>

  <div class="timebar" id="timebar" role="progressbar" aria-label="남은 시간" aria-valuemin="0" aria-valuemax="120" aria-valuenow="120">
    <div class="fill" id="timeFill"></div>
  </div>

  <div class="board-wrap" id="wrap">
    <div class="board" id="board">
      <canvas id="cv" role="img" aria-label="개구리 텐 게임 판"></canvas>

      <div class="overlay" id="ovStart">
        <h2>개구리 텐</h2>
        <p>개구리들을 네모로 감싸 합이 10이 되게 하세요!</p>
        <div class="example">
          <canvas id="exCv" width="136" height="56" aria-hidden="true"></canvas>
          <span>2 + 3 + 5 = 10</span>
        </div>
        <p>제한 시간 2분 · 지운 수가 점수 · 잘 고르면 전부 지울 수 있어요</p>
        <p>최고 <b id="startBest">0</b>마리</p>
        <button class="primary" id="startBtn">시작하기</button>
        <p class="small" id="ctrlHint">마우스로 끌어서 감싸기 · Space 일시정지 · M 소리</p>
        <p class="small" id="rotHint" hidden>가로로 돌리면 더 크게 볼 수 있어요</p>
      </div>

      <div class="overlay" id="ovPause" hidden>
        <h2>일시정지</h2>
        <div class="row">
          <button class="primary" id="resumeBtn">계속하기</button>
          <button class="secondary" id="restartBtn">처음부터</button>
        </div>
      </div>

      <div class="overlay" id="ovOver" hidden>
        <span class="badge" id="newRec" hidden>새 기록!</span>
        <h2 id="overTitle">시간 끝!</h2>
        <p id="overSub" hidden></p>
        <div class="big"><span id="overScore">0</span><small>마리</small></div>
        <p id="overBest">최고 0마리</p>
        <div class="row">
          <button class="primary" id="againBtn">다시 하기</button>
          <a class="secondary" href="../../">← 게임 목록</a>
        </div>
      </div>
    </div>
    <div class="sum-badge" id="sumBadge" hidden></div>
  </div>
</div>
<div class="sr" aria-live="polite" id="live"></div>

<script>
/* ===== 개구리 텐 (bunny-ten) Sound module =====
 * Web Audio API 실시간 합성. 외부 파일/의존성 없음.
 * AudioContext 미지원·실패 시 모든 호출은 조용히 무시된다.
 * 사용법: 첫 터치/클릭/키 입력 핸들러 안에서 Sound.unlock() 호출 → 이후 Sound.play('clear', { count: 3 }) 등.
 */
const Sound = (function () {
  'use strict';
  var MUTE_KEY = 'bunny-ten-muted';
  var MASTER_VOL = 0.5;   // 효과음 전체
  var MUSIC_VOL = 0.06;   // 배경음악 (아주 조용히)

  var ctx = null, master = null, musicBus = null, noiseBuf = null;
  var muted = false;
  var last = {};          // 이름별 마지막 재생 시각 (스로틀)
  var music = { on: false, timer: null, step: 0, nextTime: 0 };

  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) { muted = false; }

  function ensureCtx() {
    if (ctx) return ctx;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : MASTER_VOL;
      master.connect(ctx.destination);
      musicBus = ctx.createGain();
      musicBus.gain.value = MUSIC_VOL;
      musicBus.connect(master);
      var len = Math.floor(ctx.sampleRate * 0.5);
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ctx = null; }
    return ctx;
  }

  function ready() {
    return ctx && ctx.state === 'running' && !muted;
  }

  // 같은 소리가 gap초 안에 다시 호출되면 무시
  function throttled(name, t, gap) {
    if (last[name] !== undefined && t - last[name] < gap) return true;
    last[name] = t;
    return false;
  }

  // 기본 음: 파형, 주파수(시작→끝), 시작시각, 길이, 피크 볼륨, 어택, 출력
  function tone(type, f0, f1, t, dur, vol, attack, dest) {
    try {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      var a = attack || 0.005;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest || master);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }

  function noise(t, dur, vol, filterType, freq, freqEnd) {
    try {
      var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noiseBuf;
      f.type = filterType; f.frequency.setValueAtTime(freq, t);
      if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(master);
      s.start(t); s.stop(t + dur + 0.02);
    } catch (e) {}
  }

  // '폴짝' — 짧은 상승 피치 블립 (개구리 한 마리 점프)
  function hop(t, base, vol) {
    tone('sine', base, base * 2.2, t, 0.07, vol, 0.004);
  }

  var N = { F3: 174.61, A3: 220.0, C4: 261.63, D4: 293.66, F4: 349.23, G4: 392.0, A4: 440.0,
            C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.0,
            C6: 1046.5, D6: 1174.66, F6: 1396.91, A6: 1760.0 };

  var sfx = {
    // 게임 시작: 통통 튀는 상승 3음 (F5-A5-C6) + 마지막 폴짝
    start: function (t) {
      tone('triangle', N.F5, 0, t, 0.10, 0.25);
      tone('triangle', N.A5, 0, t + 0.09, 0.10, 0.25);
      tone('triangle', N.C6, 0, t + 0.18, 0.22, 0.25);
      hop(t + 0.18, 500, 0.10);
    },
    // 드래그 시작: 거의 안 들리는 '톡' (80ms 스로틀)
    select: function (t) {
      if (throttled('select', t, 0.08)) return;
      tone('sine', 900, 700, t, 0.035, 0.035, 0.002);
    },
    // 선택 합이 10이 된 순간 미리 알림: 작은 반짝 2음 (150ms 스로틀)
    ready: function (t) {
      if (throttled('ready', t, 0.15)) return;
      tone('sine', N.C6, 0, t, 0.07, 0.07);
      tone('sine', N.F6, 0, t + 0.05, 0.10, 0.06);
    },
    // 지우기 성공: count(지운 개구리 수)에 따라 2 / 3 / 4+ 단계
    clear: function (t, opts) {
      var count = (opts && +opts.count) || 2;
      // 1) 개구리마다 폴짝 블립 (최대 6번, 45ms 간격, 점점 높게)
      var hops = Math.min(Math.max(count, 1), 6);
      for (var i = 0; i < hops; i++) hop(t + i * 0.045, 420 + i * 60, 0.09);
      var c = t + 0.04;
      if (count <= 2) {
        // 2개: 밝은 2음 (C6 → F6)
        tone('triangle', N.C6, 0, c, 0.10, 0.20);
        tone('triangle', N.F6, 0, c + 0.07, 0.16, 0.18);
      } else if (count === 3) {
        // 3개: 3음 아르페지오 (A5-C6-F6) + 살짝 반짝임
        tone('triangle', N.A5, 0, c, 0.10, 0.20);
        tone('triangle', N.C6, 0, c + 0.06, 0.10, 0.20);
        tone('triangle', N.F6, 0, c + 0.12, 0.22, 0.20);
        tone('sine', N.A6, 0, c + 0.12, 0.20, 0.04);
      } else {
        // 4개+: 4음 아르페지오 + 화음 + 쉬머 노이즈 + 부드러운 저음
        var arp = [N.F5, N.A5, N.C6, N.F6];
        for (var j = 0; j < arp.length; j++) tone('triangle', arp[j], 0, c + j * 0.05, 0.12, 0.20);
        var e = c + 0.20;
        tone('triangle', N.F6, 0, e, 0.40, 0.16, 0.01);
        tone('sine', N.A6, 0, e, 0.40, 0.06, 0.01);

      var ef = effects[i];
      if (ef.type === 'fail' && !reduced) {
        var p = clamp01((gt - ef.t0) / 220);
        if (p < 1) {
          shakeRot = shakeRot || {};
          var sw = Math.sin(p * Math.PI * 4) * (1 - 0.5 * p); // 2회 왕복, 끝으로 갈수록 작게
          var shk = { rot: sw * 6 * Math.PI / 180, tx: sw * 0.03 * C };
          for (var j = 0; j < ef.cells.length; j++) shakeRot[ef.cells[j]] = shk;
        }
      }
    }
    var wig = Math.sin(gt / 440 * Math.PI * 2); // 들썩 주기 440ms
    var endHop = 0;
    if (gt - endHopT0 < 200) endHop = -Math.sin(clamp01((gt - endHopT0) / 200) * Math.PI) * 0.12 * C;

    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var x = c * C, y = r * C, v = grid[r][c];
        if (!v) {
          var ra = removedAt[r * COLS + c];
          var bs = ra < -1e8 ? 1 : clamp01((gt - ra) / 180);
          if (bs > 0) {
            bs = reduced ? 1 : easeOut(bs);
            g2.fillStyle = pal.burrow;
            g2.beginPath(); g2.ellipse(x + 0.5 * C, y + 0.80 * C, 0.16 * C * bs, 0.05 * C * bs, 0, 0, Math.PI * 2); g2.fill();
          }
          continue;
        }
        var st = inSel(sel, r, c) ? sel.st : 0;
        var sp = sprites[st][v];
        var opt = null;
        if (appearT0 > -1e8) {
          var t = (gt - appearT0 - c * 15) / 220; // 열 순서로 등장
          if (t < 1) {
            if (t <= 0) continue;
            opt = { ty: (1 - easeOutBack(t)) * 0.3 * C, alpha: clamp01(t) };
          }
        }
        if (st === 2 && !reduced) {
          // 들썩: 숨 쉬듯 살짝 부풀며 흔들림
          opt = opt || {};
          var aw = Math.abs(wig);
          opt.rot = wig * 3 * Math.PI / 180;
          opt.sx = 1 + 0.04 * aw; opt.sy = 1 - 0.03 * aw;
          opt.ty = (opt.ty || 0) - aw * 0.03 * C;
        }
        if (shakeRot && shakeRot[r * COLS + c] !== undefined) { var sk = shakeRot[r * COLS + c]; opt = opt || {}; opt.rot = sk.rot; opt.tx = sk.tx; }
        if (endHop) { opt = opt || {}; opt.ty = (opt.ty || 0) + endHop; }
        drawSprite(sp, x, y, opt);
      }
    }
    if (sel) strokeSel(sel, sel.st);

    // 효과 (판 위 레이어 — 뛰어오른 개구리는 다른 칸 위에 그림)
    var keep = [];
    for (i = 0; i < effects.length; i++) {
      ef = effects[i];
      var e = gt - ef.t0;
      if (e > ef.dur) continue;
      keep.push(ef);
      if (ef.type === 'plop') {
        var hx = ef.c * C, hy = ef.r * C, sp2 = sprites[0][ef.v];
        if (e < 0) { drawSprite(sp2, hx, hy, null); continue; }
        if (reduced) { drawSprite(sp2, hx, hy, { alpha: 1 - e / ef.dur }); continue; }
        if (e < 440) drawSprite(sp2, hx, hy, plopOpt(e));
        // 물결 고리 1개 (t 280–460)
        if (e >= 280) {
          var wp = easeOut(clamp01((e - 280) / 180));
          g2.save();
          g2.globalAlpha = 0.6 * (1 - wp);
          g2.strokeStyle = pal.dust.charAt(0) === '#' ? pal.dust : '#ffffff';
          g2.lineWidth = Math.max(1, 0.03 * C);
          g2.beginPath();
          g2.ellipse(hx + 0.5 * C, hy + 0.80 * C, (0.10 + 0.26 * wp) * C, (0.03 + 0.07 * wp) * C, 0, 0, Math.PI * 2);
          g2.stroke();
          g2.restore();
        }
      } else if (ef.type === 'fail') {
        g2.save();
        if (reduced) { if (e > 120) g2.globalAlpha = 0; }
        else if (e < 220) g2.translate(Math.sin(e / 220 * Math.PI * 6) * 5, 0);
        else g2.globalAlpha = 1 - easeOut((e - 220) / 120);
        strokeSel(ef.rect, ef.st);
        g2.restore();
      } else if (ef.type === 'fade') {
        g2.save(); g2.globalAlpha = 1 - easeOut(e / ef.dur); strokeSel(ef.rect, ef.st); g2.restore();
      } else if (ef.type === 'pop') {
        var pp = easeOut(e / ef.dur);
        g2.save();
        g2.globalAlpha = 1 - pp;
        g2.font = '800 20px ' + UI_FONT; g2.textAlign = 'center'; g2.textBaseline = 'middle';
        g2.lineWidth = 4; g2.strokeStyle = pal.panel.charAt(0) === '#' ? pal.panel : '#ffffff'; g2.lineJoin = 'round';
        var py = Math.max(14, ef.y - 28 * pp);
        g2.strokeText('+' + ef.n, ef.x, py);
        g2.fillStyle = pal['sel-ok']; g2.fillText('+' + ef.n, ef.x, py);
        g2.restore();
      }
    }
    effects = keep;
  }

  /* ================= 루프 ================= */
  var lastFrame = performance.now();
  function frame(now) {
    var raw = now - lastFrame; lastFrame = now;
    if (raw < 0) raw = 0;
    // 애니메이션 시계만 100ms로 자른다(버벅임 뒤 효과가 건너뛰지 않게).
    // 제한 시간은 실제 경과 시간 그대로 — 일시정지·탭 숨김 구간은 재개 때 lastFrame을 다시 잡아 제외된다.
    var dt = raw > 100 ? 100 : raw;
    if (state !== 'paused') gt += dt;
    if (state === 'play' && !document.hidden) {
      timeLeft -= raw;
      if (timeLeft <= 0) { timeLeft = 0; setTimeUI(); endGame('time'); }
      else setTimeUI();
    }
    draw();
    requestAnimationFrame(frame);
  }

  /* ================= 테스트 훅 (화면 노출 없음) ================= */
  Object.defineProperty(window, '__bunny', {
    value: Object.freeze({
      seed: function () { return seed; },
      solution: function () { return solution ? deepCopy(solution) : null; },
      grid: function () { return grid ? deepCopy(grid) : null; },
      generate: function (s) { var r = generate(s); return { grid: r.grid, solution: r.solution, retries: r.retries }; },
      newBoard: function (s) { newBoard(s); }
    }),
    writable: false, configurable: false
  });

  /* ================= 초기화 ================= */
  layout();
  loadNumFont();
  $('startBest').textContent = best;
  setScore(0, false);
  resetTimeUI();
  updateMuteIcon();
  if (coarse) $('ctrlHint').textContent = '손가락으로 끌어서 감싸기 · 소리가 안 나면 무음 모드를 확인하세요';
  if (!coarse) try { startBtn.focus({ preventScroll: true }); } catch (e) {}
  requestAnimationFrame(function (t) { lastFrame = t; frame(t); });
})();
</script>
</body>
</html>
