<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>뱀 정원</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="뱀 정원">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e4572e">
<style>
  :root {
    --app-h: 100vh;
    --app-h: 100dvh;
    --bg: #f4f1ea; --panel: #ffffff; --ink: #1f2430; --muted: #6b7280;
    --grid: #e7e2d8; --well: #fbfaf7; --accent: #e4572e;
    --fence: #c9b48a; --tile-a: #e9f2dc; --tile-b: #dfeccf;
    --snake: #3f9d5a; --snake-head: #2f8049; --snake-spot: #8fd19e;
    --eye: #ffffff; --pupil: #1f2430;
    --berry: #e0374f; --berry-seed: #ffd6dc; --leaf: #3f9d5a;
    --gold: #f2b134; --gold-edge: #b9801a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141a; --panel: #1b1e27; --ink: #eceef3; --muted: #9aa1ae;
      --grid: #262a35; --well: #161921; --accent: #ff7a50;
      --fence: #4a4232; --tile-a: #18221b; --tile-b: #1c2820;
      --snake: #5cc27a; --snake-head: #4aae68; --snake-spot: #9be3ad;
      --eye: #ffffff; --pupil: #12141a;
      --berry: #ff5c72; --berry-seed: #ffd6dc; --leaf: #5cc27a;
      --gold: #ffc94d; --gold-edge: #e09a20;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12141a; --panel: #1b1e27; --ink: #eceef3; --muted: #9aa1ae;
    --grid: #262a35; --well: #161921; --accent: #ff7a50;
    --fence: #4a4232; --tile-a: #18221b; --tile-b: #1c2820;
    --snake: #5cc27a; --snake-head: #4aae68; --snake-spot: #9be3ad;
    --eye: #ffffff; --pupil: #12141a;
    --berry: #ff5c72; --berry-seed: #ffd6dc; --leaf: #5cc27a;
    --gold: #ffc94d; --gold-edge: #e09a20;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: var(--app-h); overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    display: flex; flex-direction: column; gap: 10px;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  .home {
    flex: none; align-self: flex-start;
    min-height: 44px; display: inline-flex; align-items: center; padding: 0 8px; margin-left: -8px;
    color: var(--muted); font-size: 14px; text-decoration: none; border-radius: 8px;
  }
  .home:hover, .home:focus-visible { color: var(--ink); }
  .home:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* 제목 + HUD 행 */
  .top {
    flex: none; height: 52px; width: 100%; max-width: max(var(--board, 560px), 480px); align-self: center;
    display: flex; align-items: center; gap: 10px;
  }
  .title { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; flex: 1; }
  .hud { display: flex; gap: 6px; }
  .card {
    background: var(--panel); border: 1px solid var(--grid); border-radius: 10px;
    padding: 6px 12px; min-width: 72px; line-height: 1.15;
  }
  .card .lab { display: block; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .08em; }
  .card b { display: inline-block; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; transform-origin: left center; }
  .card b.rec { color: var(--accent); }
  .card b.bump { animation: bump 160ms ease-out; }
  @keyframes bump { 50% { transform: scale(1.15); } }
  .btns { display: flex; gap: 6px; }

  button {
    font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--grid);
    border-radius: 10px; cursor: pointer; touch-action: manipulation;
    transition: transform 80ms ease-out, background-color 80ms ease-out;
  }
  button:active, button.is-pressed { transform: scale(.94); background: var(--grid); }
  button:disabled { opacity: .5; cursor: default; }
  button.icon { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; font-size: 18px; color: var(--ink); }
  button.icon svg { width: 22px; height: 22px; }
  button.icon svg[hidden] { display: none; }
  button.primary {
    background: var(--accent); color: #fff; border-color: transparent; font-weight: 700;
    height: 48px; padding: 0 24px; font-size: 18px;
  }
  button.primary:active { background: var(--accent); filter: brightness(.92); }
  button.secondary, a.secondary {
    height: 44px; padding: 0 18px; font-size: 15px; background: var(--panel); color: var(--ink);
    border: 1px solid var(--grid); border-radius: 10px; display: inline-flex; align-items: center; text-decoration: none;
  }

  /* 보드 */
  .stage { flex: 1 1 0; min-height: 0; position: relative; }
  .board {
    position: absolute; inset: 0; margin: auto; width: 300px; height: 300px;
    border: 4px solid var(--fence); border-radius: 12px; background: var(--tile-a);
    touch-action: none; transition: border-color 150ms ease-out;
  }
  .board.flash { border-color: var(--gold); }
  .board.shake { animation: shake 240ms linear; }
  @keyframes shake {
    0%,100% { transform: translateX(0); } 16% { transform: translateX(-6px); } 33% { transform: translateX(6px); }
    50% { transform: translateX(-6px); } 66% { transform: translateX(6px); } 83% { transform: translateX(-6px); }
  }
  canvas#cv { display: block; width: 100%; height: 100%; border-radius: 8px; }
  .overlay {
    position: absolute; inset: 0; border-radius: 8px; padding: 16px;
    display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; text-align: center;
    background: color-mix(in srgb, var(--well) 84%, transparent); line-height: 1.4;
    animation: ovIn 200ms ease-out;
  }
  .overlay > * { animation: ovUp 200ms ease-out; }
  @keyframes ovIn { from { opacity: 0; } }
  @keyframes ovUp { from { transform: translateY(8px); } }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font-size: 24px; font-weight: 800; }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; }
  .overlay .small { font-size: 12px; }
  .overlay .row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .legend { display: flex; gap: 14px; color: var(--ink); font-size: 14px; font-weight: 700; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend canvas { width: 20px; height: 20px; }
  .big { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .badge { background: var(--gold); color: #1f2430; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 4px 10px; }
  .badge[hidden] { display: none; }

  .hint { flex: none; height: 40px; margin: 0; display: flex; align-items: center; justify-content: center;
          color: var(--muted); font-size: 13px; text-align: center; }
  .dpad { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* 터치 기기: D-pad */
  @media (pointer: coarse) {
    .hint { display: none; }
    .dpad {
      flex: none; align-self: center; display: grid; gap: 8px;
      grid-template-columns: repeat(3, 72px); grid-template-rows: repeat(3, 72px);
      touch-action: none;
    }
    .dpad button { border-radius: 16px; font-size: 26px; color: var(--ink); padding: 0; touch-action: none; }
    .dpad .up { grid-area: 1 / 2; } .dpad .left { grid-area: 2 / 1; }
    .dpad .right { grid-area: 2 / 3; } .dpad .down { grid-area: 3 / 2; }
    .dpad .dot { grid-area: 2 / 2; width: 20px; height: 20px; border-radius: 50%; background: var(--grid); place-self: center; }
  }
  @media (pointer: coarse) and (max-width: 499px) {
    .dpad { grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); }
    .title { display: none; }
    .hud { flex: 1; }
    .card { min-width: 0; flex: 1; padding: 6px 8px; }
  }
  /* iPad 가로: 보드 왼쪽, 오른쪽 열(제목·버튼·HUD·D-pad) */
  @media (pointer: coarse) and (orientation: landscape) {
    body {
      display: grid; column-gap: 20px; row-gap: 10px;
      grid-template-columns: minmax(0, 1fr) 260px;
      grid-template-rows: 44px auto auto auto minmax(0, 1fr) auto;
      grid-template-areas: "home home" "stage title" "stage btns" "stage hud" "stage ." "stage dpad";
    }
    .home { grid-area: home; }
    .top { display: contents; }
    .title { grid-area: title; font-size: 18px; flex: none; }
    .btns { grid-area: btns; }
    .hud { grid-area: hud; flex-direction: column; gap: 8px; }
    .stage { grid-area: stage; }
    .dpad { grid-area: dpad; justify-self: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .board.shake { animation: none; }
    .overlay, .overlay > *, .card b.bump { animation: none; }
  }
</style>
</head>
<body>
  <a class="home" href="../../">← 게임 목록</a>
  <header class="top">
    <h1 class="title">뱀 정원</h1>
    <div class="hud">
      <div class="card"><span class="lab">점수</span><b id="score">0</b></div>
      <div class="card"><span class="lab">길이</span><b id="len">3</b></div>
      <div class="card"><span class="lab">최고</span><b id="best">0</b></div>
    </div>
    <div class="btns">
      <button class="icon" id="muteBtn" aria-label="소리 끄기" aria-pressed="false">
        <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg id="icoOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>
      </button>
      <button class="icon" id="pauseBtn" aria-label="일시정지">Ⅱ</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="board" id="board">
      <canvas id="cv" role="img" aria-label="뱀 정원 게임 보드"></canvas>

      <div class="overlay" id="ovStart">
        <h2>뱀 정원</h2>
        <p>열매를 먹고 길어지세요. 울타리와 내 몸은 피하기!</p>
        <div class="legend">
          <span><canvas class="mini" data-kind="berry" width="40" height="40"></canvas>+10</span>
          <span><canvas class="mini" data-kind="gold" width="40" height="40"></canvas>+50</span>
        </div>
        <p>최고 <b id="startBest">0</b>점</p>
        <button class="primary" id="startBtn">시작하기</button>
        <p class="small" id="ctrlHint">방향키/WASD 이동 · Space 일시정지</p>
      </div>

      <div class="overlay" id="ovPause" hidden>
        <h2>일시정지</h2>
        <div class="row">
          <button class="primary" id="resumeBtn">계속하기</button>
          <button class="secondary" id="restartBtn">처음부터</button>
        </div>
      </div>

      <div class="overlay" id="ovOver" hidden>
        <span class="badge" id="newRec" hidden>새 기록!</span>
        <h2 id="overTitle">게임 끝</h2>
        <div class="big" id="overScore">0</div>
        <p id="overInfo">길이 3칸 · 최고 0점</p>
        <div class="row">
          <button class="primary" id="againBtn">다시 하기</button>
          <a class="secondary" href="../../">← 게임 목록</a>
        </div>
      </div>
    </div>
  </div>

  <p class="hint">방향키/WASD 이동 · P/Esc/Space 일시정지 · Enter 시작</p>

  <div class="dpad" id="dpad">
    <button class="up" data-dir="up" aria-label="위로">▲</button>
    <button class="left" data-dir="left" aria-label="왼쪽으로">◀</button>
    <span class="dot" aria-hidden="true"></span>
    <button class="right" data-dir="right" aria-label="오른쪽으로">▶</button>
    <button class="down" data-dir="down" aria-label="아래로">▼</button>
  </div>

  <div class="sr" aria-live="polite" id="live"></div>

<script>
/* ===== 뱀 정원 (snake-garden) Sound module =====
 * Web Audio API 실시간 합성. 외부 파일/의존성 없음.
 * AudioContext 미지원·실패 시 모든 호출은 조용히 무시된다.
 * 사용법: 첫 터치/클릭/키 입력 핸들러 안에서 Sound.unlock() 호출 → 이후 Sound.play('eat') 등.
 */
const Sound = (function () {
  'use strict';
  var MUTE_KEY = 'snake-garden-muted';
  var MASTER_VOL = 0.5;   // 효과음 전체
  var MUSIC_VOL = 0.07;   // 배경음악 (아주 조용히)

  var ctx = null, master = null, musicBus = null, noiseBuf = null;
  var muted = false;
  var lastTurn = 0;
  var music = { on: false, timer: null, step: 0, nextTime: 0 };

  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) { muted = false; }

  function ensureCtx() {
    if (ctx) return ctx;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : MASTER_VOL;
      master.connect(ctx.destination);
      musicBus = ctx.createGain();
      musicBus.gain.value = MUSIC_VOL;
      musicBus.connect(master);
      // 노이즈 버퍼 (0.5초)
      var len = Math.floor(ctx.sampleRate * 0.5);
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ctx = null; }
    return ctx;
  }

  function ready() {
    return ctx && ctx.state === 'running' && !muted;
  }

  // 기본 음: 파형, 주파수(시작→끝), 시작시각, 길이, 피크 볼륨, 어택
  function tone(type, f0, f1, t, dur, vol, attack, dest) {
    try {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      var a = attack || 0.005;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest || master);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }

  function noise(t, dur, vol, filterType, freq, freqEnd) {
    try {
      var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noiseBuf;
      f.type = filterType; f.frequency.setValueAtTime(freq, t);
      if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(master);
      s.start(t); s.stop(t + dur + 0.02);
    } catch (e) {}
  }

  var N = { C4: 261.63, D4: 293.66, E4: 329.63, G4: 392.0, A4: 440.0,
            C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880.0, C6: 1046.5, E6: 1318.5 };

  var sfx = {
    // 게임 시작: 상승 3음 아르페지오 (C5-E5-G5)
    start: function (t) {
      tone('triangle', N.C5, 0, t, 0.12, 0.30);
      tone('triangle', N.E5, 0, t + 0.08, 0.12, 0.30);
      tone('triangle', N.G5, 0, t + 0.16, 0.22, 0.30);
    },
    // 방향 전환: 아주 작은 틱 (60ms 이내 연속 호출은 무시)
    turn: function (t) {
      if (t - lastTurn < 0.06) return;
      lastTurn = t;
      tone('sine', 1400, 1100, t, 0.03, 0.04, 0.002);
    },
    // 일반 열매: 짧은 '뽁' — 상승 스윕
    eat: function (t) {
      tone('square', 520, 1040, t, 0.08, 0.12, 0.003);
      tone('sine', 1040, 0, t + 0.04, 0.06, 0.08);
    },
    // 보너스 열매 등장: 반짝 2음 + 고음 쉬머
    bonusSpawn: function (t) {
      tone('sine', N.E6, 0, t, 0.10, 0.12);
      tone('sine', N.C6, 0, t + 0.07, 0.14, 0.10);
      noise(t, 0.18, 0.04, 'highpass', 6000);
    },
    // 보너스 열매 사라짐(시간 초과): 하강 2음, 작게
    bonusExpire: function (t) {
      tone('sine', N.G5, 0, t, 0.08, 0.07);
      tone('sine', N.D5, 0, t + 0.07, 0.12, 0.06);
    },
    // 보너스 열매 먹기: 빠른 상승 4음 아르페지오 + 반짝임
    bonusEat: function (t) {
      var notes = [N.C5, N.E5, N.G5, N.C6];
      for (var i = 0; i < notes.length; i++) tone('triangle', notes[i], 0, t + i * 0.05, 0.12, 0.25);
      tone('sine', N.E6, 0, t + 0.2, 0.25, 0.08);
    },
    // 최고 점수 갱신: 짧은 팡파르 (G4-C5-E5 → G5 길게)
    highScore: function (t) {
      tone('square', N.G4, 0, t, 0.10, 0.10);
      tone('square', N.C5, 0, t + 0.10, 0.10, 0.10);
      tone('square', N.E5, 0, t + 0.20, 0.10, 0.10);
      tone('triangle', N.G5, 0, t + 0.30, 0.45, 0.28, 0.01);
      tone('triangle', N.C6, 0, t + 0.30, 0.45, 0.12, 0.01);
    },
    // 게임 오버: 쿵(노이즈) + 하강 톱니파
    gameOver: function (t) {
      noise(t, 0.25, 0.25, 'lowpass', 1200, 150);
      tone('sawtooth', 330, 82, t + 0.05, 0.6, 0.15, 0.01);
      tone('triangle', N.E4, 0, t + 0.25, 0.25, 0.12);
      tone('triangle', N.C4, 0, t + 0.45, 0.45, 0.12);
    },
    // 일시정지/재개: 부드러운 단음
    pause: function (t) { tone('sine', N.A4, N.E4, t, 0.12, 0.12); },
    resume: function (t) { tone('sine', N.E4, N.A4, t, 0.12, 0.12); }
  };

  // ---- 배경음악: 오리지널 8마디 펜타토닉 루프, 100 BPM, 8분음표 그리드 ----
  var BPM = 100, STEP = 60 / BPM / 2; // 8분음표 = 0.3초
  // 멜로디 (0 = 쉼표). C 메이저 펜타토닉, 오리지널 패턴, 32스텝 = 9.6초
  var MEL = [
    N.E5, 0, N.G5, 0, N.A5, N.G5, N.E5, 0,
    N.D5, 0, N.E5, 0, N.G5, 0, 0, 0,
    N.E5, 0, N.D5, 0, N.C5, N.D5, N.E5, 0,
    N.G4, 0, N.A4, 0, N.C5, 0, 0, 0
  ];
  // 베이스: 마디(8스텝)마다 C3, A2, D3, G2
  var BASS = [130.81, 110.0, 146.83, 98.0];

  function scheduleMusic() {
    if (!music.on || !ctx) return;
    try {
      while (music.nextTime < ctx.currentTime + 0.25) {
        var s = music.step % 32, t = music.nextTime;
        if (MEL[s]) tone('triangle', MEL[s], 0, t, STEP * 0.9, 0.5, 0.01, musicBus);
        if (s % 8 === 0) tone('sine', BASS[s / 8], 0, t, STEP * 7.5, 0.6, 0.03, musicBus);

      g.beginPath();
      g.moveTo(cx(p.x) + nx * .38 * c, cx(p.y) + ny * .38 * c);
      g.lineTo(cx(t.x) + nx * .15 * c, cx(t.y) + ny * .15 * c);
      g.lineTo(cx(t.x) - nx * .15 * c, cx(t.y) - ny * .15 * c);
      g.lineTo(cx(p.x) - nx * .38 * c, cx(p.y) - ny * .38 * c);
      g.closePath(); g.fill();
      g.beginPath(); g.arc(cx(t.x), cx(t.y), .15 * c, 0, Math.PI * 2); g.fill();
      if (L === 2) { g.beginPath(); g.arc(cx(p.x), cx(p.y), .38 * c, 0, Math.PI * 2); g.fill(); }
    }
    // 삼킴 볼록
    g.fillStyle = body;
    bulges.forEach(function (b) {
      var s = snake[b]; if (!s) return;
      g.beginPath(); g.arc(cx(s.x), cx(s.y), .46 * c, 0, Math.PI * 2); g.fill();
    });
    // 무늬
    g.fillStyle = dying ? mix(P['snake-spot'], P.muted, deadT * .5) : P['snake-spot'];
    for (var j = 2; j < L - 1; j += 2) {
      g.beginPath(); g.arc(cx(snake[j].x), cx(snake[j].y), .12 * c, 0, Math.PI * 2); g.fill();
    }
    // 머리
    var h = snake[0], ang;
    if (L >= 2) ang = Math.atan2(h.y - snake[1].y, h.x - snake[1].x); else ang = 0;
    var alpha = 1;
    if (mode === 'dying' && gt - dieAt < DIE_MS) {
      var phase = Math.floor((gt - dieAt) / 62.5) % 2;
      alpha = phase ? .3 : 1;
    }
    g.save();
    g.globalAlpha = alpha;
    g.translate(cx(h.x), cx(h.y)); g.rotate(ang);
    g.fillStyle = head;
    g.beginPath(); g.arc(.06 * c, 0, .46 * c, 0, Math.PI * 2); g.fill();
    var dead = mode === 'dying' || mode === 'over';
    [-1, 1].forEach(function (sd) {
      var ex = .12 * c, ey = sd * .20 * c;
      g.fillStyle = P.eye;
      g.beginPath(); g.arc(ex, ey, .15 * c, 0, Math.PI * 2); g.fill();
      if (dead) {
        var k = .07 * c;
        g.strokeStyle = P.pupil; g.lineWidth = .05 * c;
        g.beginPath(); g.moveTo(ex - k, ey - k); g.lineTo(ex + k, ey + k); g.moveTo(ex + k, ey - k); g.lineTo(ex - k, ey + k); g.stroke();
      } else {
        g.fillStyle = P.pupil;
        g.beginPath(); g.arc(ex + .04 * c, ey, .08 * c, 0, Math.PI * 2); g.fill();
      }
    });
    // 혀: 2초마다 150ms
    if (mode === 'playing' && (gt % 2000) < 150) {
      var x0 = .52 * c, x1 = x0 + .28 * c, f = .10 * c, a = 35 * Math.PI / 180;
      g.strokeStyle = P.accent; g.lineWidth = .06 * c;
      g.beginPath(); g.moveTo(x0, 0); g.lineTo(x1, 0);
      g.moveTo(x1, 0); g.lineTo(x1 + Math.cos(a) * f, -Math.sin(a) * f);
      g.moveTo(x1, 0); g.lineTo(x1 + Math.cos(a) * f, Math.sin(a) * f);
      g.stroke();
    }
    g.restore();
  }

  function drawFx() {
    effects = effects.filter(function (f) { return gt - f.t0 < f.dur; });
    effects.forEach(function (f) {
      var t = clamp01((gt - f.t0) / f.dur), x = cx(f.x), y = cx(f.y);
      g.save();
      if (f.type === 'parts') {
        var e = easeOut(t);
        g.globalAlpha = 1 - t; g.fillStyle = P[f.color];
        for (var i = 0; i < f.n; i++) {
          var a = i / f.n * Math.PI * 2, r = f.dist * c * e;
          var px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
          if (f.color === 'gold' && i % 2) {
            g.save(); g.translate(px, py); starPath(g, .12 * c, .055 * c); g.fill(); g.restore();
          } else { g.beginPath(); g.arc(px, py, .08 * c, 0, Math.PI * 2); g.fill(); }
        }
      } else if (f.type === 'pop') {
        g.globalAlpha = 1 - t; g.fillStyle = P[f.color];
        g.font = '800 ' + f.size + 'px system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
        g.textAlign = 'center'; g.textBaseline = 'middle';
        // 팝업이 보드 밖(특히 맨 위 줄)으로 나가 잘리지 않게 보드 안으로 클램프
        var tw = g.measureText(f.text).width / 2 + 2, th = f.size * .6 + 2;
        var tx = Math.min(size - tw, Math.max(tw, x));
        var ty = Math.max(th, y - .4 * c - .8 * c * easeOut(t));
        // 클램프되어 머리와 겹칠 때 읽히도록 밝은 테두리
        if (ty !== y - .4 * c - .8 * c * easeOut(t) || tx !== x) { g.lineJoin = 'round'; g.lineWidth = 3; g.strokeStyle = P['tile-a']; g.strokeText(f.text, tx, ty); }
        g.fillText(f.text, tx, ty);
      } else if (f.type === 'ring') {
        g.globalAlpha = .6 * (1 - easeOut(t)); g.strokeStyle = P['gold-edge']; g.lineWidth = .06 * c;
        g.beginPath(); g.arc(x, y, (.5 + .4 * easeOut(t)) * c, 0, Math.PI * 2); g.stroke();
      } else if (f.type === 'goldOut') {
        var s = 1 - t * t;
        drawGoldAt(g, x, y, c, s, 0, 1 - t, 0);
      }
      g.restore();
    });
  }

  function draw() {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, size, size);
    g.drawImage(bgCanvas, 0, 0, size, size);
    var reduce = mqReduce.matches;
    if (berry) {
      var s = easeOutBack(clamp01((gt - berry.born) / 180));
      if (!reduce) s *= 1 + .03 * (1 + Math.sin(gt / 1200 * Math.PI * 2));
      drawBerryAt(g, cx(berry.x), cx(berry.y), c, s);
    }
    if (gold) {
      var gs = easeOutBack(clamp01((gt - gold.born) / 260));
      var rot = reduce ? 0 : Math.sin(gt / 1600 * Math.PI * 2) * 8 * Math.PI / 180;
      var alpha = 1, ringColor = null;
      if (gold.left <= 2000) {
        var blink = Math.floor(gold.left / 125) % 2 === 1;
        if (reduce) ringColor = blink ? P.accent : null; else alpha = blink ? .3 : 1;
      }
      drawGoldAt(g, cx(gold.x), cx(gold.y), c, gs, rot, alpha, Math.max(0, gold.left / GOLD_MS), ringColor);
    }
    drawSnake();
    drawFx();
  }

  // ---------- 루프 ----------
  function frame(ts) {
    var dt = lastTs ? Math.min(100, ts - lastTs) : 16;
    lastTs = ts;
    if (mode !== 'paused') gt += dt;
    if (mode === 'playing') {
      if (gold) {
        gold.left -= dt;
        if (gold.left <= 0) {
          if (!mqReduce.matches) addFx({ type: 'goldOut', x: gold.x, y: gold.y, dur: 200 });
          gold = null;
          Sound.play('bonusExpire');
          respawnBerry();
        }
      }
      acc += dt;
      while (mode === 'playing' && acc >= tickMs()) { acc -= tickMs(); tick(); }
    }
    if (mode === 'dying' && gt - dieAt >= DIE_MS) showOver(false);
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- 레이아웃 ----------
  function fit() {
    var r = stage.getBoundingClientRect();
    var s = Math.floor(Math.min(r.width, r.height));
    if (mqFine.matches) s = Math.min(s, 560);
    s = Math.max(s, 120);
    board.style.width = s + 'px'; board.style.height = s + 'px';
    root.style.setProperty('--board', s + 'px');
    size = s - 8;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    var px = Math.round(size * dpr);
    if (cv.width !== px) { cv.width = px; cv.height = px; buildBg(); }
    c = size / N;
  }
  function setAppH() {
    var h = window.innerHeight;
    root.style.setProperty('--app-h', h + 'px');
    fit();
  }
  window.addEventListener('resize', setAppH);
  window.addEventListener('orientationchange', function () { setTimeout(setAppH, 50); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', setAppH);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
  function onTheme() { readPalette(); }
  if (mqDark.addEventListener) mqDark.addEventListener('change', onTheme); else if (mqDark.addListener) mqDark.addListener(onTheme);

  $('ctrlHint').textContent = mqCoarse.matches ? (window.matchMedia('(orientation: landscape)').matches ? '보드를 밀거나 오른쪽 버튼으로 이동' : '보드를 밀거나 아래 버튼으로 이동') : '방향키/WASD 이동 · Space 일시정지';

  // 테스트용 읽기 전용 상태 조회 (게임플레이에 영향 없음)
  window.__snake = {
    state: function () {
      return {
        mode: mode, dir: dir, queue: queue.slice(), score: score, length: snake.length, best: best,
        snake: snake.map(function (p) { return { x: p.x, y: p.y }; }),
        berry: berry ? { x: berry.x, y: berry.y } : null,
        gold: gold ? { x: gold.x, y: gold.y, left: gold.left } : null,
        tickMs: tickMs(), locked: performance.now() < lockUntil
      };
    }
  };

  setAppH();
  readPalette();
  reset();
  showOnly(ovStart);
  requestAnimationFrame(function () { setAppH(); requestAnimationFrame(frame); });
  // 터치 기기에서는 자동 포커스 링이 보이지 않도록 키보드 기기에서만 포커스
  if (!mqCoarse.matches) { try { $('startBtn').focus({ preventScroll: true }); } catch (e) {} }
})();
</script>
</body>
</html>
